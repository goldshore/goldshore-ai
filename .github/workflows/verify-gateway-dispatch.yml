name: Verify gateway repository dispatch token

# Manual post-rotation check for the marzton/goldshore-gateway GS_DISPATCH_TOKEN secret.
# The secret value must be a GitHub App installation token or a fine-grained PAT
# limited to marzton/goldshore-ai with Contents: write (repository_dispatch).

on:
  workflow_dispatch:
    inputs:
      token_owner:
        description: "Human or app owner documented for the rotated GS_DISPATCH_TOKEN"
        required: true
        type: string
      expires_on:
        description: "Expiration date for the rotated token, YYYY-MM-DD"
        required: true
        type: string
  repository_dispatch:
    types: [dispatch-token-rotation-verify]

permissions:
  contents: read

jobs:
  send-verification-dispatch:
    if: github.event_name == 'workflow_dispatch'
    name: Send verification dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate rotation metadata
        env:
          TOKEN_OWNER: ${{ inputs.token_owner }}
          EXPIRES_ON: ${{ inputs.expires_on }}
        run: |
          test -n "$TOKEN_OWNER" || (echo 'token_owner is required' && exit 1)
          test -n "$EXPIRES_ON" || (echo 'expires_on is required' && exit 1)
          if ! [[ "$EXPIRES_ON" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'expires_on must use YYYY-MM-DD format'
            exit 1
          fi

      - name: Create repository_dispatch with rotated token
        env:
          DISPATCH_TOKEN: ${{ secrets.GS_DISPATCH_TOKEN }}
          TOKEN_OWNER: ${{ inputs.token_owner }}
          EXPIRES_ON: ${{ inputs.expires_on }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          test -n "$DISPATCH_TOKEN" || (echo 'Missing secret: GS_DISPATCH_TOKEN' && exit 1)

          payload=$(jq -n \
            --arg run_id "$GH_RUN_ID" \
            --arg sha "$GH_SHA" \
            --arg owner "$TOKEN_OWNER" \
            --arg expires_on "$EXPIRES_ON" \
            '{event_type:"dispatch-token-rotation-verify", client_payload:{source:"verify-gateway-dispatch", run_id:$run_id, sha:$sha, token_owner:$owner, expires_on:$expires_on}}')

          status=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/dispatches" \
            -d "$payload")

          if [ "$status" != "204" ]; then
            echo "repository_dispatch verification failed with HTTP $status"
            cat /tmp/dispatch-response.json
            exit 1
          fi

          echo "repository_dispatch accepted for ${GH_REPOSITORY}. Confirm the paired dispatch-token-rotation-verify run appears in Actions before revoking the old PAT."

  receive-verification-dispatch:
    if: github.event_name == 'repository_dispatch'
    name: Receive verification dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm dispatch payload
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.run_id }}
          TOKEN_OWNER: ${{ github.event.client_payload.token_owner }}
          EXPIRES_ON: ${{ github.event.client_payload.expires_on }}
        run: |
          test "$SOURCE" = "verify-gateway-dispatch" || (echo "Unexpected source: $SOURCE" && exit 1)
          test -n "$SOURCE_RUN_ID" || (echo 'Missing source run id' && exit 1)
          test -n "$TOKEN_OWNER" || (echo 'Missing token owner' && exit 1)
          test -n "$EXPIRES_ON" || (echo 'Missing token expiration' && exit 1)
          echo "Received repository_dispatch verification from run ${SOURCE_RUN_ID}."
          echo "Rotated token owner: ${TOKEN_OWNER}"
          echo "Rotated token expires on: ${EXPIRES_ON}"
