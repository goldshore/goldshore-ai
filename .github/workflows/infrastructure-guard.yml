name: Infrastructure Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'apps/*/wrangler.toml'
      - '.github/workflows/infrastructure-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Job 1: Manifest integrity check ─────────────────────────────────────
  manifest-integrity:
    name: Manifest integrity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify INFRASTRUCTURE.md exists
        run: test -f infra/INFRASTRUCTURE.md || (echo "FAIL: infra/INFRASTRUCTURE.md is missing" && exit 1)

      - name: Verify branch-protection.json exists
        run: test -f infra/branch-protection.json || (echo "FAIL: infra/branch-protection.json is missing" && exit 1)

      - name: Verify all wrangler configs reference canonical worker names
        run: |
          # Dynamically extract canonical worker names from the Workers table in INFRASTRUCTURE.md
          CANONICAL_WORKERS=$(sed -n '/^## Workers/,/^---$/p' infra/INFRASTRUCTURE.md | grep -oP '^\| `\K[a-z0-9_-]+(?=` \|)' | sort -u)

          echo "Canonical workers:"
          echo "$CANONICAL_WORKERS"

          # Check each app-level wrangler.toml references a known worker name
          for toml in apps/*/wrangler.toml; do
            WORKER_NAME=$(grep '^name = ' "$toml" | head -1 | sed 's/name = "\(.*\)"/\1/')
            if [ -n "$WORKER_NAME" ] && ! echo "$CANONICAL_WORKERS" | grep -qx "$WORKER_NAME"; then
              echo "FAIL: $toml references unrecognized worker '$WORKER_NAME'"
              exit 1
            fi
          done

          echo "All wrangler configs reference canonical workers."

      - name: Verify D1 database IDs are consistent
        run: |
          # Check that wrangler.toml D1 IDs match INFRASTRUCTURE.md
          mismatch_found=0

          for toml in apps/*/wrangler.toml infra/Cloudflare/*.wrangler.toml; do
            [ -f "$toml" ] || continue
            DB_IDS=$(grep 'database_id' "$toml" | grep -oP '"[a-f0-9-]+"' | tr -d '"' || true)
            for db_id in $DB_IDS; do
              if ! grep -q "$db_id" infra/INFRASTRUCTURE.md; then
                echo "FAIL: $toml references D1 ID '$db_id' not found in INFRASTRUCTURE.md"
                mismatch_found=1
              fi
            done
          done

          if [ "$mismatch_found" -ne 0 ]; then
            echo "D1 ID consistency check failed."
            exit 1
          fi

          echo "D1 ID consistency check complete."

  # ─── Job 2: Cloudflare live state audit ──────────────────────────────────
  live-state-audit:
    name: Cloudflare live state audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUILD_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_BUILD_API_TOKEN" || (echo "Missing: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)

      - name: Audit live Cloudflare state against manifest
        env:
          CLOUDFLARE_BUILD_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ["CLOUDFLARE_BUILD_API_TOKEN"]
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def cf_get(path):
              url = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      if not data.get("success"):
                          raise SystemExit(f"CF API error: {url} → {data}")
                      return data["result"]
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  raise SystemExit(f"CF API HTTP error: {url} → {e.code} {body}")

          # List workers from the account
          workers = cf_get("workers/scripts")
          live_names = sorted(w["id"] for w in workers)

          # Read canonical list from INFRASTRUCTURE.md
          with open("infra/INFRASTRUCTURE.md") as f:
              manifest = f.read()

          # Extract worker names from the manifest table
          import re
          canonical = sorted(set(re.findall(r"\| `([a-z0-9_-]+)` \|", manifest)))

          print(f"Live workers:     {live_names}")
          print(f"Canonical workers: {canonical}")

          unknown = set(live_names) - set(canonical)
          if unknown:
              print(f"WARNING: Unrecognized workers in account: {unknown}")
              print("These workers are NOT in infra/INFRASTRUCTURE.md — audit required.")

          print("Cloudflare live state audit complete.")
          PY
