name: Infrastructure Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'apps/*/wrangler.toml'
      - 'apps/gs-web/astro.config.mjs'
      - 'apps/gs-web/src/worker.ts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-app-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce the two-app workspace and deploy workflow names
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workspace = Path('pnpm-workspace.yaml').read_text()
          apps = sorted(re.findall(r"^\s*-\s*['\"]apps/([^'\"]+)['\"]", workspace, re.MULTILINE))
          if apps != ['gs-api', 'gs-web']:
              raise SystemExit(f'workspace deployable apps must be gs-api and gs-web, found {apps}')
          workflows = sorted(path.name for path in Path('.github/workflows').glob('deploy-*.yml'))
          if workflows != ['deploy-gs-api.yml', 'deploy-gs-web.yml']:
              raise SystemExit(f'deploy workflow names must remain fixed, found {workflows}')
          PY
      - name: Enforce dashboard and Workers Builds authority
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'wrangler\s+(pages\s+deploy|secret\s+|d1\s+.*--remote|deploy\s+(?!.*--dry-run))|cloudflare/wrangler-action' .github/workflows --glob '*.yml' --glob '!infrastructure-guard.yml' --pcre2; then
            echo 'Cloudflare mutations are forbidden in GitHub workflows.'
            exit 1
          fi
          if rg -n 'CLOUDFLARE_(API_TOKEN|BUILD_API_TOKEN|GOLDSHORE_AI_DEPLOY_TOKEN)' .github/workflows --glob '*.yml' --glob '!cloudflare-audit.yml' --glob '!infrastructure-guard.yml'; then
            echo 'Only the read-only audit workflow may receive a Cloudflare token.'
            exit 1
          fi
      - name: Verify routes, Worker-with-Assets, and redacted inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export-cloudflare-inventory.py cloudflare-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('cloudflare-inventory.json').read_text())
          workers = {item['worker']: item for item in inventory['workers']}
          if set(workers) != {'gs-api', 'gs-web'}:
              raise SystemExit(f'expected only gs-api and gs-web manifests, found {sorted(workers)}')

          web = Path('apps/gs-web/wrangler.toml').read_text()
          if 'main = "./src/worker.ts"' not in web or 'binding = "ASSETS"' not in web:
              raise SystemExit('gs-web must remain an Astro Worker-with-Assets')
          for route in ('goldshore.ai/*', 'goldshore.org/*', 'admin.goldshore.ai/*', 'admin.goldshore.org/*'):
              if route not in workers['gs-web']['route_ownership']:
                  raise SystemExit(f'missing gs-web mirror route: {route}')
          for route in ('api.goldshore.ai/*', 'api.goldshore.org/*'):
              if route not in workers['gs-api']['route_ownership']:
                  raise SystemExit(f'missing gs-api mirror route: {route}')
          PY
