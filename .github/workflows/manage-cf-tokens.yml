name: Inventory Cloudflare secret names

# Read-only drift inventory. Cloudflare production configuration is changed only
# by an approved human in the dashboard; this workflow has no Cloudflare credentials.
on:
  pull_request:
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/dashboard-inventory.json'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/manage-cf-tokens.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/dashboard-inventory.json'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/manage-cf-tokens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Export redacted expected state
    runs-on: ubuntu-latest
    steps:
      - name: Normalize CF user token
        env:
          RAW_CF_USER_TOKEN: ${{ secrets.CF_USER_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re

          raw = os.environ.get("RAW_CF_USER_TOKEN", "")
          token = raw.replace("\r", "").replace("\n", "").strip()
          bearer = re.search(r"(?:authorization\s*:\s*)?bearer\s+([^\s\"',;}]+)", token, re.I)
          if bearer:
              token = bearer.group(1)
          cfut = re.search(r"cfut_[A-Za-z0-9_-]+", token)
          if cfut:
              token = cfut.group(0)
          token = re.sub(r"^[`'\"]+|[`'\",;}]+$", "", token)
          token = re.sub(r"\s+", "", token)

          if not token:
              print("No CF_USER_TOKEN provided; workflow will use CF_AUTH_EMAIL + CF_AUTH_KEY if configured.")
              raise SystemExit(0)

          print(f"Normalized CF_USER_TOKEN (masked): {token[:4]}...{token[-4:] if len(token) > 8 else ''}")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CF_USER_TOKEN={token}\n")
          PY

      - name: Verify credentials
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          API_BASE = "https://api.cloudflare.com/client/v4"

          token = os.environ.get("CF_USER_TOKEN", "").strip()
          email = os.environ.get("CF_AUTH_EMAIL", "").strip()
          key   = os.environ.get("CF_AUTH_KEY",   "").strip()

          def cf_get(path, headers, method):
              req = urllib.request.Request(f"{API_BASE}/{path}", headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                      if not data["success"]:
                          raise SystemExit(f"Auth rejected on {path} (auth method: {method}): {data['errors']}")
                      return data["result"]
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  raise SystemExit(f"HTTP {e.code} on /{path} (auth method: {method}):\n{body}")

          if email and key:
              headers = {"X-Auth-Email": email, "X-Auth-Key": key, "Content-Type": "application/json"}
              method  = "Global API Key"
              print(f"Using Global API Key for email: {email}")
              user = cf_get("user", headers, method)
              print(f"Email       : {user.get('email')}")
              print(f"Username    : {user.get('username')}")
          elif token:
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              method  = "API Token (Bearer)"
              print(f"Using API Token (masked): {token[:4]}...{token[-4:] if len(token)>8 else ''}")
              verified = cf_get("user/tokens/verify", headers, method)
              print(f"Token ID    : {verified.get('id')}")
              print(f"Token status: {verified.get('status')}")
              if verified.get("status") != "active":
                  raise SystemExit(f"Cloudflare token is not active: {verified.get('status')}")
          else:
              raise SystemExit("No credentials. Configure CF_USER_TOKEN or both CF_AUTH_EMAIL and CF_AUTH_KEY as GitHub secrets.")
          PY

      - name: List tokens
        if: inputs.action == 'list'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ.get("CF_USER_TOKEN", "").strip()
          email = os.environ.get("CF_AUTH_EMAIL", "").strip()
          key   = os.environ.get("CF_AUTH_KEY",   "").strip()

          if email and key:
              headers = {"X-Auth-Email": email, "X-Auth-Key": key, "Content-Type": "application/json"}
              method = "Global API Key"
          elif token:
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              method = "API Token (Bearer)"
          else:
              raise SystemExit("No credentials. Configure CF_USER_TOKEN or both CF_AUTH_EMAIL and CF_AUTH_KEY as GitHub secrets.")

          print(f"Auth method : {method}")

          def cf_get(path):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                      if not data["success"]:
                          raise SystemExit(f"CF API error: {data}")
                      return data["result"]
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  raise SystemExit(f"CF API HTTP {e.code} on {path} (auth method: {method}):\n{body}")

          tokens = cf_get("user/tokens")
          print(f"{'Name':<40} {'Status':<10} {'Last Used'}")
          print("-" * 70)
          for t in tokens:
              last = t.get("modified_on", "never")[:10]
              print(f"{t['name']:<40} {t['status']:<10} {last}")
          PY

      - name: Create token
        if: inputs.action == 'create'
        env:
          TOKEN_NAME: ${{ inputs.token_name }}
          TOKEN_PERMISSIONS: ${{ inputs.token_permissions }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token   = os.environ.get("CF_USER_TOKEN", "").strip()
          email   = os.environ.get("CF_AUTH_EMAIL", "").strip()
          key     = os.environ.get("CF_AUTH_KEY",   "").strip()
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          NAME    = os.environ["TOKEN_NAME"]
          PERMS_RAW = os.environ.get("TOKEN_PERMISSIONS", "").strip() or \
              "workers_scripts:edit,d1:edit,kv_storage:edit,pages:edit,workers_routes:edit,account_settings:read"

          if email and key:
              headers = {"X-Auth-Email": email, "X-Auth-Key": key, "Content-Type": "application/json"}
              method = "Global API Key"
          elif token:
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              method = "API Token (Bearer)"
          else:
              raise SystemExit("No credentials. Configure CF_USER_TOKEN or both CF_AUTH_EMAIL and CF_AUTH_KEY as GitHub secrets.")

          print(f"Auth method : {method}")

          # Keyword aliases: shorthand input -> words that must appear in the CF group name
          PERM_KEYWORDS = {
              "workers_scripts:edit": (["workers scripts"], "edit"),
              "workers_routes:edit":  (["workers routes"], "edit"),
              "d1:edit":              (["d1"], "edit"),
              "kv_storage:edit":      (["kv storage"], "edit"),
              "pages:edit":           (["pages"], "edit"),
              "account_settings:read":(["account settings"], "read"),
              "r2_storage:edit":      (["r2 storage"], "edit"),
              "queues:edit":          (["queues"], "edit"),
          }

          # Fetch live permission group list so IDs are always current
          def cf_get(path):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                      if not data["success"]:
                          raise SystemExit(f"CF API error on {path}: {data}")
                      return data["result"]
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"CF API HTTP {e.code} on {path}:\n{e.read().decode()}")

          all_groups = cf_get("user/tokens/permission_groups")
          print(f"Fetched {len(all_groups)} permission groups from Cloudflare API")

          def find_group(keywords, effect):
              kws = [k.lower() for k in keywords]
              effect_lc = effect.lower()
              for g in all_groups:
                  name_lc = g["name"].lower()
                  scope_lc = g.get("scope_type", "").lower() if "scope_type" in g else ""
                  # match all keywords in name
                  if all(k in name_lc for k in kws):
                      # prefer group whose name contains the effect word
                      if effect_lc in name_lc:
                          return g["id"]
              # fallback: first match without effect constraint
              for g in all_groups:
                  name_lc = g["name"].lower()
                  if all(k in name_lc for k in kws):
                      return g["id"]
              return None

          perms = []
          for p in PERMS_RAW.split(","):
              p = p.strip()
              if not p:
                  continue
              if p in PERM_KEYWORDS:
                  keywords, effect = PERM_KEYWORDS[p]
                  gid = find_group(keywords, effect)
                  if gid:
                      perms.append({"id": gid, "effect": "allow"})
                      print(f"  ✓ {p} -> {gid}")
                  else:
                      print(f"  WARNING: no match found for '{p}' — skipping")
              else:
                  print(f"  WARNING: unknown permission shorthand '{p}', skipping")

          body = json.dumps({
              "name": NAME,
              "policies": [{
                  "effect": "allow",
                  "resources": {f"com.cloudflare.api.account.{ACCOUNT}": "*"},
                  "permission_groups": perms,
              }],
          }).encode()

          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens",
              data=body,
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
                  if not data["success"]:
                      raise SystemExit(f"CF API error: {data}")
                  result = data["result"]
                  print(f"✅ Token created: {result['name']}")
                  print(f"   ID:    {result['id']}")
                  print(f"   Value: {result['value']}")
                  print()
                  print("⚠️  Copy the token value now — it will not be shown again.")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              raise SystemExit(f"CF API HTTP {e.code} on user/tokens (auth method: {method}):\n{body}")
          PY

      - name: Delete token
        if: inputs.action == 'delete'
        env:
          TOKEN_NAME: ${{ inputs.token_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ.get("CF_USER_TOKEN", "").strip()
          email = os.environ.get("CF_AUTH_EMAIL", "").strip()
          key   = os.environ.get("CF_AUTH_KEY",   "").strip()
          NAME  = os.environ["TOKEN_NAME"]

          if email and key:
              headers = {"X-Auth-Email": email, "X-Auth-Key": key, "Content-Type": "application/json"}
              method = "Global API Key"
          elif token:
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              method = "API Token (Bearer)"
          else:
              raise SystemExit("No credentials. Configure CF_USER_TOKEN or both CF_AUTH_EMAIL and CF_AUTH_KEY as GitHub secrets.")

          print(f"Auth method : {method}")

          def cf(http_method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/{path}",
                  data=json.dumps(body).encode() if body else None,
                  headers=headers,
                  method=http_method,
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                      if not data["success"]:
                          raise SystemExit(f"CF API error: {data}")
                      return data["result"]
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  raise SystemExit(f"CF API HTTP {e.code} on {path} (auth method: {method}):\n{body}")

          tokens = cf("GET", "user/tokens")
          match  = [t for t in tokens if t["name"] == NAME]
          if not match:
              raise SystemExit(f"No token found with name '{NAME}'")
          for t in match:
              cf("DELETE", f"user/tokens/{t['id']}")
              print(f"\U0001f5d1️  Deleted token: {t['name']} ({t['id']})")
          PY
