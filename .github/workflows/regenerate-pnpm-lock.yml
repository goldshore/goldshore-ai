# Manual operations guide:
# - Use this workflow only when package manifests changed and pnpm-lock.yaml must be refreshed.
# - It creates/updates one dedicated lockfile PR from the selected base branch.
name: "Manual: Regenerate pnpm Lockfile"
run-name: "Regenerate pnpm lockfile • ${{ inputs.base_branch }} • @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to regenerate from"
        required: true
        default: "main"
      update_branch:
        description: "Branch that will receive the lockfile commit"
        required: true
        default: "automation/pnpm-lockfile-refresh"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4.0.2
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Stop if lockfile is unchanged
        id: diff
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit lockfile update
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push --force-with-lease origin "$UPDATE_BRANCH"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
        run: |
          set -euo pipefail
          cat > pr-body.md <<'BODY'
          Merge Strategy: Squash

          Regenerates `pnpm-lock.yaml` from the selected base branch using pinned `pnpm@9.0.0`.

          Use this PR as the single lockfile refresh path to avoid repeated lockfile conflicts across ordinary feature PRs.
          BODY

          existing_pr="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --body-file pr-body.md
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: regenerate pnpm lockfile" \
              --body-file pr-body.md
          fi
