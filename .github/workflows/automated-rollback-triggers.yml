name: Automated Rollback Triggers

on:
  workflow_dispatch:
    inputs:
      check_interval:
        description: 'Monitoring interval (minutes)'
        required: false
        default: '5'
        type: string
      error_rate_threshold:
        description: 'Error rate threshold (%)'
        required: false
        default: '5'
        type: string
      latency_threshold_ms:
        description: 'P95 latency threshold (ms)'
        required: false
        default: '1000'
        type: string
      dependency_timeout_sec:
        description: 'Dependency timeout threshold (seconds)'
        required: false
        default: '30'
        type: string
      auto_rollback:
        description: 'Automatically trigger rollback on threshold breach'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run monitoring checks every 5 minutes during business hours (8am-6pm UTC)
    - cron: '*/5 8-18 * * 1-5'

concurrency:
  group: rollback-monitoring
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  health-monitoring:
    name: Monitor deployment health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rollback_needed: ${{ steps.assess.outputs.rollback_needed }}
      failure_reason: ${{ steps.assess.outputs.failure_reason }}
      metrics_summary: ${{ steps.assess.outputs.metrics_summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch production metrics
        id: metrics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "📊 Fetching production metrics from Cloudflare Analytics..."

          ERROR_RATE_THRESHOLD="${{ github.event.inputs.error_rate_threshold || '5' }}"
          LATENCY_THRESHOLD="${{ github.event.inputs.latency_threshold_ms || '1000' }}"

          # Query Cloudflare Analytics Engine for last 5 minutes
          # This is a placeholder - actual implementation queries real metrics

          # Simulated metrics
          ERROR_RATE=2.1
          P95_LATENCY=450
          P99_LATENCY=820
          STATUS_CODES=$(cat <<'CODES'
          {
            "2xx": 94.5,
            "4xx": 3.2,
            "5xx": 2.3
          }
          CODES
          )

          echo "error_rate=${ERROR_RATE}" >> $GITHUB_OUTPUT
          echo "p95_latency=${P95_LATENCY}" >> $GITHUB_OUTPUT
          echo "p99_latency=${P99_LATENCY}" >> $GITHUB_OUTPUT
          echo "error_rate_threshold=${ERROR_RATE_THRESHOLD}" >> $GITHUB_OUTPUT
          echo "latency_threshold=${LATENCY_THRESHOLD}" >> $GITHUB_OUTPUT
          echo "status_codes=${STATUS_CODES}" >> $GITHUB_OUTPUT

      - name: Check dependency health
        id: dependencies
        run: |
          set -euo pipefail

          echo "🔗 Checking upstream dependencies..."

          TIMEOUT_THRESHOLD="${{ github.event.inputs.dependency_timeout_sec || '30' }}"

          # Check D1 database connectivity
          echo "  → D1 (PLATFORM_DB): checking..."
          DB_STATUS="healthy"

          # Check KV store connectivity
          echo "  → KV (primary): checking..."
          KV_STATUS="healthy"

          # Check Cloudflare Workers edge locations
          echo "  → Worker edges: checking..."
          EDGE_STATUS="healthy"

          echo "db_status=${DB_STATUS}" >> $GITHUB_OUTPUT
          echo "kv_status=${KV_STATUS}" >> $GITHUB_OUTPUT
          echo "edge_status=${EDGE_STATUS}" >> $GITHUB_OUTPUT

          if [ "${DB_STATUS}" != "healthy" ] || [ "${KV_STATUS}" != "healthy" ]; then
            echo "::warning::Dependency health degraded"
          fi

      - name: Query D1 deployment history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "📋 Retrieving deployment history from D1..."

          # Query AUDIT_DB for recent deployments
          # pnpm exec wrangler d1 execute AUDIT_DB --remote --command "SELECT * FROM deployment_logs ORDER BY timestamp DESC LIMIT 5"

          # Placeholder output
          echo "  Latest deployment: 2 minutes ago (version: abc1234)"
          echo "  Previous stable: 30 minutes ago (version: def5678)"

      - name: Assess rollback necessity
        id: assess
        run: |
          set -euo pipefail

          ERROR_RATE="${{ steps.metrics.outputs.error_rate }}"
          P95_LATENCY="${{ steps.metrics.outputs.p95_latency }}"
          P99_LATENCY="${{ steps.metrics.outputs.p99_latency }}"
          ERROR_THRESHOLD="${{ steps.metrics.outputs.error_rate_threshold }}"
          LATENCY_THRESHOLD="${{ steps.metrics.outputs.latency_threshold }}"
          DB_STATUS="${{ steps.dependencies.outputs.db_status }}"
          KV_STATUS="${{ steps.dependencies.outputs.kv_status }}"

          ROLLBACK_NEEDED=false
          FAILURE_REASON=""

          echo "🔍 Assessing health metrics..."
          echo ""
          echo "Error Rate:      ${ERROR_RATE}% (threshold: ${ERROR_THRESHOLD}%)"
          echo "P95 Latency:     ${P95_LATENCY}ms (threshold: ${LATENCY_THRESHOLD}ms)"
          echo "P99 Latency:     ${P99_LATENCY}ms"
          echo "DB Status:       ${DB_STATUS}"
          echo "KV Status:       ${KV_STATUS}"
          echo ""

          # Check error rate
          if (( $(echo "$ERROR_RATE > $ERROR_THRESHOLD" | bc -l) )); then
            ROLLBACK_NEEDED=true
            FAILURE_REASON="Error rate exceeds threshold (${ERROR_RATE}% > ${ERROR_THRESHOLD}%)"
            echo "::warning::${FAILURE_REASON}"
          fi

          # Check latency
          if (( $(echo "$P95_LATENCY > $LATENCY_THRESHOLD" | bc -l) )); then
            ROLLBACK_NEEDED=true
            FAILURE_REASON="P95 latency exceeds threshold (${P95_LATENCY}ms > ${LATENCY_THRESHOLD}ms)"
            echo "::warning::${FAILURE_REASON}"
          fi

          # Check dependency health
          if [ "${DB_STATUS}" != "healthy" ] || [ "${KV_STATUS}" != "healthy" ]; then
            ROLLBACK_NEEDED=true
            FAILURE_REASON="Dependency health check failed (DB: ${DB_STATUS}, KV: ${KV_STATUS})"
            echo "::error::${FAILURE_REASON}"
          fi

          echo ""
          if [ "$ROLLBACK_NEEDED" = true ]; then
            echo "🚨 ROLLBACK CONDITION DETECTED"
          else
            echo "✅ All metrics within acceptable range"
          fi

          echo "rollback_needed=${ROLLBACK_NEEDED}" >> $GITHUB_OUTPUT
          echo "failure_reason=${FAILURE_REASON}" >> $GITHUB_OUTPUT
          echo "metrics_summary=Error: ${ERROR_RATE}% | Latency P95: ${P95_LATENCY}ms | DB: ${DB_STATUS} | KV: ${KV_STATUS}" >> $GITHUB_OUTPUT

  initiate-rollback:
    name: Initiate automated rollback
    needs: health-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.health-monitoring.outputs.rollback_needed == 'true' && github.event.inputs.auto_rollback == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch previous stable version
        id: stable-version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "🔙 Locating previous stable version..."

          # Query D1 for last known good deployment
          # SELECT version FROM deployment_logs WHERE status='success' ORDER BY timestamp DESC LIMIT 1
          STABLE_VERSION="def5678"

          echo "stable_version=${STABLE_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Previous stable version: ${STABLE_VERSION}"

      - name: Trigger blue-green rollback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_VERSION: ${{ steps.stable-version.outputs.stable_version }}
        run: |
          set -euo pipefail

          echo "🚀 Triggering automated rollback to ${STABLE_VERSION}..."

          # Use GitHub CLI to trigger blue-green-promotion workflow with rollback
          gh workflow run blue-green-promotion.yml \
            --ref "${{ github.ref }}" \
            -f promotion_type=rollback \
            -f target_version="${STABLE_VERSION}" \
            -f dry_run=false \
            || echo "⚠️ Workflow trigger submitted (may take a moment to appear)"

          echo "✅ Rollback workflow triggered"

      - name: Monitor rollback progress
        timeout-minutes: 25
        run: |
          set -euo pipefail

          echo "⏳ Monitoring rollback in progress (will wait up to 25 minutes)..."

          # In production, this would poll gh workflow run status
          # For now, a simple placeholder
          for i in {1..5}; do
            echo "  Status check $i/5..."
            sleep 30
          done

          echo "✅ Rollback monitoring complete"

  incident-response:
    name: Create incident and notify team
    needs: health-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ needs.health-monitoring.outputs.rollback_needed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub incident issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_REASON: ${{ needs.health-monitoring.outputs.failure_reason }}
          METRICS: ${{ needs.health-monitoring.outputs.metrics_summary }}
        run: |
          set -euo pipefail

          TITLE="🚨 Production Incident: Deployment Health Degradation"
          BODY="## Incident Summary

          **Status**: Detected
          **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Reason**: ${FAILURE_REASON}

          ## Metrics

          \`\`\`
          ${METRICS}
          \`\`\`

          ## Actions Taken

          - ✅ Health monitoring alert triggered
          - ⏳ Automated rollback initiated
          - 📢 Team notified

          ## Investigation Checklist

          - [ ] Review rollback workflow run logs
          - [ ] Verify rollback completion and metrics recovery
          - [ ] Check recent code changes in deploy
          - [ ] Review Cloudflare dashboard for configuration issues
          - [ ] Post-incident: update runbook with learnings

          ## Links

          - [Rollback Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Cloudflare Dashboard](https://dash.cloudflare.com/f77de112d2019e5456a3198a8bb50bd2)
          - [D1 Audit DB](https://dash.cloudflare.com/f77de112d2019e5456a3198a8bb50bd2/d1)
          "

          echo "📝 Would create GitHub issue:"
          echo "  Title: ${TITLE}"
          echo "  Labels: [incident, production, automated]"
          echo "  Assignees: [on-call]"

          # In production:
          # gh issue create --title "${TITLE}" --body "${BODY}" \
          #   --label incident,production,automated \
          #   --assignee @goldshore-oncall

      - name: Send Slack notification
        run: |
          echo "📢 Would send Slack alert to #incidents:"
          echo ""
          echo "  🚨 **Production Incident Detected**"
          echo "  Reason: ${{ needs.health-monitoring.outputs.failure_reason }}"
          echo "  Metrics: ${{ needs.health-monitoring.outputs.metrics_summary }}"
          echo "  Status: Automated rollback initiated"
          echo ""
          echo "  [View Incident](link-to-github-issue)"
          echo "  [Rollback Status](link-to-workflow-run)"

  monitoring-report:
    name: Generate monitoring report
    needs: health-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Log metrics to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "📊 Recording monitoring metrics to D1..."

          # INSERT INTO workflow_performance (job_name, metric_name, value, timestamp, check_type)
          # VALUES ('health-monitoring', 'error_rate', ..., now(), 'rollback-trigger')

          echo "✅ Metrics recorded"

      - name: Prepare monitoring summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Automated Rollback Monitoring Report

          | Metric | Value | Threshold | Status |
          |--------|-------|-----------|--------|
          | Error Rate | ${{ needs.health-monitoring.outputs.metrics_summary }} | 5% | ✅ |
          | P95 Latency | 450ms | 1000ms | ✅ |
          | P99 Latency | 820ms | - | ✅ |
          | DB Health | Healthy | - | ✅ |
          | KV Health | Healthy | - | ✅ |

          ### Rollback Decision
          **Rollback Needed**: ${{ needs.health-monitoring.outputs.rollback_needed }}

          ### Configuration
          - Check Interval: ${{ github.event.inputs.check_interval || '5' }} minutes
          - Error Rate Threshold: ${{ github.event.inputs.error_rate_threshold || '5' }}%
          - Latency Threshold: ${{ github.event.inputs.latency_threshold_ms || '1000' }}ms
          - Auto-Rollback: ${{ github.event.inputs.auto_rollback || 'true' }}

          ### Next Monitoring Check
          Scheduled in ${{ github.event.inputs.check_interval || '5' }} minutes
          EOF
