name: CF Worker Ops

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [audit-and-cleanup, enable-logpush]
      dry_run:
        description: "Dry run (audit-and-cleanup only)"
        type: boolean
        default: true
      worker_name:
        description: "Worker name (enable-logpush only)"
        type: string

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: verify-builds
  # Dry-run wrangler build for every canonical Worker (not Pages) on every push
  # to main. Matrix runs in parallel; fail-fast:false so one failure does not
  # cancel the others.
  # ---------------------------------------------------------------------------
  verify-builds:
    name: Dry-run build / ${{ matrix.worker }}
    if: github.event_name == 'push' || inputs.job == 'verify-builds'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        worker:
          - gs-api
          - gs-gateway
          - gs-control
          - gs-mail
          - gs-agent
          - gs-trading
          - banproof-me
          - gs-www-redirect
          - goldshore-org
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry-run build ${{ matrix.worker }}
        working-directory: apps/${{ matrix.worker }}
        run: pnpm exec wrangler deploy --dry-run

  # ---------------------------------------------------------------------------
  # Job 2: audit-and-cleanup
  # Lists all Workers in the CF account, compares against the canonical set,
  # and prints (or deletes, when dry_run=false) any orphans.
  #
  # Canonical Workers (scripts, not Pages):
  #   gs-api, gs-gateway, gs-control, gs-mail, gs-agent, gs-trading,
  #   banproof-me, gs-www-redirect, goldshore-org, gs-platform, armsway-com,
  #   gs-core-worker, gs-signals-prod, banproof-email-router, goldshore-ai,
  #   gs-todo, rmarston-com, banproof, gs-web-staging, partners-in-pools
  #
  # Pages projects (NOT Workers scripts — excluded from comparison):
  #   gs-web, gs-admin
  # ---------------------------------------------------------------------------
  audit-and-cleanup:
    name: Audit & cleanup orphan workers
    if: inputs.job == 'audit-and-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch live worker list and compare against canonical set
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Canonical Workers — keep in sync with infra/INFRASTRUCTURE.md
          CANONICAL=(
            gs-api
            gs-gateway
            gs-control
            gs-mail
            gs-agent
            gs-trading
            banproof-me
            gs-www-redirect
            goldshore-org
            gs-platform
            armsway-com
            gs-core-worker
            gs-signals-prod
            banproof-email-router
            goldshore-ai
            gs-todo
            rmarston-com
            banproof
            gs-web-staging
            partners-in-pools
          )

          echo "=== Fetching workers from Cloudflare account ==="
          RESPONSE=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          # Extract worker names (requires jq, available on ubuntu-latest)
          LIVE_WORKERS=$(echo "$RESPONSE" | jq -r '.result[].id')

          echo "Live workers in account:"
          echo "$LIVE_WORKERS"
          echo ""

          ORPHANS=()
          while IFS= read -r worker; do
            [[ -z "$worker" ]] && continue
            FOUND=false
            for canonical in "${CANONICAL[@]}"; do
              if [[ "$worker" == "$canonical" ]]; then
                FOUND=true
                break
              fi
            done
            if [[ "$FOUND" == "false" ]]; then
              ORPHANS+=("$worker")
              echo "ORPHAN: $worker"
            fi
          done <<< "$LIVE_WORKERS"

          echo ""
          echo "=== Summary: ${#ORPHANS[@]} orphan(s) found ==="

          if [[ ${#ORPHANS[@]} -eq 0 ]]; then
            echo "All live workers are in the canonical list. Nothing to do."
            exit 0
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY RUN — no deletions performed."
            echo "Re-run with dry_run=false to delete the orphans listed above."
            exit 0
          fi

          # dry_run=false: delete each orphan
          echo "=== Deleting orphan workers ==="
          for orphan in "${ORPHANS[@]}"; do
            echo "Deleting: $orphan"
            DEL_RESPONSE=$(curl -sf -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${orphan}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "$DEL_RESPONSE" | jq '{success: .success, errors: .errors}'
          done

          echo ""
          echo "Orphan deletion complete. Exiting with code 1 to signal orphans were found."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 3: enable-logpush
  # Enables Workers Logpush (tail) for a named worker via the CF API.
  # ---------------------------------------------------------------------------
  enable-logpush:
    name: Enable Logpush for ${{ inputs.worker_name }}
    if: inputs.job == 'enable-logpush'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enable Workers Logpush
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail

          if [[ -z "$WORKER_NAME" ]]; then
            echo "ERROR: worker_name input is required for enable-logpush."
            exit 1
          fi

          echo "Enabling Logpush for worker: $WORKER_NAME"

          RESPONSE=$(curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/tail" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}')

          echo "Response from Cloudflare API:"
          echo "$RESPONSE" | jq .
