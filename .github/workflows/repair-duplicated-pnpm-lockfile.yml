name: Repair duplicated pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-duplicated-pnpm-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Remove exact appended duplicate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          data = path.read_bytes()
          if len(data) % 2 != 0 or data[:len(data)//2] != data[len(data)//2:]:
              raise SystemExit('Refusing to edit: pnpm-lock.yaml is not two exact byte-for-byte copies')

          repaired = data[:len(data)//2]
          if repaired.count(b"lockfileVersion: '9.0'") != 1:
              raise SystemExit('Refusing to edit: repaired lockfile does not contain exactly one v9 header')

          path.write_bytes(repaired)
          print(f'Repaired pnpm-lock.yaml: {len(data)} -> {len(repaired)} bytes')
          PY

      - name: Validate lockfile
        run: corepack pnpm@9.15.4 install --frozen-lockfile --ignore-scripts

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(build): remove duplicated pnpm lockfile payload'
          git push origin HEAD:main
