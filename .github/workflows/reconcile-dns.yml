name: Reconcile DNS

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show intended Cloudflare DNS/route changes without applying them'
        required: false
        default: true
        type: boolean
      harden_tls:
        description: 'Set Full (strict) SSL and minimum TLS 1.2 on GoldShore/Armsway zones'
        required: false
        default: false
        type: boolean

jobs:
  reconcile:
    name: Reconcile DNS and Worker routes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/normalize-cf-token
        id: cf-token
        with:
          raw_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          token_name: 'CLOUDFLARE_API_TOKEN'

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ steps.cf-token.outputs.token }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"

      - name: Reconcile DNS records and Worker routes
        run: node scripts/setup-preview-dns.mjs

      - name: Harden TLS settings
        if: ${{ inputs.harden_tls }}
        env:
          CF_API: https://api.cloudflare.com/client/v4
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would harden TLS on goldshore.ai, goldshore.org, and armsway.com"
            exit 0
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for zone in goldshore.ai goldshore.org armsway.com; do
            zone_id=$(curl -fsS "$CF_API/zones?name=$zone" "${auth[@]}" | jq -r '.result[0].id // empty')
            test -n "$zone_id"
            curl -fsS -X PATCH "$CF_API/zones/$zone_id/settings/ssl" "${auth[@]}" \
              -H 'Content-Type: application/json' --data '{"value":"strict"}' >/dev/null
            curl -fsS -X PATCH "$CF_API/zones/$zone_id/settings/min_tls_version" "${auth[@]}" \
              -H 'Content-Type: application/json' --data '{"value":"1.2"}' >/dev/null
            echo "Hardened TLS: $zone"
          done
