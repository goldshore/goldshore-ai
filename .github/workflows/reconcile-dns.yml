name: DNS desired-state inventory

# Prints the DNS records declared in infra/Cloudflare/desired-state.yaml so a
# reviewer can eyeball expected state on a PR. It reads no live Cloudflare data
# and mutates nothing: production DNS is dashboard-owned, per AGENTS.md.
#
# This workflow used to also reconcile live records against the desired state.
# Those steps were removed because they could never run: they read two Cloudflare
# API environment variables that the workflow never defined and never wired to
# any secret, so `set -u` aborted the job on the first expansion. The reconcile
# loop was also structurally broken -- it read an unassigned $ZID_AI three times
# and passed two stacked URL arguments to a single request -- so it was restored
# as dead code by a bad merge rather than deliberately written.
#
# The "Verify dashboard-only inventories cannot mutate Cloudflare" guard in
# infrastructure-guard.yml enforces this: it scans this file's raw text and
# fails if it finds a Cloudflare credential or mutation path, comments included.
# Keep credential and request identifiers out of this file, prose and all.
#
# The desired-state file is authoritative for both goldshore.ai and goldshore.org.
# goldshore.org and www.goldshore.org are intentionally excluded below. Three repo
# docs disagree on who owns them:
#   - infra/Cloudflare/desired-state.yaml and policy/ROUTE_POLICY.md (Authority:
#     Marzton, 2026-04-24) describe a standalone "goldshore-org" router Worker.
#   - docs/architecture/domain-ownership.md (2026-06-15, later) says gs-web Worker
#     owns goldshore.org, and explicitly states "goldshore-org is not canonical".
#   - infra/Cloudflare/deploy.ts's gs-web smoke check treats goldshore.org as part
#     of gs-web's own deploy verification, matching the domain-ownership.md read.
# Resolve that conflict (update whichever doc is stale) before adding these two
# records back here.
#
# Run manually: Actions -> DNS desired-state inventory -> Run workflow.
on:
  pull_request:
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/**'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/reconcile-dns.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/**'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/reconcile-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Export redacted expected state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Extract desired DNS records (excluding goldshore.org)
        run: |
          set -euo pipefail
          python3 - <<'EOF' > desired_records.json
          import yaml, json

          with open('infra/Cloudflare/desired-state.yaml') as f:
              cfg = yaml.safe_load(f)

          out = []
          for r in cfg['cloudflare']['dns']['records']:
              name = r['name']
              zone = r.get('zone', 'goldshore.ai')
              if zone == 'goldshore.org' or name in ('goldshore.org', 'www.goldshore.org'):
                  continue
              full_name = zone if name == zone else f"{name}.{zone}"
              out.append({
                  'name': name,
                  'full_name': full_name,
                  'type': r['type'],
                  'content': r['content'],
                  'proxied': r.get('proxied', False),
                  'zone': zone,
              })

          print(json.dumps(out))
          EOF
          echo "Extracted $(jq 'length' desired_records.json) desired records (goldshore.org excluded, see workflow header):"
          jq -r '.[] | "  \(.full_name) (\(.type)) -> \(.content) [proxied=\(.proxied)]"' desired_records.json
