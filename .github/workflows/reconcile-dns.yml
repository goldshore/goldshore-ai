name: Inventory Cloudflare route ownership

# Read-only drift inventory. Cloudflare production configuration is changed only
# by an approved human in the dashboard; this workflow has no Cloudflare credentials.
on:
  pull_request:
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/**'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/reconcile-dns.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-web/wrangler.toml'
      - 'apps/gs-api/wrangler.toml'
      - 'infra/Cloudflare/**'
      - 'scripts/export-cloudflare-inventory.py'
      - '.github/workflows/reconcile-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

          reconcile_route() {
            local zone="$1" pattern="$2" script="$3" zone_id routes route_id body
            zone_id="$(zone_id_for "$zone")"
            test -n "$zone_id"
            routes="$(curl -fsS "$CF_API/zones/$zone_id/workers/routes" "${auth[@]}")"
            route_id="$(jq -r --arg pattern "$pattern" '.result[] | select(.pattern == $pattern) | .id' <<<"$routes")"
            body="$(jq -nc --arg pattern "$pattern" --arg script "$script" '{pattern:$pattern,script:$script}')"
            if [[ -n "$route_id" ]]; then
              curl -fsS -X PUT "$CF_API/zones/$zone_id/workers/routes/$route_id" "${auth[@]}" \
                -H 'Content-Type: application/json' --data "$body" >/dev/null
            else
              curl -fsS -X POST "$CF_API/zones/$zone_id/workers/routes" "${auth[@]}" \
                -H 'Content-Type: application/json' --data "$body" >/dev/null
            fi
            echo "Reconciled route: $zone $pattern -> $script"
          }

          delete_route_if_present() {
            local zone="$1" pattern="$2" zone_id routes route_id
            zone_id="$(zone_id_for "$zone")"
            test -n "$zone_id"
            routes="$(curl -fsS "$CF_API/zones/$zone_id/workers/routes" "${auth[@]}")"
            route_id="$(jq -r --arg pattern "$pattern" '.result[] | select(.pattern == $pattern) | .id' <<<"$routes")"
            if [[ -z "$route_id" ]]; then
              echo "Route absent: $zone $pattern"
              return
            fi
            curl -fsS -X DELETE "$CF_API/zones/$zone_id/workers/routes/$route_id" "${auth[@]}" >/dev/null
            echo "Deleted malformed route: $zone $pattern"
          }

          reconcile_route goldshore.ai 'goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'admin.goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'admin-preview.goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'api.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'agent.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'mail.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'ops.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'trading.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'dashboard.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'dash.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'gw.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.org 'goldshore.org/*' gs-web-prod
          reconcile_route goldshore.org 'admin.goldshore.org/*' gs-web-prod
          reconcile_route goldshore.org 'api.goldshore.org/*' gs-api-prod

          delete_route_if_present goldshore.org 'admin.goldshore.ai/*'
          delete_route_if_present goldshore.org 'api.goldshore.ai/*'

  harden-tls:
    if: ${{ inputs.harden_tls }}
    name: Harden zone TLS settings
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CF_ACCOUNT: f77de112d2019e5456a3198a8bb50bd2
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BUILD_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
    steps:
      - name: Normalize Cloudflare build token
        shell: bash
        run: |
          token="$(
            node <<'NODE'
          const raw = process.env.CLOUDFLARE_BUILD_API_TOKEN || "";
          let token = raw.replace(/[\r\n]/g, "").trim();
          const bearer = token.match(/(?:authorization\s*:\s*)?bearer\s+([^\s"',;}]+)/i);
          if (bearer) token = bearer[1];
          const cfut = token.match(/cfut_[A-Za-z0-9_-]+/);
          if (cfut) token = cfut[0];
          token = token.replace(/^[`'"]+|[`'",;}]+$/g, "").replace(/\s/g, "");
          process.stdout.write(token);
          NODE
          )"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "CF_BUILD_TOKEN=$token" >> "$GITHUB_ENV"
          fi

      - name: Check mcp.goldshore.ai DNS record
        run: |
          set -euo pipefail
          ZID=$(curl -sS "$CF_API/zones?name=goldshore.ai" -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')
          echo "== raw DNS records matching mcp.goldshore.ai =="
          curl -sS "$CF_API/zones/$ZID/dns_records?name=mcp.goldshore.ai" -H "Authorization: Bearer $CF_TOKEN" | jq '.result'

          reconcile_route goldshore.ai 'goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'admin.goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'admin-preview.goldshore.ai/*' gs-web-prod
          reconcile_route goldshore.ai 'api.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'agent.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'mail.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'ops.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'trading.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'dashboard.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'dash.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.ai 'gw.goldshore.ai/*' gs-api-prod
          reconcile_route goldshore.org 'goldshore.org/*' gs-web-prod
          reconcile_route goldshore.org 'admin.goldshore.org/*' gs-web-prod
          reconcile_route goldshore.org 'api.goldshore.org/*' gs-api-prod
          echo "== account-level Workers Custom Domains matching mcp =="
          curl -sS "$CF_API/accounts/$CF_ACCOUNT/workers/domains" -H "Authorization: Bearer $CF_TOKEN" \
            | jq '[.result[]? | select(.hostname | test("mcp"))]'

      - name: Check Cloudflare Access apps for mcp.goldshore.ai
        run: |
          set -euo pipefail
          test -n "${CF_BUILD_TOKEN:-}"
          echo "== all Access apps whose domain mentions mcp =="
          curl -sS "$CF_API/accounts/$CF_ACCOUNT/access/apps?per_page=100" \
            -H "Authorization: Bearer $CF_BUILD_TOKEN" \
            | jq '[.result[]? | select((.domain // "" | test("mcp")) or (.name | test("MCP"; "i"))) | {id, name, type, domain, self_hosted_domains}]'
  reconcile:
    name: Reconcile DNS records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export binding names, routes, Access IDs, and secret names
        run: python3 scripts/export-cloudflare-inventory.py cloudflare-inventory.json
      - name: Display redacted inventory
        run: jq . cloudflare-inventory.json
      - name: Upload drift-review artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-inventory-${{ github.run_id }}-reconcile-dns
          path: cloudflare-inventory.json
          retention-days: 30
