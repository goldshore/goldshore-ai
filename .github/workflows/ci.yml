name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gs-api-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build gs-api
        run: pnpm --filter @goldshore/gs-api build

  lint-test-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Enforce banproof production bindings
        if: ${{ vars.ENABLE_BANPROOF_BINDINGS_CHECK == 'true' }}
        run: pnpm check:banproof-bindings

      - name: Warn when banproof binding check is disabled
        if: ${{ vars.ENABLE_BANPROOF_BINDINGS_CHECK != 'true' }}
        run: echo "::warning::ENABLE_BANPROOF_BINDINGS_CHECK is not set to true; skipping banproof production binding validation."

      - name: Build all
        run: pnpm -r --sequential build

      - name: Detect gs-web release-impact changes
        id: gs-web-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi

          if git diff --name-only "$RANGE" | grep -Eq '^(apps/gs-web/|packages/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json)$'; then
            echo "release_impact=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_impact=false" >> "$GITHUB_OUTPUT"
          fi

      - name: gs-web release quality gate
        if: steps.gs-web-changes.outputs.release_impact == 'true'
        working-directory: apps/gs-web
        env:
          # CI baseline; raise once core vitals are addressed (images, JS bundles)
          LH_MIN_PERFORMANCE: "0.60"
        run: pnpm check:release

      - name: Verify internal links
        run: node scripts/check-internal-links.mjs
