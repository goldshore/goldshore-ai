# Manual operations guide:
# - Use this workflow to verify that pnpm-lock.yaml changes only when the dependency graph changed.
# - Routine feature PRs should not regenerate pnpm-lock.yaml.
name: "Manual Guard: Lockfile Policy Check"
run-name: "Lockfile policy check • @${{ github.actor }}"

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  prevent-lockfile-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Guard pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          changed_files="$(git diff --name-only origin/main...HEAD)"

          lockfile_changed=0
          manifest_changed=0

          if grep -qx 'pnpm-lock.yaml' <<<"$changed_files"; then
            lockfile_changed=1
          fi

          if grep -Eq '(^package\.json$|^pnpm-workspace\.yaml$|/package\.json$)' <<<"$changed_files"; then
            manifest_changed=1
          fi

          if [[ "$lockfile_changed" == "1" && "$manifest_changed" == "0" ]]; then
            echo "❌ pnpm-lock.yaml changed without package manifest changes."
            echo "Restore pnpm-lock.yaml from main. Do not regenerate it for ordinary conflict repair."
            exit 1
          fi

          echo "✅ pnpm lockfile policy passed."
