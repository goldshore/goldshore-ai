# Manual operations guide:
# - Use this workflow to verify that a branch or ad-hoc change set does not modify pnpm-lock.yaml outside the approved process.
# - This is an operator guardrail, not a dependency-update workflow.
name: "Manual Guard: Lockfile Policy Check"
run-name: "Lockfile policy check • @${{ github.actor }}"

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lockfile-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prevent-lockfile-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard pnpm lockfile
        run: |
          set -euo pipefail
          git fetch origin main

          # Allow adding pnpm-lock.yaml when main doesn't have one (restoration after deletion).
          # Only block modifications to an existing lockfile.
          if git show origin/main:pnpm-lock.yaml > /dev/null 2>&1; then
            if git diff --name-only origin/main...HEAD | grep -q '^pnpm-lock.yaml$'; then
              echo "❌ Detected changes to pnpm-lock.yaml in this pull request."
              echo "Lockfile updates must go through the designated lockfile update branch/process."
              exit 1
            fi
          else
            echo "ℹ️  pnpm-lock.yaml does not exist on origin/main — allowing addition."
          fi

          echo "✅ Lockfile policy check passed."
