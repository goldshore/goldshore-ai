name: Setup Cloudflare Access for Admin Dashboard

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: setup-cf-access
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACCOUNT_ID: f77de112d2019e5456a3198a8bb50bd2
  CF_TEAM_DOMAIN: goldshore.cloudflareaccess.com
  ADMIN_EMAILS: marstonr6@gmail.com,admin@goldshore.org
  AUDIENCE: c520a7647223b49b20fbe5be240772863eb684b97b57c08955b6104c58170db9

jobs:
  setup-access:
    name: Configure CF Access Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check API Token
        run: |
          # Try multiple token sources
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "✅ Using CLOUDFLARE_API_TOKEN"
            echo "token_source=CLOUDFLARE_API_TOKEN" >> $GITHUB_ENV
          elif [ -n "${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}" ]; then
            echo "✅ Using CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN"
            echo "token_source=CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN" >> $GITHUB_ENV
          else
            echo "❌ No Cloudflare API token found"
            echo "Please set either:"
            echo "  - CLOUDFLARE_API_TOKEN (full API token)"
            echo "  - CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN (deploy token)"
            echo "in GitHub repository settings"
            exit 1
          fi

      - name: Create/Verify Access Application
        id: app
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          echo "🔍 Checking for existing Access application..."

          # Get token from environment
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          else
            API_TOKEN="${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}"
          fi

          echo "::add-mask::${API_TOKEN}"

          # List existing applications
          APP_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json")

          # Check if response is successful
          if ! echo "$APP_LIST" | jq -e '.success' > /dev/null 2>&1; then
            echo "❌ Failed to list Access applications"
            echo "$APP_LIST" | jq .
            exit 1
          fi

          # Look for admin-production app
          APP_ID=$(echo "$APP_LIST" | jq -r '.result[] | select(.name == "admin-production") | .id' 2>/dev/null)

          if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
            echo "✅ Found existing application: $APP_ID"
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "📝 Creating new Access application..."

            if [ "$DRY_RUN" = "true" ]; then
              echo "🏜️ DRY RUN: Would create admin-production application"
              echo "app_id=dry-run-id" >> $GITHUB_OUTPUT
              echo "created=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            APP_PAYLOAD=$(cat <<'JSON'
{"name":"admin-production","type":"self_hosted","domain":"admin.goldshore.ai","custom_domain":"admin.goldshore.ai","custom_domain_in_sni_only":false,"cors_allow_credentials":false,"allowed_idps":["github"],"auto_redirect_to_identity":false,"session_duration":"24h","app_launcher_visible":true,"logo_url":"https://goldshore.ai/logo.png"}
JSON
)
            APP_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$APP_PAYLOAD")

            if ! echo "$APP_RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
              echo "❌ Failed to create Access application"
              echo "$APP_RESPONSE" | jq .
              exit 1
            fi

            APP_ID=$(echo "$APP_RESPONSE" | jq -r '.result.id')
            echo "✅ Created Access application: $APP_ID"
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Access Policies
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          echo "::add-mask::${API_TOKEN}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️ DRY RUN: Would configure policies"
            exit 0
          fi

          echo "🔐 Configuring Access policies..."

          # Get existing policies
          POLICIES=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications/${APP_ID}/policies" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")

          if ! echo "$POLICIES" | jq -e '.success' > /dev/null 2>&1; then
            echo "❌ Failed to list policies"
            echo "$POLICIES" | jq .
            exit 1
          fi

          # Check if Allow policy exists
          ALLOW_POLICY=$(echo "$POLICIES" | jq -r '.result[] | select(.name == "Goldshore Admin Owners") | .id' 2>/dev/null)

          if [ -z "$ALLOW_POLICY" ] || [ "$ALLOW_POLICY" = "null" ]; then
            echo "📝 Creating Allow policy..."

            ALLOW_PAYLOAD=$(cat <<'JSON'
{"name":"Goldshore Admin Owners","description":"Allow Goldshore admin owners via GitHub","decision":"allow","include":[{"email":{"emails":["marstonr6@gmail.com","admin@goldshore.org"]}},{"identity_provider":{"identity_provider_id":"github"}}],"require":[{"email_verified":{}}],"precedence":1}
JSON
)
            ALLOW_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications/${APP_ID}/policies" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$ALLOW_PAYLOAD")

            if ! echo "$ALLOW_RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
              echo "❌ Failed to create Allow policy"
              echo "$ALLOW_RESPONSE" | jq .
              exit 1
            fi

            ALLOW_POLICY=$(echo "$ALLOW_RESPONSE" | jq -r '.result.id')
            echo "✅ Created Allow policy: $ALLOW_POLICY"
          else
            echo "✅ Allow policy already exists: $ALLOW_POLICY"
          fi

          # Check if Deny policy exists
          DENY_POLICY=$(echo "$POLICIES" | jq -r '.result[] | select(.name == "Deny Everyone Else") | .id' 2>/dev/null)

          if [ -z "$DENY_POLICY" ] || [ "$DENY_POLICY" = "null" ]; then
            echo "📝 Creating Deny policy..."

            DENY_PAYLOAD=$(cat <<'JSON'
{"name":"Deny Everyone Else","description":"Deny all other access attempts","decision":"deny","include":[{"everyone":{}}],"precedence":2}
JSON
)
            DENY_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications/${APP_ID}/policies" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$DENY_PAYLOAD")

            if ! echo "$DENY_RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
              echo "❌ Failed to create Deny policy"
              echo "$DENY_RESPONSE" | jq .
              exit 1
            fi

            DENY_POLICY=$(echo "$DENY_RESPONSE" | jq -r '.result.id')
            echo "✅ Created Deny policy: $DENY_POLICY"
          else
            echo "✅ Deny policy already exists: $DENY_POLICY"
          fi

      - name: Add Hostnames to Application
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          echo "::add-mask::${API_TOKEN}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️ DRY RUN: Would add hostnames"
            exit 0
          fi

          echo "🌐 Configuring hostnames..."

          # Update application with hostnames
          UPDATE_PAYLOAD=$(cat <<'JSON'
{"custom_domain":"admin.goldshore.ai","custom_domain_in_sni_only":false}
JSON
)
          UPDATE_RESPONSE=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/applications/${APP_ID}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD")

          if ! echo "$UPDATE_RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
            echo "⚠️ Warning: Could not update primary hostname (may already be configured)"
          else
            echo "✅ Primary hostname configured"
          fi

      - name: Set Worker Environment Variable via Wrangler
        env:
          ADMIN_OWNER_EMAILS: marstonr6@gmail.com,admin@goldshore.org
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️ DRY RUN: Would set ADMIN_OWNER_EMAILS on gs-web Worker"
            exit 0
          fi

          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          else
            API_TOKEN="${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}"
          fi

          echo "📊 Setting ADMIN_OWNER_EMAILS on gs-web Worker..."

          # Note: Environment variables for Workers should be set via wrangler.toml or deployment
          # This is a placeholder for manual dashboard configuration until API support is available
          echo "⚠️ Note: ADMIN_OWNER_EMAILS must be configured in Cloudflare dashboard:"
          echo ""
          echo "Navigate to: Cloudflare Dashboard → Workers & Pages → gs-web (Production)"
          echo "  1. Click 'Settings' tab"
          echo "  2. Scroll to 'Environment Variables'"
          echo "  3. Add new variable:"
          echo "     Variable name: ADMIN_OWNER_EMAILS"
          echo "     Value: ${ADMIN_OWNER_EMAILS}"
          echo "  4. Click 'Save' (no redeploy needed)"
          echo ""
          echo "✅ Once set, CF Access will restrict admin dashboard to authorized users"

      - name: Summary
        run: |
          echo "✅ Cloudflare Access Setup Complete!"
          echo ""
          echo "Configuration Summary:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Application Name:    admin-production"
          echo "Application ID:      ${{ steps.app.outputs.app_id }}"
          echo "Account ID:          ${{ env.ACCOUNT_ID }}"
          echo "Hostnames:           admin.goldshore.ai, admin.goldshore.org"
          echo "Authorized Users:    ${{ env.ADMIN_EMAILS }}"
          echo "Authentication:      GitHub OAuth"
          echo ""
          echo "Next Steps:"
          echo "1. ✅ Access Application created/verified"
          echo "2. ✅ Policies configured (Allow owners, Deny others)"
          echo "3. ⏳ Set ADMIN_OWNER_EMAILS in Cloudflare dashboard (manual)"
          echo "4. ⏳ Redeploy gs-web Worker to activate configuration"
          echo "5. ⏳ Test access: https://admin.goldshore.ai/app/dashboard"
          echo ""
          echo "Dashboard URL: https://dash.cloudflare.com/account/${{ env.ACCOUNT_ID }}"
