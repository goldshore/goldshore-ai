name: Enforce Branch Protection

on:
  workflow_dispatch:
    inputs:
      force_enforcement:
        description: 'Force re-apply protection even if already configured'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths:
      - '.github/workflows/required-merge-checks.yml'
      - '.github/workflows/enforce-branch-protection.yml'
      - 'scripts/configure-branch-protection.mjs'

permissions:
  contents: read

concurrency:
  group: enforce-branch-protection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protect-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-policy-operator
    env:
      HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Skip when GH_PAT is missing
        if: env.HAS_GH_PAT != 'true'
        run: echo "::warning::GH_PAT is missing; skipping branch protection reconciliation."
      - name: Apply branch protection
        if: env.HAS_GH_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROTECTED_BRANCH: main
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT is not configured; skipping branch protection enforcement."
            exit 0
          fi
          node scripts/configure-branch-protection.mjs
