name: Reconcile Access GitHub IdP

on:
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    name: Repair Cloudflare Access GitHub login
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: f77de112d2019e5456a3198a8bb50bd2
      CF_API: https://api.cloudflare.com/client/v4
      GITHUB_OAUTH_CLIENT_ID: Ov23liQ0fWArxJvZL7A5
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GOLDSHORE_ACCESS_GITHUB_CLIENT_SECRET }}
      CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
      CF_AUTH_KEY: ${{ secrets.CF_AUTH_KEY }}
    steps:
      - name: Reconcile dedicated GitHub OAuth identity provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_OAUTH_CLIENT_SECRET"
          test -n "$CF_AUTH_EMAIL"
          test -n "$CF_AUTH_KEY"
          echo "::add-mask::$GITHUB_OAUTH_CLIENT_SECRET"
          echo "::add-mask::$CF_AUTH_KEY"

          auth=(-H "X-Auth-Email: $CF_AUTH_EMAIL" -H "X-Auth-Key: $CF_AUTH_KEY")
          endpoint="$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers"
          providers=$(curl -fsS "$endpoint" "${auth[@]}")
          idp_id=$(jq -r '.result[] | select(.type == "github" and .name == "Gold Shore Cloudflare Access") | .id' <<<"$providers" | head -n1)

          if [[ -z "$idp_id" ]]; then
            echo "::error::Cloudflare GitHub IdP 'Gold Shore Cloudflare Access' was not found."
            exit 1
          fi

          body=$(jq -nc \
            --arg name "Gold Shore Cloudflare Access" \
            --arg client_id "$GITHUB_OAUTH_CLIENT_ID" \
            --arg client_secret "$GITHUB_OAUTH_CLIENT_SECRET" \
            '{name:$name,type:"github",config:{client_id:$client_id,client_secret:$client_secret}}')

          result=$(curl -fsS -X PUT "$endpoint/$idp_id" "${auth[@]}" \
            -H 'Content-Type: application/json' --data "$body")
          jq -e --arg client_id "$GITHUB_OAUTH_CLIENT_ID" \
            '.success == true and .result.type == "github" and .result.config.client_id == $client_id' \
            <<<"$result" >/dev/null
          echo "Reconciled Cloudflare Access GitHub IdP: Gold Shore Cloudflare Access"

      - name: Restrict Admin login to canonical identity providers
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_AUTH_KEY"
          auth=(-H "X-Auth-Email: $CF_AUTH_EMAIL" -H "X-Auth-Key: $CF_AUTH_KEY")
          idp_endpoint="$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers"
          app_endpoint="$CF_API/accounts/$CF_ACCOUNT_ID/access/apps"
          providers=$(curl -fsS "$idp_endpoint" "${auth[@]}")

          canonical_github=$(jq -r '.result[] | select(.type == "github" and .name == "Gold Shore Cloudflare Access") | .id' <<<"$providers" | head -n1)
          google=$(jq -r '.result[] | select(.type == "google") | .id' <<<"$providers" | head -n1)
          otp=$(jq -r '.result[] | select(.type == "onetimepin") | .id' <<<"$providers" | head -n1)
          test -n "$canonical_github"

          allowed=$(jq -nc --arg github "$canonical_github" --arg google "$google" --arg otp "$otp" \
            '[$github,$google,$otp] | map(select(length > 0)) | unique')
          payload=$(jq -nc --argjson allowed "$allowed" '{
            name:"GoldShore Admin",
            type:"self_hosted",
            domain:"admin.goldshore.ai",
            self_hosted_domains:["admin.goldshore.ai","admin.goldshore.org","admin-preview.goldshore.ai","admin.gs-admin.pages.dev"],
            session_duration:"24h",
            http_only_cookie_attribute:true,
            auto_redirect_to_identity:false,
            allowed_idps:$allowed
          }')

          apps=$(curl -fsS "$app_endpoint?per_page=100" "${auth[@]}")
          app_id=$(jq -r '
            [.result[] | select(
              .name == "GoldShore Admin" or
              .name == "Gold Shore Labs Admin" or
              .domain == "admin.goldshore.ai" or
              ((.self_hosted_domains // []) | index("admin.goldshore.ai"))
            )] | first | .id // empty
          ' <<<"$apps")

          if [[ -n "$app_id" ]]; then
            result=$(curl -fsS -X PUT "$app_endpoint/$app_id" "${auth[@]}" \
              -H 'Content-Type: application/json' --data "$payload")
            action="Updated"
          else
            result=$(curl -fsS -X POST "$app_endpoint" "${auth[@]}" \
              -H 'Content-Type: application/json' --data "$payload")
            app_id=$(jq -r '.result.id // empty' <<<"$result")
            test -n "$app_id"
            action="Created"
          fi

          jq -e --arg legacy "b2795891-ffe8-4e7c-84b0-9221f0f1497d" \
            '.success == true and ((.result.allowed_idps // []) | index($legacy) | not)' <<<"$result" >/dev/null

          policy_endpoint="$app_endpoint/$app_id/policies"
          policies=$(curl -fsS "$policy_endpoint" "${auth[@]}")
          owner_policy_id=$(jq -r \
            '.result[] | select(.name == "Owner access" and .decision == "allow") | .id' \
            <<<"$policies" | head -n1)
          owner_policy=$(jq -nc '{
            name:"Owner access",
            decision:"allow",
            include:[
              {"email_domain":{"domain":"goldshore.ai"}},
              {"email_domain":{"domain":"goldshore.org"}},
              {"email":{"email":"marstonr6@gmail.com"}}
            ],
            exclude:[],
            require:[]
          }')

          if [[ -n "$owner_policy_id" ]]; then
            policy_result=$(curl -fsS -X PUT "$policy_endpoint/$owner_policy_id" "${auth[@]}" \
              -H 'Content-Type: application/json' --data "$owner_policy")
          else
            policy_result=$(curl -fsS -X POST "$policy_endpoint" "${auth[@]}" \
              -H 'Content-Type: application/json' --data "$owner_policy")
          fi
          jq -e '.success == true and .result.decision == "allow"' <<<"$policy_result" >/dev/null

          echo "$action GoldShore Admin and reconciled its canonical identity providers and Owner access policy."

      - name: Verify anonymous admin access is challenged
        shell: bash
        run: |
          set -euo pipefail
          location=$(curl -fsSI https://admin.goldshore.ai/ | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0,11); exit}')
          test -n "$location"
          grep -Eq '^https://[^/]+\.cloudflareaccess\.com/' <<<"$location"
          page=$(curl -fsSL "$location")
          grep -q "$GITHUB_OAUTH_CLIENT_ID" <<<"$page"
          echo "Verified anonymous admin access is challenged and uses the dedicated GitHub OAuth client."
