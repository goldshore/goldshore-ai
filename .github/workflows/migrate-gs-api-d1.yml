name: Migrate GS API D1

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Apply the same migration set to production after preview succeeds
        type: boolean
        default: false
        required: true

concurrency:
  group: migrate-gs-api-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: Approve and migrate preview
    runs-on: ubuntu-latest
    environment: preview-database
    steps: &migration_steps
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/normalize-cf-token
        id: cf-token
        with:
          raw_token: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
          token_name: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
      - name: Apply discovered migrations with ledger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cf-token.outputs.token }}
          TARGET_ENV: ${{ github.job == 'preview' && 'preview' || 'prod' }}
        run: scripts/cloudflare/apply-d1-migrations.sh "$TARGET_ENV" "$RUNNER_TEMP/d1-backups"
      - name: Upload backup references and exports
        uses: actions/upload-artifact@v7
        with:
          name: d1-${{ github.job }}-migration-backups-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-backups
          if-no-files-found: error
          retention-days: 30

  production:
    name: Approve and migrate production
    if: inputs.promote_production
    needs: preview
    runs-on: ubuntu-latest
    environment: production-database
    steps: *migration_steps
