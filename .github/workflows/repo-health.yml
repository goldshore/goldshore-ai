name: Repo Health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Branch conflict audit
        run: bash scripts/branch-audit.sh

      - name: Missing asset checks
        run: node scripts/file-integrity-check.js

      - name: Logo duplication check
        run: |
          if [ "$(find apps packages public -type f -name '*logo*.svg' \
            -not -path '*/node_modules/*' \
            -not -path '*/.pnpm/*' \
            -not -path '*/dist/*' \
            -not -path '*/build/*' | wc -l)" -gt 25 ]; then
            echo "Too many logo assets found"
            exit 1
          fi

      - name: Repo health checks
        run: pnpm run repo:health
