name: Repo Health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Branch conflict audit
        run: bash scripts/branch-audit.sh

      - name: Missing asset checks
        run: node scripts/file-integrity-check.js

      - name: Logo duplication check
        run: |
          if [ "$(find apps packages public -type f -name '*logo*.svg' \
            -not -path '*/node_modules/*' \
            -not -path '*/.pnpm/*' \
            -not -path '*/dist/*' \
            -not -path '*/build/*' | wc -l)" -gt 25 ]; then
            echo "Too many logo assets found"
            exit 1
          fi

      - name: Repo health checks
        run: pnpm run repo:health
