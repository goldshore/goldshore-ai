name: Lockfile maintenance

# Manual-only recovery. It always opens or updates a PR and can never push to
# main. Routine validation belongs in lockfile-guard.yml.
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch to regenerate from
        required: true
        default: main
        type: string
      update_branch:
        description: Branch used for the repair PR
        required: true
        default: automation/pnpm-lockfile-refresh
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

jobs:
  regenerate-with-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Regenerate and validate
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit to the repair branch
        id: diff
        env:
          UPDATE_BRANCH: ${{ inputs.update_branch }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add pnpm-lock.yaml
          git commit -m "Merge Strategy: Squash" -m "Regenerate pnpm lockfile with pnpm 9.15.4"
          git push --force-with-lease origin "$UPDATE_BRANCH"
      - name: Open or update repair PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
        run: |
          body=$'Merge Strategy: Squash\n\nRegenerates pnpm-lock.yaml with the repository-pinned pnpm 9.15.4 and verifies a frozen install.'
          existing=$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
              --title "Regenerate pnpm lockfile" --body "$body"
          fi
