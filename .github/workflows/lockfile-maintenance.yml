name: Lockfile Maintenance

# Recovery tool only. Normal dependency PRs update their own lockfile. Keeping
# this workflow manual prevents bots from racing branches with generated commits.
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch whose manifests should generate the lockfile
        required: true
        default: main
        type: string
      update_branch:
        description: Branch used for the generated pull request
        required: true
        default: automation/pnpm-lockfile-refresh
        type: string

concurrency:
  group: pnpm-lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Regenerate from scratch
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Create or update the refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push --force-with-lease origin "$UPDATE_BRANCH"

          cat > pr-body.md <<'BODY'
          Merge strategy: squash

          Regenerates `pnpm-lock.yaml` from the selected base branch with the repository's pinned pnpm version.

          This is a manual recovery PR. Ordinary feature and dependency branches should not invoke this workflow.
          BODY

          existing_pr="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --body-file pr-body.md
          else
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
              --title "chore: regenerate pnpm lockfile" --body-file pr-body.md
          fi
