name: Setup Preview DNS
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  setup-dns:
    name: Configure preview.goldshore.ai DNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Normalize Cloudflare token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
        run: |
          token="$(
            node <<'NODE'
          const raw = process.env.RAW_CLOUDFLARE_API_TOKEN || "";
          let token = raw.replace(/[\r\n]/g, "").trim();
          const bearer = token.match(/(?:authorization\s*:\s*)?bearer\s+([^\s"',;}]+)/i);
          if (bearer) token = bearer[1];
          const cfut = token.match(/cfut_[A-Za-z0-9_-]+/);
          if (cfut) token = cfut[0];
          token = token.replace(/^[`'"]+|[`'",;}]+$/g, "").replace(/\s/g, "");
          process.stdout.write(token);
          NODE
          )"
          test -n "$token" || (echo "Missing required secret: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_BUILD_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run DNS setup script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_BUILD_API_TOKEN" || (echo "Missing required secret: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Configure preview DNS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/setup-preview-dns.mjs
