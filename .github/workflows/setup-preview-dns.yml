name: Setup Preview DNS
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  setup-dns:
    name: Configure preview.goldshore.ai DNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: ./.github/actions/normalize-cf-token
        id: token
        with:
          raw_token: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}

      - name: Export token to environment
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ steps.token.outputs.token }}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_BUILD_API_TOKEN=${{ steps.token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Run DNS setup script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_BUILD_API_TOKEN" || (echo "Missing required secret: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Configure preview DNS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/setup-preview-dns.mjs
