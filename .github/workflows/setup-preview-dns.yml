name: Setup Preview DNS
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  setup-dns:
    name: Configure preview.goldshore.ai DNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate required Cloudflare token
        env:
          CLOUDFLARE_BUILD_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_BUILD_API_TOKEN" ]; then
            echo "::error::Required secret CLOUDFLARE_BUILD_API_TOKEN is not set. Configure it before running this workflow."
            exit 1
          fi
      - name: Run DNS setup script
        env:
          # scripts/setup-preview-dns.mjs currently reads CLOUDFLARE_API_TOKEN;
          # map the canonical CLOUDFLARE_BUILD_API_TOKEN secret into that env var.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/setup-preview-dns.mjs
