name: Deploy Goldshore API

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/deploy-gs-api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gs-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gs-api-build:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/check-lockfile-conflicts
        id: lockfile-check

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-api types:check
      - run: pnpm --filter @goldshore/gs-api build
      - run: pnpm --filter @goldshore/gs-api exec wrangler deploy --env prod --dry-run

  deploy:
    name: Approve and deploy production
    # Restored with the job header. Without it the secret-provisioning steps
    # below run on every pull_request event, which this workflow triggers on.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gs-api-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Restored with the job header. This is the protected-environment approval
    # gate added by #6470; without it production deploys need no approval.
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: prod
      HEALTH_ORIGIN: https://api.goldshore.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/normalize-cf-token
        id: cf-token
        with:
          raw_token: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
          token_name: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN

      - name: Configure Cloudflare authentication
        env:
          CF_TOKEN: ${{ steps.cf-token.outputs.token }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_TOKEN" || { echo "::error::Missing deploy token"; exit 1; }
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Preflight repository and remote contracts
        run: |
          set -euo pipefail
          pnpm validate:workspace
          pnpm validate:structure
          pnpm --filter @goldshore/gs-api build
          pnpm --filter @goldshore/gs-api exec wrangler whoami
          node scripts/cloudflare/audit-worker-secrets.mjs --environment "$TARGET_ENV"

      - name: Upload immutable candidate version
        id: upload
        working-directory: apps/gs-api
        env:
          VERSION_TAG: git-${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload \
            --env "$TARGET_ENV" \
            --tag "$VERSION_TAG" \
            --message "${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --keep-vars \
            --strict 2>&1 | tee upload.log
          version_id="$(sed -nE 's/^Worker Version ID:[[:space:]]*([[:alnum:]-]+).*$/\1/p' upload.log | tail -1)"
          test -n "$version_id" || { echo "::error::Wrangler did not return an immutable Worker version ID"; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Promote candidate to 100 percent traffic
        working-directory: apps/gs-api
        run: |
          pnpm exec wrangler versions deploy \
            --env "$TARGET_ENV" \
            --version-id "${{ steps.upload.outputs.version_id }}" \
            --percentage 100 \
            --message "Promote validated ${GITHUB_SHA}" \
            --yes

      - name: Health check promoted deployment
        run: bash scripts/cloudflare/health-check.sh "$HEALTH_ORIGIN/health"

      - name: Apply newsletter subscriber schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: pnpm exec wrangler d1 execute gs_platform_db --remote --file=db/migrations/0004_newsletter_subscribers.sql --env prod

      - name: Reconcile legacy users schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: bash scripts/reconcile-d1-users-schema.sh gs_platform_db prod

      - name: Apply Google Workspace RBAC schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: |
          set -euo pipefail
          for migration in \
            db/migrations/0005_identity_rbac.sql \
            db/migrations/0005_access_authorization.sql \
            db/migrations/0007_google_workspace_rbac.sql \
            db/migrations/0008_access_owner_role.sql
          do
            pnpm exec wrangler d1 execute gs_platform_db --remote --env prod --file="$migration"
          done
          pnpm exec wrangler d1 execute gs_audit_db --remote --env prod --file=db/migrations/0007_github_webhooks.sql

      - name: Apply infrastructure baseline schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: pnpm exec wrangler d1 execute gs_platform_db --remote --env prod --file=db/migrations/0009_infrastructure_baseline.sql

      - name: Health and readiness checks (gs-api)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          max_retries=5
          retry=0
          
          while [ $retry -lt $max_retries ]; do
            echo "Health/readiness attempt $((retry + 1))/$max_retries..."
            if curl -fsS https://api.goldshore.ai/health >/dev/null 2>&1 \
              && curl -fsS https://api.goldshore.ai/ready >/dev/null 2>&1; then
              echo "✅ gs-api is healthy and ready"
              exit 0
            fi
            retry=$((retry + 1))
            sleep 10
          done
          
          echo "::error::gs-api failed health or readiness checks after $max_retries attempts"
          exit 1

      - name: Deployment audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## gs-api deployment audit"
            echo "- Result: **${{ job.status }}**"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`${{ github.event_name == 'push' && 'production' || 'build-only' }}\`"
            echo "- Initiator: \`${{ github.actor }}\`"
            echo "- Route/Access authority: **not granted to this workflow token**"
          } >> "$GITHUB_STEP_SUMMARY"
