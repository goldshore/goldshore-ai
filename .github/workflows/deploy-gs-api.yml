name: Verify gs-api build

# Cloudflare Workers Builds, configured in the dashboard with the gs-control
# build token, is the sole deployment authority. This workflow never receives
# Cloudflare credentials and never mutates routes, bindings, secrets, or data.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-api.yml'
  workflow_dispatch:

concurrency:
  group: verify-gs-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test gs-api
        run: pnpm --filter @goldshore/gs-api test
      - name: Build and validate the production binding contract
        run: pnpm --filter @goldshore/gs-api build
      - name: Preserve immutable dry-run output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gs-api-${{ github.sha }}
          path: apps/gs-api/dist
          if-no-files-found: error
          retention-days: 30
