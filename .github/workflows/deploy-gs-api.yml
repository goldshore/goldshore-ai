name: Deploy Goldshore API

on:
  push:
    branches: [main, stage]
    paths:
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gs-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

concurrency:
  group: verify-gs-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/check-lockfile-conflicts
        id: lockfile-check

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: ./.github/actions/normalize-cf-token
        id: cf-token
        with:
          raw_token: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
          token_name: 'CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN'

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ steps.cf-token.outputs.token }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_TOKEN" || (echo "::error::Missing CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN" && exit 1)
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-api build

      - name: Apply newsletter subscriber schema
        if: github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: pnpm exec wrangler d1 execute gs_platform_db --remote --file=db/migrations/0004_newsletter_subscribers.sql --env prod

      - name: Apply Google Workspace RBAC schema
        if: github.ref == 'refs/heads/main'
        working-directory: apps/gs-api
        run: |
          set -euo pipefail
          for migration in \
            db/migrations/0005_identity_rbac.sql \
            db/migrations/0005_access_authorization.sql \
            db/migrations/0007_google_workspace_rbac.sql
          do
            pnpm exec wrangler d1 execute gs_platform_db --remote --env prod --file="$migration"
          done
          pnpm exec wrangler d1 execute gs_audit_db --remote --env prod --file=db/migrations/0007_github_webhooks.sql

      - name: Initialize isolated preview schemas
        if: github.ref != 'refs/heads/main'
        working-directory: apps/gs-api
        run: |
          set -euo pipefail
          for migration in \
            db/migrations/0001_initial_schema.sql \
            db/migrations/0003_contact_archive_catalog.sql \
            db/migrations/0004_newsletter_subscribers.sql \
            db/migrations/0005_identity_rbac.sql \
            db/migrations/0005_access_authorization.sql \
            db/migrations/0005_admin_cache.sql \
            db/migrations/0005_google_business_integration.sql \
            db/migrations/0007_google_workspace_rbac.sql
          do
            pnpm exec wrangler d1 execute gs_platform_db_preview --remote --env preview --file="$migration"
          done
          pnpm exec wrangler d1 execute gs_audit_db_preview --remote --env preview --file=db/migrations/0006_github_app_integration.sql
          pnpm exec wrangler d1 execute gs_audit_db_preview --remote --env preview --file=db/migrations/0007_github_webhooks.sql

      - name: Provision gs-api Worker secrets
        working-directory: apps/gs-api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          CONTROL_SYNC_TOKEN: ${{ secrets.CONTROL_SYNC_TOKEN }}
          INTEGRATION_MASTER_KEY: ${{ secrets.INTEGRATION_MASTER_KEY }}
          MAILCHANNELS_SENDER_EMAIL: ${{ secrets.MAILCHANNELS_SENDER_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_GEMINI }}
          GOOGLE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_ADMIN_SERVICE_ACCOUNT }}
          GS_GITHUB_WEBHOOK_SECRET: ${{ secrets.GS_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          trap 'rm -f worker-secrets.json' EXIT
          
          node <<'NODE' > worker-secrets.json
          const names = [
            'JWT_SECRET',
            'ACCESS_CLIENT_SECRET',
            'CONTROL_SYNC_TOKEN',
            'INTEGRATION_MASTER_KEY',
            'MAILCHANNELS_SENDER_EMAIL',
            'OPENAI_API_KEY',
            'GEMINI_API_KEY',
            'GOOGLE_ADMIN_SERVICE_ACCOUNT',
            'GS_GITHUB_WEBHOOK_SECRET',
          ];
          const secrets = Object.fromEntries(
            names.map((name) => [name, process.env[name]]).filter(([, value]) => value),
          );
          const required = ['JWT_SECRET', 'ACCESS_CLIENT_SECRET', 'CONTROL_SYNC_TOKEN'];
          const missing = required.filter((name) => !secrets[name]);
          if (missing.length) throw new Error(`Missing required GitHub secrets: ${missing.join(', ')}`);
          process.stdout.write(JSON.stringify(secrets));
          NODE
          
          pnpm exec wrangler secret bulk worker-secrets.json --env ${{ github.ref == 'refs/heads/main' && 'prod' || 'preview' }}

      - run: pnpm --filter @goldshore/gs-api exec wrangler deploy --env ${{ github.ref == 'refs/heads/main' && 'prod' || 'preview' }}

      - name: Health check (gs-api)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          max_retries=5
          retry=0
          
          while [ $retry -lt $max_retries ]; do
            echo "Health check attempt $((retry + 1))/$max_retries..."
            if curl -fsS https://api.goldshore.ai/health >/dev/null 2>&1; then
              echo "✅ gs-api is healthy"
              exit 0
            fi
            retry=$((retry + 1))
            sleep 10
          done
          
          echo "::error::gs-api failed health check after $max_retries attempts"
          exit 1

      - name: Deployment audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## gs-api deployment audit"
            echo "- Result: **${{ job.status }}**"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}\`"
            echo "- Initiator: \`${{ github.actor }}\`"
            echo "- Route/Access authority: **not granted to this workflow token**"
          } >> "$GITHUB_STEP_SUMMARY"
