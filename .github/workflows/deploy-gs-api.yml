name: Deploy Goldshore API

on:
  pull_request:
    branches: [main]
    paths: &api-paths
      - 'apps/gs-api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-api.yml'
  push:
    branches: [main]
    paths: *api-paths
  workflow_dispatch:

concurrency:
  group: deploy-gs-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gs-api-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gs-api
        run: pnpm --filter @goldshore/gs-api build

  deploy:
    name: Approve and deploy production
    # Restored with the job header. Without it the secret-provisioning steps
    # below run on every pull_request event, which this workflow triggers on.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gs-api-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Restored with the job header. This is the protected-environment approval
    # gate added by #6470; without it production deploys need no approval.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-api types:check
      - name: Validate the production manifest without mutating Cloudflare
        working-directory: apps/gs-api
        run: pnpm exec wrangler deploy --env prod --dry-run

      - name: Provision gs-api Worker secrets
        working-directory: apps/gs-api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          CONTROL_SYNC_TOKEN: ${{ secrets.CONTROL_SYNC_TOKEN }}
          INTEGRATION_MASTER_KEY: ${{ secrets.INTEGRATION_MASTER_KEY }}
          MAILCHANNELS_SENDER_EMAIL: ${{ secrets.MAILCHANNELS_SENDER_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_GEMINI }}
        run: |
          set -euo pipefail
          trap 'rm -f worker-secrets.json' EXIT
          
          node <<'NODE' > worker-secrets.json
          const names = [
            'JWT_SECRET',
            'ACCESS_CLIENT_SECRET',
            'CONTROL_SYNC_TOKEN',
            'INTEGRATION_MASTER_KEY',
            'MAILCHANNELS_SENDER_EMAIL',
            'OPENAI_API_KEY',
            'GEMINI_API_KEY',
          ];
          const secrets = Object.fromEntries(
            names.map((name) => [name, process.env[name]]).filter(([, value]) => value),
          );
          const required = ['JWT_SECRET', 'ACCESS_CLIENT_SECRET', 'CONTROL_SYNC_TOKEN'];
          const missing = required.filter((name) => !secrets[name]);
          if (missing.length) throw new Error(`Missing required GitHub secrets: ${missing.join(', ')}`);
          process.stdout.write(JSON.stringify(secrets));
          NODE
          
          pnpm exec wrangler secret bulk worker-secrets.json --env ${{ github.ref == 'refs/heads/main' && 'prod' || 'preview' }}

      - run: pnpm --filter @goldshore/gs-api run deploy -- --env=${{ github.ref == 'refs/heads/main' && 'prod' || 'preview' }}

      - name: Health check (gs-api)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          max_retries=5
          retry=0
          
          while [ $retry -lt $max_retries ]; do
            echo "Health check attempt $((retry + 1))/$max_retries..."
            if curl -fsS https://api.goldshore.ai/health >/dev/null 2>&1; then
              echo "✅ gs-api is healthy"
              exit 0
            fi
            retry=$((retry + 1))
            sleep 10
          done
          
          echo "::error::gs-api failed health check after $max_retries attempts"
          exit 1

      - name: Stamp release identity into the selected environment
        working-directory: apps/gs-api
        run: pnpm exec wrangler deploy --env prod
      - name: Health check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 https://api.goldshore.ai/health >/dev/null
