name: Cloudflare Infra Guard

on:
  pull_request:
    branches: [main]
  # Runs after platform deploy completes, pinned to the deployed commit SHA
  # to avoid validating requirements that differ from what was actually deployed.
  workflow_run:
    workflows: ["Deploy — GoldShore Platform"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudflare-secrets:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Verify required Cloudflare account and build token secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS_BUILDS: ${{ secrets.CF_WORKERS_BUILDS }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_WORKERS_BUILDS" || (echo "Missing required secret: CF_WORKERS_BUILDS - please add this secret to the repository settings" && exit 1)

  validate-worker-token-policy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Enforce canonical build token usage in workflow env blocks
        run: bash scripts/check-cloudflare-token-policy.sh

  # Live Cloudflare route/DNS validation. Runs post-deploy (workflow_run) or
  # on manual dispatch. Checks out the exact SHA that was deployed to avoid
  # validating requirements from a different commit (e.g. a concurrent push).
  verify-cloudflare:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: test -f ops/cloudflare-required.json
      - name: Verify Cloudflare deploy token is present
        env:
          CF_WORKERS_BUILDS: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_WORKERS_BUILDS" || (echo "Missing required secret: CF_WORKERS_BUILDS" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Validate routes and DNS
        env:
          CF_WORKERS_BUILDS: ${{ secrets.CF_WORKERS_BUILDS }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          def cf_get(url, context):
              req = urllib.request.Request(url, method='GET', headers={'Authorization': f"Bearer {os.environ['CF_WORKERS_BUILDS']}", 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      status = resp.getcode()
                      body = resp.read().decode()
              except urllib.error.HTTPError as err:
                  body = err.read().decode()
                  raise SystemExit(f"Cloudflare API error url={url} status={err.code} body={body}")
              except urllib.error.URLError as err:
                  raise SystemExit(f"Cloudflare API error url={url} status=network-error body={err}")

              try:
                  data = json.loads(body)
              except json.JSONDecodeError:
                  raise SystemExit(f"Cloudflare API error url={url} status={status} body={body}")

              if not data.get('success'):
                  raise SystemExit(f"Cloudflare API error url={url} status={status} body={body}")
              return data['result']
          if not os.environ.get('CF_WORKERS_BUILDS'):
              raise SystemExit('Missing required env var: CF_WORKERS_BUILDS')
          cfg = json.load(open('ops/cloudflare-required.json', 'r', encoding='utf-8'))
          zone_name = urllib.parse.quote(cfg['zone_name'])
          zones_lookup_url = f"https://api.cloudflare.com/client/v4/zones?name={zone_name}"
          zones = cf_get(zones_lookup_url, f"zones lookup (zone_name={cfg['zone_name']})")
          if not zones:
              raise SystemExit(f"Zone not found: {cfg['zone_name']}")
          zone_id = zones[0]['id']
          workers_routes_url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes"
          route_patterns = [r.get('pattern') for r in cf_get(workers_routes_url, f"workers routes lookup (zone_id={zone_id})")]
          for pattern in cfg.get('required_routes', []):
              if pattern not in route_patterns:
                  raise SystemExit(f"Missing required worker route: {pattern}")
          for pattern in cfg.get('forbidden_routes', []):
              if pattern in route_patterns:
                  raise SystemExit(f"Forbidden worker route still present: {pattern}")
          for hostname in cfg.get('required_dns', []):
              encoded = urllib.parse.quote(hostname)
              dns_lookup_url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={encoded}"
              dns_context = f"dns lookup (zone_id={zone_id}, hostname={hostname})"
              if not cf_get(dns_lookup_url, dns_context):
                  raise SystemExit(f"Missing required DNS record: {hostname}")
          print('Cloudflare infra guard passed.')
          PY
