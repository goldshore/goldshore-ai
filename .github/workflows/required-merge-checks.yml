name: Required Merge Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  workspace-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Workspace install
        run: pnpm install --frozen-lockfile

  gs-api-build-test:
    runs-on: ubuntu-latest
    needs: workspace-install
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gs-api
        run: pnpm --filter ./apps/gs-api... build
      - name: Test gs-api
        run: pnpm --filter ./apps/gs-api... test

  gs-web-build:
    runs-on: ubuntu-latest
    needs: workspace-install
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gs-web
        run: pnpm --dir apps/gs-web build
      - name: Detect gs-web release-impact changes
        id: gs-web-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi

          if git diff --name-only "$RANGE" | grep -Eq '^(apps/gs-web/|packages/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json)$'; then
            echo "release_impact=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_impact=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run gs-web release quality gate
        if: steps.gs-web-changes.outputs.release_impact == 'true'
        env:
          LH_MIN_PERFORMANCE: "0.60"
        run: pnpm --dir apps/gs-web check:release

  gs-admin-build:
    runs-on: ubuntu-latest
    needs: workspace-install
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gs-admin
        run: pnpm --dir apps/gs-admin build

  deployment-dry-run:
    runs-on: ubuntu-latest
    needs:
      - gs-api-build-test
      - gs-web-build
      - gs-admin-build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API deploy dry-run
        working-directory: apps/gs-api
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Web deploy dry-run (build)
        run: pnpm --dir apps/gs-web build
      - name: Admin deploy dry-run (build)
        run: pnpm --dir apps/gs-admin build
