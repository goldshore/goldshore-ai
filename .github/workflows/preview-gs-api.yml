name: Preview GS API Worker

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/gs-api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".nvmrc"
      - ".github/workflows/preview-gs-api.yml"

jobs:
  # Deliberately credential-free, mirroring deploy-gs-api.yml's `gs-api-build`
  # job: a `pull_request` job validates the diff, and `--dry-run` needs no
  # Cloudflare account to do it. The steps that talk to Cloudflare belong behind
  # the production environment gate, per AGENTS.md.
  #
  # This job used to normalize the production deploy secret and then run
  # `wrangler whoami`. That step could not pass and could not be made to pass by
  # a pull request author: it verifies a secret rather than the branch, and a
  # fork PR never receives one. It went unnoticed because the bindings check
  # below failed first for as long as this workflow has existed -- [env.preview]
  # was never in the manifest until the commit that added this comment.
  preview-api:
    runs-on: ubuntu-latest
    name: Preview
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace contract
        run: pnpm validate:workspace

      - name: Validate canonical worker structure
        run: pnpm validate:structure

      - name: Validate canonical worker names
        run: pnpm validate:names

      - name: Validate preview gs-api bindings config
        run: |
          test -f apps/gs-api/wrangler.toml
          grep -Eq '^\[env\.preview\]' apps/gs-api/wrangler.toml
          grep -Eq '^\s*\[\[env\.preview\.queues\.(producers|consumers)\]\]' apps/gs-api/wrangler.toml

      - name: Validate GS API worker preview deploy
        working-directory: apps/gs-api
        run: pnpm exec wrangler deploy --env preview --config wrangler.toml --dry-run --outdir=dist-preview
