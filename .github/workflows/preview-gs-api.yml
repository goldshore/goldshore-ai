name: Preview GS API Worker

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/gs-api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  preview-api:
    runs-on: ubuntu-latest
    name: Preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace contract
        run: pnpm validate:workspace

      - name: Validate canonical worker structure
        run: pnpm validate:structure

      - name: Validate canonical worker names
        run: pnpm validate:names

      - name: Validate preview gs-api bindings config
        run: |
          test -f apps/gs-api/wrangler.toml
          grep -Eq '^\[env\.preview\]' apps/gs-api/wrangler.toml
          grep -Eq '^\s*\[\[env\.preview\.services\]\]' apps/gs-api/wrangler.toml
          grep -Eq '^\s*\[\[env\.preview\.queues\.(producers|consumers)\]\]' apps/gs-api/wrangler.toml

      - name: Deploy GS API worker preview to Cloudflare
        working-directory: apps/gs-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env preview --config wrangler.toml
