name: Preview GS API Worker

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/gs-api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".nvmrc"
      - ".github/workflows/preview-gs-api.yml"

concurrency:
  group: preview-gs-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize Cloudflare token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          token="$(
            node <<'NODE'
          const raw = process.env.RAW_CLOUDFLARE_API_TOKEN || "";
          let token = raw.replace(/[\r\n]/g, "").trim();
          const bearer = token.match(/(?:authorization\s*:\s*)?bearer\s+([^\s"',;}]+)/i);
          if (bearer) token = bearer[1];
          const cfut = token.match(/cfut_[A-Za-z0-9_-]+/);
          if (cfut) token = cfut[0];
          token = token.replace(/^[`'"]+|[`'",;}]+$/g, "").replace(/\s/g, "");
          process.stdout.write(token);
          NODE
          )"
          test -n "$token" || (echo "Missing: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_BUILD_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Validate workspace contract
        run: pnpm validate:workspace

      - name: Validate canonical worker structure
        run: pnpm validate:structure

      - name: Validate canonical worker names
        run: pnpm validate:names

      - name: Validate preview gs-api bindings config
        run: |
          test -f apps/gs-api/wrangler.toml
          grep -Eq '^\[env\.preview\]' apps/gs-api/wrangler.toml
          grep -Eq '^\s*\[\[env\.preview\.queues\.(producers|consumers)\]\]' apps/gs-api/wrangler.toml

      - name: Verify Cloudflare auth
        working-directory: apps/gs-api
        run: pnpm exec wrangler whoami

      - name: Validate GS API worker preview deploy
        working-directory: apps/gs-api
        run: pnpm exec wrangler deploy --env preview --config wrangler.toml --dry-run --outdir=dist-preview
