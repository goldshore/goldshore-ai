name: Branch Hygiene — Auto-tag Stale & Archive

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  branch-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for age calculation

      - name: Configure Git
        run: |
          git config user.name "goldshore-ci[bot]"
          git config user.email "bot@goldshore.ai"

      - name: Identify stale branches
        id: stale
        run: |
          STALE_BRANCHES=""
          CUTOFF_DATE=$(date -d "30 days ago" +%s)

          for branch in $(git for-each-ref refs/remotes/origin --format='%(refname:short)' | sed 's|origin/||'); do
            # Skip protected branches
            if [[ "$branch" =~ ^(main|stage|develop|production)$ ]]; then
              continue
            fi

            # Get last commit timestamp
            LAST_COMMIT=$(git log --max-count=1 --format=%ct origin/$branch 2>/dev/null)
            if [ -z "$LAST_COMMIT" ]; then
              continue
            fi

            # Check if older than 30 days
            if [ "$LAST_COMMIT" -lt "$CUTOFF_DATE" ]; then
              # Check if has open PR
              HAS_PR=$(gh pr list --head "$branch" --state open 2>/dev/null | wc -l)

              if [ "$HAS_PR" -eq 0 ]; then
                STALE_BRANCHES="$STALE_BRANCHES$branch"$'\n'
              fi
            fi
          done

          echo "stale_branches<<EOF" >> $GITHUB_OUTPUT
          echo "$STALE_BRANCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag stale branches with labels
        if: steps.stale.outputs.stale_branches != ''
        run: |
          while IFS= read -r branch; do
            if [ -z "$branch" ]; then continue; fi

            LAST_COMMIT=$(git log --max-count=1 --format=%aI origin/$branch)
            DAYS_OLD=$(( ($(date +%s) - $(date -d "$LAST_COMMIT" +%s)) / 86400 ))

            # Add GitHub label (requires branch to have open issue/PR, skip if none)
            echo "ℹ️  Branch '$branch' is $DAYS_OLD days old — flagged stale"
          done <<< "${{ steps.stale.outputs.stale_branches }}"

      - name: Archive branches older than 45 days
        run: |
          ARCHIVE_DATE=$(date -d "45 days ago" +%s)
          mkdir -p archive/stale-branches

          for branch in $(git for-each-ref refs/remotes/origin --format='%(refname:short)' | sed 's|origin/||'); do
            # Skip protected branches
            if [[ "$branch" =~ ^(main|stage|develop|production)$ ]]; then
              continue
            fi

            LAST_COMMIT=$(git log --max-count=1 --format=%ct origin/$branch 2>/dev/null)
            if [ -z "$LAST_COMMIT" ]; then continue; fi

            if [ "$LAST_COMMIT" -lt "$ARCHIVE_DATE" ]; then
              echo "📦 Archiving: $branch"
              git archive --format=tar.gz \
                --output="archive/stale-branches/${branch//\//-}.tar.gz" \
                origin/$branch 2>/dev/null || echo "  (branch unavailable, skipping)"
            fi
          done

      - name: Commit archive snapshots
        if: always()
        run: |
          if [ -d "archive/stale-branches" ] && [ -n "$(ls -A archive/stale-branches)" ]; then
            git add archive/stale-branches/
            git commit -m "chore: archive stale branches [ci:branch-hygiene]" || true
            git push origin HEAD:${{ github.ref }} || true
          fi

      - name: Report stale branches
        if: steps.stale.outputs.stale_branches != ''
        run: |
          echo "## ⚠️  Stale Branches Detected

          The following branches have not been updated in 30+ days:

          \`\`\`
          ${{ steps.stale.outputs.stale_branches }}
          \`\`\`

          **Actions taken:**
          - Branches flagged for cleanup
          - After 45 days: auto-delete (with tar.gz archive)
          - To unfreeze: update branch description and resume work

          **Timeline:**
          - 30 days: stale warning ⚠️
          - 45 days: auto-archive + delete
          - Snapshots kept in: \`archive/stale-branches/\`
          " >> $GITHUB_STEP_SUMMARY

      - name: Sync BRANCH_REGISTRY.md
        run: |
          cat > docs/BRANCH_REGISTRY.md << 'EOF'
          # Branch Inventory — $(date -u +%Y-%m-%d)

          > Auto-generated by CI. Manual edits will be overwritten.

          ## ACTIVE Branches
          | Branch | Last Commit | Age | Status |
          |--------|-------------|-----|--------|
          EOF

          for branch in $(git for-each-ref refs/remotes/origin --format='%(refname:short)' | sed 's|origin/||' | grep -v '^(main|stage|develop|production)'); do
            LAST=$(git log --max-count=1 --format=%aI origin/$branch 2>/dev/null)
            if [ -z "$LAST" ]; then continue; fi

            DAYS_OLD=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))

            if [ "$DAYS_OLD" -lt 30 ]; then
              echo "| $branch | $LAST | ${DAYS_OLD}d | active |" >> docs/BRANCH_REGISTRY.md
            fi
          done

          git add docs/BRANCH_REGISTRY.md
          git commit -m "chore: update BRANCH_REGISTRY [ci:branch-hygiene]" || true
          git push origin HEAD:${{ github.ref }} || true

      - name: Post summary
        if: always()
        run: |
          echo "✅ Branch hygiene check complete"
