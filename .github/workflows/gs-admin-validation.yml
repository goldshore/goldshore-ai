name: GS Admin Validation

on:
  pull_request:
    paths:
      - 'apps/gs-admin/**'
      - 'packages/schema/migrations/d1/**'
      - 'infra/cloudflare/**'
      - 'scripts/cloudflare/**'
      - '.github/workflows/gs-admin-validation.yml'
  workflow_dispatch:
    inputs:
      export_cloudflare_inventory:
        description: 'Run the read-only Cloudflare inventory export'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gs-admin-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm --filter @goldshore/gs-admin check

      - name: Build gs-admin
        run: pnpm --filter @goldshore/gs-admin build

      - name: Validate mock Wrangler configuration
        run: pnpm exec wrangler types --config apps/gs-admin/wrangler.mock.toml

      - name: Apply mock D1 migration locally
        run: >-
          pnpm exec wrangler d1 execute gs_platform_db_mock
          --local
          --config apps/gs-admin/wrangler.mock.toml
          --file packages/schema/migrations/d1/0010_mock_mail_mcp_api.sql

      - name: Verify login build output
        run: |
          test -d apps/gs-admin/dist
          find apps/gs-admin/dist -maxdepth 3 -type f | sort

  export-cloudflare-inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.export_cloudflare_inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: GS-WEB-PROD
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Export read-only Cloudflare inventory
        env:
          CF_API_TOKEN: ${{ secrets.CF_READ_ONLY_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_IDS: ${{ secrets.CF_ZONE_IDS }}
        run: node scripts/cloudflare/export-live-inventory.mjs

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-inventory
          path: reports/cloudflare/live/inventory.json
          if-no-files-found: error
          retention-days: 7
