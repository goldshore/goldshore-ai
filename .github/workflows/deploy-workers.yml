name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - 'apps/gs-web/**'
      - 'packages/**'
      - 'wrangler*.toml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gs-api, gs-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro 7 requires >=22.12.0, so Node 20 fails this job at the build
          # step every time. Track .node-version (22.22.2) like the other
          # workflows instead of pinning a second, drifting version here.
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Deploy ${{ matrix.app }} to preview
        if: github.event_name == 'pull_request'
        run: pnpm --filter ${{ matrix.app }} wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}

      - name: Deploy ${{ matrix.app }} to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter ${{ matrix.app }} wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
