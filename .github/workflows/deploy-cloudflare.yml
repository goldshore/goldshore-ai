name: Deploy Cloudflare apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/Cloudflare/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "App/service to deploy"
        required: true
        default: "gs-web"
        type: choice
        options:
          - gs-web
          - gs-admin
          - gs-api
          - gs-gateway
          - gs-control
          - gs-mail
          - gs-agent
          - gs-trading
          - banproof-me
          - armsway-com
      environment:
        description: "Cloudflare environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - preview

concurrency:
  group: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}

jobs:
  deploy-web:
    name: Deploy gs-web Pages
    if: github.event_name == 'push' || inputs.target == 'gs-web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-web build
      - name: Deploy gs-web to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-web/dist --project-name=gs-web --branch=${{ github.ref_name }}

  deploy-admin:
    name: Deploy gs-admin Pages
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'gs-admin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-admin build
      - name: Deploy gs-admin to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-admin/dist --project-name=gs-admin --branch=${{ github.ref_name }}

  deploy-worker:
    name: Deploy Worker
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["gs-api","gs-gateway","gs-control","gs-mail","gs-agent","gs-trading","banproof-me","armsway-com"]'), inputs.target)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dry-run build selected worker
        run: pnpm --filter @goldshore/${{ inputs.target }} build
      - name: Deploy selected worker
        working-directory: apps/${{ inputs.target }}
        run: pnpm exec wrangler deploy --env ${{ inputs.environment }}
