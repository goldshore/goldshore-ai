name: Deploy Cloudflare apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/Cloudflare/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "App/service to deploy (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gs-web
          - gs-admin
          - gs-api
          - gs-gateway
          - gs-control
          - gs-mail
          - gs-agent
          - gs-trading
          - banproof-me
          - gs-www-redirect
          - gs-core-worker
          - armsway-com
      environment:
        description: "Cloudflare environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - preview

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}

# ── Shared setup ──────────────────────────────────────────────────────────────
# Each job repeats the three setup steps (checkout / pnpm / node) because
# GitHub Actions has no reusable step blocks. Jobs run in parallel so the
# repeated setup is cheaper than serialising through a setup job.

jobs:

  # ── gs-web (Cloudflare Pages) ───────────────────────────────────────────────
  deploy-web:
    name: Deploy gs-web (Pages)
    if: >
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'gs-web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-web build
      - name: Deploy to Cloudflare Pages
        # --branch sets the Pages deployment alias; main branch maps to production
        run: pnpm exec wrangler pages deploy apps/gs-web/dist --project-name=gs-web --branch=${{ github.ref_name }}

  # ── gs-admin (Cloudflare Pages) ─────────────────────────────────────────────
  deploy-admin:
    name: Deploy gs-admin (Pages)
    if: >
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'gs-admin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-admin build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-admin/dist --project-name=gs-admin --branch=${{ github.ref_name }}

  # ── Workers (matrix) ────────────────────────────────────────────────────────
  # wrangler deploy auto-creates the worker if it doesn't exist and updates it
  # if it does. Route/custom-domain binding is declared in each wrangler.toml
  # and applied on every deploy — no manual DNS setup needed for custom_domain=true.
  #
  # Workers with route-based patterns (zone_name) require a proxied DNS record
  # to already exist for the zone. Those records are managed in desired-state.yaml
  # and applied by infra/Cloudflare/deploy.ts (or manually via CF Dashboard).
  deploy-workers:
    name: Deploy ${{ matrix.app }}
    if: >
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == matrix.app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false   # one broken worker does not cancel the others
      matrix:
        include:
          - app: gs-gateway
            filter: "@goldshore/gs-gateway"
          - app: gs-api
            filter: "@goldshore/gs-api"
          - app: gs-agent
            filter: "@goldshore/gs-agent"
          - app: gs-control
            filter: "@goldshore/gs-control"
          - app: gs-trading
            filter: "@goldshore/gs-trading"
          - app: gs-mail
            filter: "@goldshore/gs-mail"
          - app: banproof-me
            filter: "@goldshore/banproof-me"
          - app: gs-www-redirect
            filter: "@goldshore/gs-www-redirect"
          - app: gs-core-worker
            filter: "@goldshore/gs-core-worker"
          - app: armsway-com
            filter: "@goldshore/armsway-com"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.filter }} build
      - name: Deploy ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: |
          ENV=${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
          pnpm exec wrangler deploy --env $ENV
