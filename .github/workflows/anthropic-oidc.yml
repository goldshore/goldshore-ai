# Anthropic requests are made server-side by gs-api. Cloudflare AI Gateway does
# not document a GitHub OIDC workload-identity token exchange, so this reusable
# workflow deliberately mints and exports no credentials.
#
# Runtime setup (performed by an operator, never by a calling GitHub job):
#   wrangler secret put ANTHROPIC_API_KEY --env preview --name gs-api
#   wrangler secret put ANTHROPIC_API_KEY --env prod --name gs-api
# Set ANTHROPIC_GATEWAY_ID in wrangler.toml after creating the gateway. gs-api
# uses its Workers AI binding to obtain the documented, pre-authenticated
# Anthropic provider endpoint and supplies the provider key per request.

name: Anthropic Gateway Guard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate server-side Anthropic ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential outputs and guessed token exchanges
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/anthropic-oidc.yml
          ! grep -Eq '(anthropic/[t]oken|api_key=.*GITHUB_OUTPUT|[o]utputs:[[:space:]]*$)' "$workflow"
          grep -q 'ANTHROPIC_API_KEY --env preview --name gs-api' "$workflow"
