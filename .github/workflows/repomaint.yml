name: Repo Maintenance
on:
  workflow_dispatch:
    inputs:
      log_ref:
        description: 'Target ref for report'
        default: 'origin/main'
      log_limit:
        description: 'Number of logs'
        default: '20'
      confirm_apply:
        description: 'Set to true to run reconciliation'
        type: boolean
        default: false

concurrency:
  group: repomaint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Health Check
        run: pnpm run repo:health

      - name: Build
        run: pnpm -r build

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_REF: ${{ github.event.inputs.log_ref }}
          LOG_LIMIT: ${{ github.event.inputs.log_limit }}
        run: bash scripts/maintenance/branch-report.sh
