name: Inventory gs-web configuration

# Read-only drift inventory. Cloudflare production configuration is changed only
# by an approved human in the dashboard; this workflow has no Cloudflare credentials.
on:
  pull_request:
    paths:
      - 'apps/gs-web/**'
      - 'scripts/export-cloudflare-inventory.py'
      - 'infra/Cloudflare/dashboard-inventory.json'
      - '.github/workflows/deploy-gs-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-web/**'
      - 'scripts/export-cloudflare-inventory.py'
      - 'infra/Cloudflare/dashboard-inventory.json'
      - '.github/workflows/deploy-gs-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build verification only — this job does NOT deploy.
  #
  # gs-web is an SSR Astro app (`main = ./src/worker.ts`, `output: server`) whose
  # entrypoint is emitted to dist/server. It is deployed as the `gs-web-prod`
  # Worker by the Cloudflare Workers Build git integration, which is the single
  # authoritative deploy path.
  #
  # Do not add a second static-site deployment. Dynamic and static output ship
  # together through the canonical Worker-with-Assets release.
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
  inventory:
    name: Export redacted expected state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Export binding names, routes, Access IDs, and secret names
        run: python3 scripts/export-cloudflare-inventory.py cloudflare-inventory.json
      - name: Display redacted inventory
        run: jq . cloudflare-inventory.json
      - name: Upload drift-review artifact
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-inventory-${{ github.run_id }}-deploy-gs-web
          path: cloudflare-inventory.json
          retention-days: 30
