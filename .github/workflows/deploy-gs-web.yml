name: Verify gs-web build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gs-web/**'
      - 'packages/**'
      - 'scripts/build-openapi.mjs'
      - 'scripts/verify-web-dist.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gs-web/**'
      - 'packages/**'
      - 'scripts/build-openapi.mjs'
      - 'scripts/verify-web-dist.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/deploy-gs-web.yml'
  workflow_dispatch:

concurrency:
  group: verify-gs-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cloudflare Workers Builds is the only deployment owner. This job builds the
  # exact commit once and retains its Worker output for audit/reproduction; it
  # never calls Wrangler or a Cloudflare deploy hook.
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gs-web Worker output once
        run: pnpm build:pages

      - name: Preserve release SHA with build output
        run: printf '%s\n' "$RELEASE_SHA" > apps/gs-web/dist/release.sha

      - name: Preserve immutable gs-web build
        uses: actions/upload-artifact@v7
        with:
          name: gs-web-${{ env.RELEASE_SHA }}
          path: apps/gs-web/dist
          if-no-files-found: error
          retention-days: 30
