name: Setup CF Agent Access

# Rotates the CF Access Service Token, upserts all Access Applications,
# and propagates CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET to all repos.
# Run manually: Actions → Setup CF Agent Access → Run workflow.
#
# skip_revoke: skip revoking the old token (e.g. already rotated)
# skip_apps:   skip creating brand-new Access apps — existing apps always
#              have their domains and policies updated with the new token UUID

on:
  workflow_dispatch:
    inputs:
      skip_revoke:
        description: 'Skip revoking old token (if already rotated)'
        required: false
        default: false
        type: boolean
      skip_apps:
        description: 'Skip creating NEW Access apps (existing apps still get updated)'
        required: false
        default: false
        type: boolean
      include_ssh_laptop:
        description: 'Upsert the "Temp HP Laptop SSH" browser-SSH app (ssh-laptop.goldshore.ai)'
        required: false
        default: true
        type: boolean
      include_mcp_portal:
        description: 'Upsert an mcp_portal-type app on mcp.goldshore.ai (conflicts with the self_hosted GoldShore MCP app — see comments)'
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: CF Access — token + apps + secrets
    runs-on: ubuntu-latest
    permissions: {}

    env:
      CF_ACCOUNT: f77de112d2019e5456a3198a8bb50bd2
      CF_API: https://api.cloudflare.com/client/v4
      OLD_CLIENT_ID: 9ca952086adc30cf53634d78d099ce58.access

    steps:
      # ------------------------------------------------------------------ #
      # 0. Verify CLOUDFLARE_API_TOKEN has Access permissions
      #    Probes both service_tokens AND access/apps to catch tokens that
      #    have Service Token scope but lack Apps/Policies edit permission.
      #    A partial-permission failure here aborts BEFORE any revocation.
      # ------------------------------------------------------------------ #
      - name: Verify CF token has Access scope
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          # Check 1: service_tokens endpoint
          ST_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "$CF_API/accounts/$CF_ACCOUNT/access/service_tokens" \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$ST_STATUS" = "403" ] || [ "$ST_STATUS" = "401" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN lacks Access: Service Tokens permission."
            echo "::error::Edit at https://dash.cloudflare.com/profile/api-tokens"
            echo "::error::Required: Access: Service Tokens (Edit)"
            exit 1
          fi
          echo "CF token Service Tokens scope: OK (HTTP $ST_STATUS)"

          # Check 2: access/apps endpoint (separate permission from service_tokens)
          APPS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$APPS_STATUS" = "403" ] || [ "$APPS_STATUS" = "401" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN lacks Access: Apps and Policies permission."
            echo "::error::Edit at https://dash.cloudflare.com/profile/api-tokens"
            echo "::error::Required: Access: Apps and Policies (Edit)"
            echo "::error::Token has service_tokens scope (HTTP $ST_STATUS) but not apps scope (HTTP $APPS_STATUS)"
            echo "::error::Aborting BEFORE any revocation to avoid stranding Access apps on a revoked token."
            exit 1
          fi
          echo "CF token Access Apps list scope: OK (HTTP $APPS_STATUS)"

          # Check 3: prove Apps/Policies edit with a temporary app and policy.
          # Listing apps can succeed for tokens that later fail when this workflow
          # upserts /access/apps or /policies after revocation, so validate the
          # exact write surfaces before touching the existing service token.
          PROBE_NAME="codex-access-permission-probe-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          PROBE_DOMAIN="codex-access-probe-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}.goldshore.ai"
          PROBE_APP_RESP=$(jq -nc \
            --arg n "$PROBE_NAME" \
            --arg d "$PROBE_DOMAIN" \
            '{name:$n,type:"self_hosted",domain:$d,self_hosted_domains:[$d],session_duration:"1h"}' | \
            curl -s -X POST "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-)
          PROBE_APP_ID=$(echo "$PROBE_APP_RESP" | jq -r '.result.id // empty')
          if [ -z "$PROBE_APP_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot create Access apps; aborting BEFORE token revocation."
            echo "$PROBE_APP_RESP" | jq .
            exit 1
          fi

          cleanup_probe() {
            curl -s -X DELETE \
              "$CF_API/accounts/$CF_ACCOUNT/access/apps/$PROBE_APP_ID" \
              -H "Authorization: Bearer $CF_TOKEN" > /dev/null || true
          }
          trap cleanup_probe EXIT

          PROBE_POLICY_RESP=$(jq -nc \
            '{name:"Codex permission probe",decision:"bypass",include:[{"everyone":{}}],exclude:[],require:[]}' | \
            curl -s -X POST "$CF_API/accounts/$CF_ACCOUNT/access/apps/$PROBE_APP_ID/policies" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-)
          PROBE_POLICY_ID=$(echo "$PROBE_POLICY_RESP" | jq -r '.result.id // empty')
          if [ -z "$PROBE_POLICY_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot create Access policies; aborting BEFORE token revocation."
            echo "$PROBE_POLICY_RESP" | jq .
            exit 1
          fi
          cleanup_probe
          trap - EXIT
          echo "CF token Access Apps/Policies edit scope: OK"

          echo "All required CF API permissions verified before service-token revocation."

      # ------------------------------------------------------------------ #
      # 0a. When skip_apps=true, verify required apps exist before rotating
      #     or revoking any service token. Policy refreshes still run later;
      #     this guard only prevents issuing credentials that cannot be
      #     attached to every required Access app.
      # ------------------------------------------------------------------ #
      - name: Preflight existing Access apps when app creation is skipped
        if: ${{ inputs.skip_apps }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INCLUDE_SSH_LAPTOP: ${{ inputs.include_ssh_laptop }}
          INCLUDE_MCP_PORTAL: ${{ inputs.include_mcp_portal }}
        run: |
          set -euo pipefail

          APPS=$(curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
            -H "Authorization: Bearer $CF_TOKEN")

          require_app() {
            local name="$1" domain="${2:-}"
            local id
            id=$(echo "$APPS" | jq -r --arg n "$name" --arg d "$domain" \
              '[.result[] | select(.name == $n or ($d != "" and ((.domain == $d) or ((.self_hosted_domains // []) | index($d)))))] | first | .id // empty')
            if [ -z "$id" ]; then
              echo "::error::skip_apps=true but required Access app is missing: $name ($domain)."
              return 1
            fi
            echo "Preflight found Access app [$name]: $id"
          }

          require_app "GoldShore Trading - Schwab Callback" "trading.goldshore.ai/oauth/schwab/callback"
          require_app "GoldShore Trading - Robinhood Callback" "trading.goldshore.ai/oauth/robinhood/callback"
          require_app "Goldshore API - Public Probes" "api.goldshore.ai/health"
          require_app "Goldshore API - Public Forms" "api.goldshore.ai/v1/forms/*"
          require_app "Goldshore Gateway - Public Probes" "gw.goldshore.ai/health"
          require_app "Dashboard" "goldshore.ai/app"
          require_app "GoldShore Admin" "admin.goldshore.ai"
          require_app "GoldShore Trading" "trading.goldshore.ai"
          require_app "Goldshore Ops" "ops.goldshore.ai"
          require_app "Signals" "signals.goldshore.ai"
          require_app "Goldshore API" "api.goldshore.ai"
          require_app "GoldShore MCP" "mcp.goldshore.ai"
          require_app "Goldshore Gateway" "gw.goldshore.ai"
          require_app "GoldShore-Web-Preview" "preview.goldshore.ai"

          if [ "$INCLUDE_SSH_LAPTOP" = "true" ]; then
            require_app "Temp HP Laptop SSH" "ssh-laptop.goldshore.ai"
          fi
          if [ "$INCLUDE_MCP_PORTAL" = "true" ]; then
            require_app "Goldshore MCP Portal" "mcp.goldshore.ai"
          fi

          echo "skip_apps preflight passed; token rotation can safely proceed to policy refresh."

      # ------------------------------------------------------------------ #
      # 1. Revoke compromised service token
      # ------------------------------------------------------------------ #
      - name: Revoke compromised service token
        if: ${{ !inputs.skip_revoke }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          LIST=$(curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/service_tokens" \
            -H "Authorization: Bearer $CF_TOKEN")
          OLD_UUID=$(echo "$LIST" | \
            jq -r --arg cid "$OLD_CLIENT_ID" \
            '.result[] | select(.client_id == $cid) | .id // empty')
          if [ -n "$OLD_UUID" ]; then
            # Cloudflare refuses to delete a service token still referenced by
            # any Access policy (code 12139). Find and remove every such
            # reference first -- this can include apps outside the set this
            # workflow otherwise manages, so scan all apps' policies rather
            # than assuming it's one of the 9 known ones.
            APPS_RESP=$(curl -sS -w '\n%{http_code}' "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
              -H "Authorization: Bearer $CF_TOKEN")
            APPS_STATUS="${APPS_RESP##*$'\n'}"
            APPS_BODY="${APPS_RESP%$'\n'*}"
            if [ "$APPS_STATUS" -lt 200 ] || [ "$APPS_STATUS" -ge 300 ]; then
              echo "::warning::CF API GET /access/apps failed (HTTP $APPS_STATUS) while scanning for stale token references: $APPS_BODY"
              ALL_APPS=""
            else
              ALL_APPS=$(echo "$APPS_BODY" | jq -r '.result[].id')
            fi
            for app_id in $ALL_APPS; do
              POL_RESP=$(curl -sS -w '\n%{http_code}' "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
                -H "Authorization: Bearer $CF_TOKEN")
              POL_STATUS="${POL_RESP##*$'\n'}"
              POL_BODY="${POL_RESP%$'\n'*}"
              if [ "$POL_STATUS" -lt 200 ] || [ "$POL_STATUS" -ge 300 ]; then
                echo "::warning::CF API GET /access/apps/$app_id/policies failed (HTTP $POL_STATUS), skipping app: $POL_BODY"
                continue
              fi
              STALE_POLICIES=$(echo "$POL_BODY" | \
                jq -r --arg tid "$OLD_UUID" \
                '.result[] | select(.include[]?.service_token.token_id? == $tid) | .id // empty')
              for pol_id in $STALE_POLICIES; do
                [ -z "$pol_id" ] && continue
                DP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                  "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies/$pol_id" \
                  -H "Authorization: Bearer $CF_TOKEN")
                if [ "$DP_STATUS" -lt 200 ] || [ "$DP_STATUS" -ge 300 ]; then
                  # App-scoped delete failing (400) means this is a reusable
                  # policy shared across apps (Cloudflare confirmed via 409
                  # on account-level DELETE while app_count > 0: it refuses
                  # to delete a reusable policy still in use anywhere).
                  # These are real, actively-used allow-lists (e.g. named
                  # "Cloudflare Workers Preview URLs", covering human emails
                  # + device posture + GitHub org + the old token), possibly
                  # attached to apps outside the 9 this workflow manages
                  # (Cloudflare's own App Launcher, seen in practice). The
                  # correct fix is editing the policy to drop only the old
                  # token's include entry, not deleting the whole thing.
                  APP_NAME=$(curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id" \
                    -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.name // "?"' || echo "?")
                  POL_DEF=$(curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/policies/$pol_id" \
                    -H "Authorization: Bearer $CF_TOKEN" || echo '{}')
                  POL_RESULT=$(echo "$POL_DEF" | jq -c '.result // .')
                  echo "::notice::Policy $pol_id is reusable (app-scoped delete HTTP $DP_STATUS). Attached app: [$APP_NAME] ($app_id). Full definition: $POL_RESULT"
                  NEW_INCLUDE=$(echo "$POL_RESULT" | jq -c --arg tid "$OLD_UUID" \
                    '[.include[] | select((.service_token.token_id // "") != $tid)]')
                  UPDATE_BODY=$(echo "$POL_RESULT" | jq -c --argjson inc "$NEW_INCLUDE" \
                    '{name, decision, include: $inc, exclude, require}')
                  UPD_RESP=$(echo "$UPDATE_BODY" | curl -sS -w '\n%{http_code}' -X PUT \
                    "$CF_API/accounts/$CF_ACCOUNT/access/policies/$pol_id" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data @-)
                  UPD_STATUS="${UPD_RESP##*$'\n'}"
                  UPD_BODY="${UPD_RESP%$'\n'*}"
                  if [ "$UPD_STATUS" -lt 200 ] || [ "$UPD_STATUS" -ge 300 ]; then
                    echo "::warning::CF API PUT reusable policy $pol_id (dropping old-token entry) failed (HTTP $UPD_STATUS), continuing: $UPD_BODY"
                    continue
                  fi
                  echo "Edited reusable policy $pol_id [$(echo "$POL_RESULT" | jq -r '.name')]: removed old-token include entry, kept the rest"
                  continue
                fi
                echo "Removed stale policy $pol_id (app $app_id) referencing old token"
              done
            done
            DEL_RESP=$(curl -sS -w '\n%{http_code}' -X DELETE \
              "$CF_API/accounts/$CF_ACCOUNT/access/service_tokens/$OLD_UUID" \
              -H "Authorization: Bearer $CF_TOKEN")
            DEL_STATUS="${DEL_RESP##*$'\n'}"
            DEL_BODY="${DEL_RESP%$'\n'*}"
            if [ "$DEL_STATUS" -lt 200 ] || [ "$DEL_STATUS" -ge 300 ]; then
              echo "::error::CF API DELETE /access/service_tokens/$OLD_UUID failed (HTTP $DEL_STATUS): $DEL_BODY"
              exit 1
            fi
            echo "$DEL_BODY" | jq -r '.success'
            echo "Revoked token UUID: $OLD_UUID"
          else
            echo "Compromised token not found — already revoked or never existed."
          fi

      # ------------------------------------------------------------------ #
      # 2. Create new goldshore-agents service token
      # ------------------------------------------------------------------ #
      - name: Create goldshore-agents service token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RES=$(curl -sf -X POST \
            "$CF_API/accounts/$CF_ACCOUNT/access/service_tokens" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"goldshore-agents"}')

          TOKEN_UUID=$(echo "$RES" | jq -r '.result.id // empty')
          CLIENT_ID=$(echo  "$RES" | jq -r '.result.client_id // empty')
          CLIENT_SEC=$(echo "$RES" | jq -r '.result.client_secret // empty')

          if [ -z "$TOKEN_UUID" ]; then
            echo "::error::Service token creation failed:"
            echo "$RES" | jq .
            exit 1
          fi

          echo "token_uuid=$TOKEN_UUID"     >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID"       >> "$GITHUB_OUTPUT"
          echo "client_secret=$CLIENT_SEC"  >> "$GITHUB_OUTPUT"
          echo "Created service token: $CLIENT_ID (UUID: $TOKEN_UUID)"

      # ------------------------------------------------------------------ #
      # 3. Upsert Access Applications + Policies
      #
      # Always runs — even when skip_apps=true — so that existing Access apps
      # get their domains and policies updated with the newly-created token UUID.
      # skip_apps only suppresses creation of brand-new apps.
      # ------------------------------------------------------------------ #
      - name: Upsert Access Applications and Policies
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_UUID: ${{ steps.token.outputs.token_uuid }}
          SKIP_NEW_APPS: ${{ inputs.skip_apps }}
          INCLUDE_SSH_LAPTOP: ${{ inputs.include_ssh_laptop }}
          INCLUDE_MCP_PORTAL: ${{ inputs.include_mcp_portal }}
        run: |
          set -euo pipefail

          # Cloudflare Access service-token rules use token_id (the token UUID),
          # not the generated client ID.
          SERVICE_INCLUDE=$(jq -nc --arg id "$TOKEN_UUID" \
            '[{"service_token":{"token_id":$id}}]')
          # Mirrors desired-state.yaml include block: Workspace domain + personal Gmail
          OWNER_INCLUDE=$(jq -nc \
            '[{"email_domain":{"domain":"goldshore.ai"}},{"email":{"email":"marstonr6@gmail.com"}}]')

          MISSING_REQUIRED_APPS=0
          GS_API_ACCESS_AUD="d303765cb1746f11a0fe37affad2d191deb18771a1d98beb29cb9c52b6cd731b"

          # push_worker_secret is also used here to keep Worker AUD secrets in sync
          push_worker_secret() {
            local worker="$1" key="$2" val="$3"
            local resp status body
            resp=$(curl -sS -w '\n%{http_code}' -X PUT \
              "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$worker/secrets" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$key\",\"text\":\"$val\",\"type\":\"secret_text\"}")
            status="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              # Non-fatal: this is a best-effort convenience sync (e.g. Cloudflare's
              # "latest version not deployed" 10215 when Gradual Deployments has a
              # pending version) and must not block the Access apps/policies that
              # follow it in the script.
              echo "::warning::CF API PUT /workers/scripts/$worker/secrets failed for key=[$key] (HTTP $status), continuing: $body"
              return 0
            fi
            echo "$body" | jq -r '"  \(.result.name // "?") => \(.success)"'
          }

          find_app() {
            local name="$1" domain="${2:-}" expected_aud="${3:-}"
            curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
              -H "Authorization: Bearer $CF_TOKEN" | \
            jq -r --arg n "$name" --arg d "$domain" --arg aud "$expected_aud" \
              '[.result[] | select(
                .name == $n
                or ($aud != "" and .aud == $aud)
                or ($d != "" and ((.domain == $d) or ((.self_hosted_domains // []) | index($d))))
              )] | first | .id // empty'
          }

          access_app_payload() {
            local name="$1" domain="$2" extra_domains="${3:-[]}"
            jq -nc \
              --arg n "$name" \
              --arg d "$domain" \
              --argjson ed "$extra_domains" \
              '{name:$n,type:"self_hosted",domain:$d,
                self_hosted_domains:(([$d] + $ed) | unique),
                session_duration:"24h",
                http_only_cookie_attribute:true,
                auto_redirect_to_identity:false}'
          }

          # PUT existing app with the same full desired-state body used for
          # creation so stale domain/path bindings from prior runs are
          # corrected. Cloudflare Access documents full application updates via
          # PUT, not PATCH; using PATCH can fail after token revoke and strand a
          # rotation before policies and secrets are refreshed.
          update_app() {
            local app_id="$1" name="$2" domain="$3" extra_domains="${4:-[]}"
            local resp status body
            resp=$(access_app_payload "$name" "$domain" "$extra_domains" | \
              curl -sS -w '\n%{http_code}' -X PUT "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @-)
            status="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::CF API PUT /access/apps/$app_id failed for [$name] domain=[$domain] (HTTP $status): $body" >&2
              exit 1
            fi
            echo "$body" | jq -r '"  updated app => \(.success)"'
          }

          get_app_aud() {
            local app_id="$1"
            curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id" \
              -H "Authorization: Bearer $CF_TOKEN" | \
            jq -r '.result.aud // empty'
          }

          sync_aud_workers() {
            local aud="$1" aud_workers="${2:-}"
            if [ -n "$aud_workers" ] && [ -n "$aud" ]; then
              echo "  Propagating CLOUDFLARE_ACCESS_AUDIENCE to: $aud_workers"
              for w in $aud_workers; do
                push_worker_secret "$w" CLOUDFLARE_ACCESS_AUDIENCE "$aud"
              done
            fi
          }

          # Create a new app and return the full CF response JSON.
          # Caller extracts .result.id and .result.aud from the returned JSON.
          make_app_json() {
            local name="$1" domain="$2" extra_domains="${3:-[]}"
            local resp status body
            resp=$(access_app_payload "$name" "$domain" "$extra_domains" | \
              curl -sS -w '\n%{http_code}' -X POST "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @-)
            status="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::CF API POST /access/apps failed for [$name] domain=[$domain] (HTTP $status): $body" >&2
              exit 1
            fi
            echo "$body"
          }

          add_policy() {
            local app_id="$1" name="$2" decision="$3" include="$4"
            jq -nc \
              --arg n  "$name" \
              --arg d  "$decision" \
              --argjson inc "$include" \
              '{name:$n,decision:$d,include:$inc,exclude:[],require:[]}' | \
            curl -sf -X POST \
              "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @- | jq -r '"  policy \(.result.name // "?") => \(.success)"'
          }

          add_bypass_policy() {
            local app_id="$1"
            jq -nc \
              '{name:"Public bypass",decision:"bypass",
                include:[{"everyone":{}}],exclude:[],require:[]}' | \
            curl -sf -X POST \
              "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @- | jq -r '"  bypass policy => \(.success)"'
          }

          # Delete only non-bypass policies so health-check and OAuth callback
          # bypass rules (on existing apps) are preserved across token rotations.
          # Deleting stale policies is cleanup, not core correctness -- the
          # replacement policies still get added right after by the caller
          # regardless, so a failed delete here (leaving one stale duplicate)
          # must not abort the whole run.
          delete_policy() {
            local app_id="$1" pol_id="$2"
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies/$pol_id" \
              -H "Authorization: Bearer $CF_TOKEN")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::warning::CF API DELETE policy $pol_id on app $app_id failed (HTTP $status), continuing"
              return 0
            fi
            echo "  Deleted old policy: $pol_id"
          }

          refresh_policies() {
            local app_id="$1"
            curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
              -H "Authorization: Bearer $CF_TOKEN" | \
            jq -r '.result[] | select(.decision != "bypass") | .id // empty' | \
            while read -r pol_id; do
              [ -z "$pol_id" ] && continue
              delete_policy "$app_id" "$pol_id"
            done
          }

          refresh_bypass_policies() {
            local app_id="$1"
            curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
              -H "Authorization: Bearer $CF_TOKEN" | \
            jq -r '.result[] | .id // empty' | \
            while read -r pol_id; do
              [ -z "$pol_id" ] && continue
              delete_policy "$app_id" "$pol_id"
            done
          }

          # upsert_full_access: human owner (Workspace domain + personal OTP) + agents (service token)
          # aud_workers: space-separated Worker names to receive CLOUDFLARE_ACCESS_AUDIENCE.
          # Existing apps keep the same AUD, but we still push it to Workers so a
          # recreated or repaired app cannot drift from gs-api's configured audience.
          upsert_full_access() {
            local name="$1" domain="$2" extra_domains="${3:-[]}" aud_workers="${4:-}" expected_aud="${5:-}"
            AID=$(find_app "$name" "$domain" "$expected_aud")
            if [ -n "$AID" ]; then
              echo "Found existing app [$name]: $AID — updating domains, refreshing policies, and syncing AUD"
              update_app "$AID" "$name" "$domain" "$extra_domains"
              refresh_policies "$AID"
              add_policy "$AID" "Goldshore agents" "non_identity" "$SERVICE_INCLUDE"
              add_policy "$AID" "Owner access"     "allow"        "$OWNER_INCLUDE"
              sync_aud_workers "$(get_app_aud "$AID")" "$aud_workers"
            elif [ "$SKIP_NEW_APPS" = "true" ]; then
              echo "::error::No existing [$name] Access app and skip_apps=true; refusing to propagate a service token that no policy trusts."
              MISSING_REQUIRED_APPS=1
            else
              APP_JSON=$(make_app_json "$name" "$domain" "$extra_domains")
              AID=$(echo "$APP_JSON" | jq -r '.result.id // empty')
              AUD=$(echo "$APP_JSON" | jq -r '.result.aud // empty')
              [ -z "$AID" ] && { echo "WARNING: failed to create $name"; return; }
              echo "Created app [$name]: $AID  AUD: ${AUD:-(none)}"
              add_policy "$AID" "Goldshore agents" "non_identity" "$SERVICE_INCLUDE"
              add_policy "$AID" "Owner access"     "allow"        "$OWNER_INCLUDE"
              sync_aud_workers "$AUD" "$aud_workers"
            fi
          }

          assert_full_access_policies() {
            local app_name="$1" domain="$2" expected_aud="${3:-}"
            local app_id policies
            app_id=$(find_app "$app_name" "$domain" "$expected_aud")
            if [ -z "$app_id" ]; then
              echo "::error::Cannot verify Access policies for [$app_name]; app was not found."
              MISSING_REQUIRED_APPS=1
              return
            fi
            policies=$(curl -sf "$CF_API/accounts/$CF_ACCOUNT/access/apps/$app_id/policies" \
              -H "Authorization: Bearer $CF_TOKEN")
            echo "$policies" | jq -e '.result[] | select(.decision == "allow" and .name == "Owner access")' > /dev/null || {
              echo "::error::[$app_name] is missing the Owner access allow policy required for browser Cloudflare Access sessions."
              MISSING_REQUIRED_APPS=1
            }
            echo "$policies" | jq -e '.result[] | select(.decision == "non_identity" and .name == "Goldshore agents")' > /dev/null || {
              echo "::error::[$app_name] is missing the Goldshore agents service-token policy required for machine access."
              MISSING_REQUIRED_APPS=1
            }
          }

          # upsert_bypass_app: creates a path-scoped Access app with a bypass-everyone policy.
          # Used for public paths that must not hit the Access login wall.
          # CF Access resolves the more-specific path-scoped app before the broader allow app.
          upsert_bypass_app() {
            local name="$1" domain="$2" extra_domains="${3:-[]}" aliases="${4:-[]}"
            AID=$(find_app "$name" "$aliases")
            if [ -n "$AID" ]; then
              echo "Found existing bypass app [$name]: $AID — updating domains and bypass policy"
              update_app "$AID" "$name" "$domain" "$extra_domains"
              refresh_bypass_policies "$AID"
              add_bypass_policy "$AID"
            elif [ "$SKIP_NEW_APPS" = "true" ]; then
              echo "::error::No existing bypass app [$name] and skip_apps=true; refusing to leave public probes/callbacks unconfigured."
              MISSING_REQUIRED_APPS=1
            else
              APP_JSON=$(make_app_json "$name" "$domain" "$extra_domains")
              AID=$(echo "$APP_JSON" | jq -r '.result.id // empty')
              [ -z "$AID" ] && { echo "WARNING: failed to create bypass app $name"; return; }
              echo "Created bypass app [$name]: $AID"
              add_bypass_policy "$AID"
            fi
          }

          # upsert_ssh_app: browser-rendered SSH app (type "ssh"). Owner-only,
          # short session, hidden from the App Launcher. Has its own JSON body
          # because update_app/make_app_json hardcode type "self_hosted" and
          # must never PUT over a non-self_hosted app (that would rewrite its type).
          # The app alone does nothing until a cloudflared tunnel publishes the
          # hostname with an SSH origin.
          upsert_ssh_app() {
            local name="$1" domain="$2"
            local body
            body=$(jq -nc --arg n "$name" --arg d "$domain" \
              '{name:$n,type:"ssh",domain:$d,
                self_hosted_domains:[$d],
                session_duration:"4h",
                skip_interstitial:true,
                app_launcher_visible:false,
                http_only_cookie_attribute:true,
                auto_redirect_to_identity:false}')
            AID=$(find_app "$name")
            if [ -n "$AID" ]; then
              echo "Found existing SSH app [$name]: $AID — updating and refreshing policies"
              echo "$body" | curl -sf -X PUT \
                "$CF_API/accounts/$CF_ACCOUNT/access/apps/$AID" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '"  updated ssh app => \(.success)"'
              refresh_policies "$AID"
            elif [ "$SKIP_NEW_APPS" = "true" ]; then
              echo "INFO: No existing [$name] app and skip_apps=true — skipped."
              return
            else
              AID=$(echo "$body" | curl -sf -X POST \
                "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '.result.id // empty')
              [ -z "$AID" ] && { echo "WARNING: failed to create ssh app $name"; return; }
              echo "Created SSH app [$name]: $AID"
            fi
            add_policy "$AID" "Owner access" "allow" "$OWNER_INCLUDE"
          }

          # upsert_mcp_portal: MCP Server Portal app (type "mcp_portal") on the
          # given hostname. Gated behind include_mcp_portal because it targets
          # the same hostname as the self_hosted "GoldShore MCP" app — enable it
          # only if you actually use the Cloudflare MCP Server Portal product,
          # and remove/re-scope the self_hosted app first to avoid two apps
          # competing for one host.
          upsert_mcp_portal() {
            local name="$1" domain="$2"
            local body
            body=$(jq -nc --arg n "$name" --arg d "$domain" \
              '{name:$n,type:"mcp_portal",domain:$d,
                self_hosted_domains:[$d],
                session_duration:"24h",
                http_only_cookie_attribute:true,
                auto_redirect_to_identity:false}')
            AID=$(find_app "$name")
            if [ -n "$AID" ]; then
              echo "Found existing MCP portal app [$name]: $AID — updating and refreshing policies"
              echo "$body" | curl -sf -X PUT \
                "$CF_API/accounts/$CF_ACCOUNT/access/apps/$AID" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '"  updated mcp_portal app => \(.success)"'
              refresh_policies "$AID"
            elif [ "$SKIP_NEW_APPS" = "true" ]; then
              echo "INFO: No existing [$name] app and skip_apps=true — skipped."
              return
            else
              AID=$(echo "$body" | curl -sf -X POST \
                "$CF_API/accounts/$CF_ACCOUNT/access/apps" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '.result.id // empty')
              [ -z "$AID" ] && { echo "WARNING: failed to create mcp_portal app $name"; return; }
              echo "Created MCP portal app [$name]: $AID"
            fi
            add_policy "$AID" "Goldshore agents" "non_identity" "$SERVICE_INCLUDE"
            add_policy "$AID" "Owner access"     "allow"        "$OWNER_INCLUDE"
          }

          # ------------------------------------------------------------------
          # Bypass apps first — path-specific rules get higher CF Access priority
          # than the broader allow apps that cover the same hostnames.
          # ------------------------------------------------------------------

          # Trading OAuth: only the broker redirect-target callbacks bypass Access.
          # /oauth/schwab/authorize and /oauth/robinhood/token remain behind Access
          # (operator-only broker auth initiation paths per routes/oauth.ts).
          upsert_bypass_app "GoldShore Trading - Schwab Callback" \
            "trading.goldshore.ai/oauth/schwab/callback" \
            '["dashboard.goldshore.ai/oauth/schwab/callback","dash.goldshore.ai/oauth/schwab/callback"]'

          upsert_bypass_app "GoldShore Trading - Robinhood Callback" \
            "trading.goldshore.ai/oauth/robinhood/callback" \
            '["dashboard.goldshore.ai/oauth/robinhood/callback","dash.goldshore.ai/oauth/robinhood/callback"]'

          # API: /, /health, /status, /version must be reachable by monitoring.
          upsert_bypass_app "Goldshore API - Public Probes" \
            "api.goldshore.ai" \
            '["api.goldshore.ai/health*","api.goldshore.ai/status","api.goldshore.ai/version","api.goldshore.ai/version.json"]'

          # Public websites submit contact, intake, and newsletter forms through
          # this path. gs-api independently limits unauthenticated requests to
          # POST /v1/forms/:formId/submissions; configs and lead-management
          # endpoints remain protected by application authentication.
          upsert_bypass_app "Goldshore API - Public Forms" \
            "api.goldshore.ai/v1/forms/*" \
            '[]'

          # Gateway: /health, /status, /version must be reachable by monitoring
          upsert_bypass_app "Goldshore Gateway - Public Probes" \
            "gw.goldshore.ai/health" \
            '["gw.goldshore.ai/status","gw.goldshore.ai/version"]'

          # ------------------------------------------------------------------
          # Human + agent access apps (all per infra/INFRASTRUCTURE.md Gates 5a-5e
          # and docs/domains-and-auth.md; app names match CF dashboard)
          # ------------------------------------------------------------------

          upsert_full_access "Dashboard"       "goldshore.ai/app"
          # GoldShore Admin: .ai canonical + .org alias + admin-preview (Gate 5a)
          # + admin.gs-admin.pages.dev (Pages custom preview host)
          upsert_full_access "GoldShore Admin"   "admin.goldshore.ai" \
            '["admin.goldshore.org","admin-preview.goldshore.ai","admin.gs-admin.pages.dev"]'
          # GoldShore Trading: canonical + dashboard/dash aliases (Gate 5b)
          upsert_full_access "GoldShore-Trading-ZT" "trading.goldshore.ai" \
            '["dashboard.goldshore.ai","dash.goldshore.ai"]' "" \
            '["GoldShore Trading","Goldshore Trading","Trading"]'
          # Goldshore Ops: ops.goldshore.ai (Gate 5c)
          upsert_full_access "Goldshore Ops"     "ops.goldshore.ai"
          # Signals: .ai canonical + .org alias + workers.dev default host
          upsert_full_access "Signals"           "signals.goldshore.ai" \
            '["signals.goldshore.org","gs-signals-prod.goldshore.workers.dev"]'
          # Goldshore API: uses documented name and pinned AUD to match the
          # existing Access app/AUD in wrangler.toml before rotating tokens;
          # pushes AUD to the canonical API workers on first-run creation (Gate 5e). Keep this
          # host on upsert_full_access (owner/user allow + service-token policy)
          # because browser-based admin routes call api.goldshore.ai with
          # credentials: 'include' and need a human Cloudflare Access session.
          # Service-token-only access is limited to machine-only/path-scoped apps.
          # Keep this app on the full api.goldshore.ai host and list every
          # protected route family served by gs-api so Access issues one AUD for
          # browser calls to /goldclaw, /admin, /users, /ai, /v1, etc. The public
          # probes above remain path-scoped bypass apps.
          API_PROTECTED_DOMAINS='["api.goldshore.ai/goldclaw","api.goldshore.ai/admin","api.goldshore.ai/users","api.goldshore.ai/ai","api.goldshore.ai/v1"]'
          upsert_full_access "Goldshore API"     "api.goldshore.ai" "$API_PROTECTED_DOMAINS" \
            "gs-api gs-api-prod" "$GS_API_ACCESS_AUD"
          assert_full_access_policies "Goldshore API" "api.goldshore.ai" "$GS_API_ACCESS_AUD"
          # Bare "api.goldshore.ai" dropped as its own destination: with the
          # 5 protected paths that's 6 destinations, over Cloudflare's 5-per-app
          # cap (access.api.error.invalid_request: too many destinations for one
          # app). The 5 specific paths are the authoritative protected surface;
          # the bare host was redundant with them, not additive coverage.
          API_PROTECTED_DOMAINS='["api.goldshore.ai/admin","api.goldshore.ai/users","api.goldshore.ai/ai","api.goldshore.ai/v1"]'
          # aud_workers lists only "gs-api-prod" because live
          # api.goldshore.ai traffic is routed there from this monorepo. Bare
          # "gs-api" is intentionally reserved for the marzton/goldshore-api
          # rebuild Worker and should be managed by that repository's deploy
          # flow, not this monorepo Access sync.
          upsert_full_access "Goldshore API"     "api.goldshore.ai/goldclaw" "$API_PROTECTED_DOMAINS" \
            "gs-api-prod" "$GS_API_ACCESS_AUD"
          assert_full_access_policies "Goldshore API" "api.goldshore.ai/goldclaw" "$GS_API_ACCESS_AUD"
          # Goldshore API: uses documented name to match existing AUD in wrangler.toml;
          # pushes AUD to api workers on first-run creation (Gate 5e). This must
          # remain a full-access app (Owner access + Goldshore agents policies),
          # not a service-token-only app: browser admin routes such as
          # /admin/goldclaw call api.goldshore.ai with credentials: 'include'
          # and gs-api expects Cloudflare Access user claims on protected routes.
          # Keep service-token-only Access limited to machine-only/path-scoped apps.
          upsert_full_access "Goldshore API"     "api.goldshore.ai" "[]" \
            "gs-api gs-api-prod"
          assert_full_access_policies "Goldshore API" "api.goldshore.ai"
          # aud_workers lists only "gs-api-prod": the account has no Worker
          # script literally named "gs-api" (confirmed via workers list --
          # apps/gs-api/wrangler.toml only ever deploys via --env prod/preview,
          # producing gs-api-prod; a bare "gs-api" was never actually deployed
          # and 404s on PUT /workers/scripts/gs-api/secrets).
          upsert_full_access "Goldshore API"     "api.goldshore.ai/goldclaw" "$API_PROTECTED_DOMAINS" \
            "gs-api-prod" "$GS_API_ACCESS_AUD"
          assert_full_access_policies "Goldshore API" "api.goldshore.ai/goldclaw" "$GS_API_ACCESS_AUD"
          # GoldShore MCP: human + agent per docs ("approved human identities and agents")
          upsert_full_access "GoldShore MCP"     "mcp.goldshore.ai" "[]" \
            "" \
            '["MCP"]'
          # Goldshore Gateway: gw + agent share app+AUD (Gate 5d); human + agent access
          upsert_full_access "Goldshore Gateway" "gw.goldshore.ai" \
            '["gateway.goldshore.ai","agent.goldshore.ai"]'
          # GoldShore-Web-Preview: preview.goldshore.ai (INFRASTRUCTURE.md Gate 5)
          upsert_full_access "GoldShore-Web-Preview" "preview.goldshore.ai"

          if [ "$MISSING_REQUIRED_APPS" -ne 0 ]; then
            echo "::error::One or more required Access apps were missing while skip_apps=true. Policies were not updated for those apps, so new credentials were not propagated."
            exit 1
          fi

          # ------------------------------------------------------------------
          # Gated apps (workflow_dispatch inputs)
          # ------------------------------------------------------------------

          # Browser SSH to the HP laptop; requires a cloudflared tunnel on the
          # laptop publishing ssh-laptop.goldshore.ai with an SSH origin.
          if [ "$INCLUDE_SSH_LAPTOP" = "true" ]; then
            upsert_ssh_app "Temp HP Laptop SSH" "ssh-laptop.goldshore.ai"
          else
            echo "INFO: include_ssh_laptop=false — skipping Temp HP Laptop SSH app."
          fi

          # MCP Server Portal — off by default; see upsert_mcp_portal comments.
          if [ "$INCLUDE_MCP_PORTAL" = "true" ]; then
            upsert_mcp_portal "Goldshore MCP Portal" "mcp.goldshore.ai"
          else
            echo "INFO: include_mcp_portal=false — skipping mcp_portal app (self_hosted GoldShore MCP covers mcp.goldshore.ai)."
          fi

      # ------------------------------------------------------------------ #
      # 4. Propagate CF_ACCESS_CLIENT_ID / SECRET to all repos
      # ------------------------------------------------------------------ #
      - name: Set CF_ACCESS secrets in all repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLIENT_ID:  ${{ steps.token.outputs.client_id }}
          CLIENT_SEC: ${{ steps.token.outputs.client_secret }}
        run: |
          set -euo pipefail
          for REPO in \
            marzton/goldshore-ai \
            marzton/goldshore-gateway \
            marzton/goldshore \
            marzton/goldshore-ops \
            marzton/goldshore-org \
            marzton/goldshore-api \
            marzton/goldshore-admin \
            marzton/goldshore-web \
            marzton/risk-radar \
            marzton/banproof-me \
            marzton/goldclaw; do
            gh secret set CF_ACCESS_CLIENT_ID     --body "$CLIENT_ID"  --repo "$REPO"
            gh secret set CF_ACCESS_CLIENT_SECRET --body "$CLIENT_SEC" --repo "$REPO"
            echo "Secrets set: $REPO"
          done

      # ------------------------------------------------------------------ #
      # 5. Push CF_ACCESS_CLIENT_ID / SECRET into Worker secrets
      # ------------------------------------------------------------------ #
      - name: Push CF_ACCESS secrets into Worker secrets
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLIENT_ID:  ${{ steps.token.outputs.client_id }}
          CLIENT_SEC: ${{ steps.token.outputs.client_secret }}
        run: |
          set -euo pipefail
          put_secret() {
            local worker="$1" key="$2" val="$3"
            local resp status body
            resp=$(curl -sS -w '\n%{http_code}' -X PUT \
              "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$worker/secrets" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$key\",\"text\":\"$val\",\"type\":\"secret_text\"}")
            status="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::warning::CF API PUT /workers/scripts/$worker/secrets failed for key=[$key] (HTTP $status), continuing: $body"
              return 0
            fi
            echo "$body" | jq -r '"  \(.result.name // "?") => \(.success)"'
          }
          # Only the monorepo-owned production Worker is updated here. Bare
          # gs-api is intentionally reserved for marzton/goldshore-api rebuilds.
          # No Worker script literally named "gs-api" exists in the account --
          # apps/gs-api/wrangler.toml only deploys via --env prod/preview,
          # producing gs-api-prod. See the matching fix on the AUD sync above.
          for WORKER in gs-api-prod; do
            echo "Setting secrets on $WORKER:"
            put_secret "$WORKER" CF_ACCESS_CLIENT_ID     "$CLIENT_ID"
            put_secret "$WORKER" CF_ACCESS_CLIENT_SECRET "$CLIENT_SEC"
          done

      # ------------------------------------------------------------------ #
      # 6. Summary
      # ------------------------------------------------------------------ #
      - name: Write job summary
        if: always()
        env:
          CLIENT_ID:   ${{ steps.token.outputs.client_id }}
          TOKEN_UUID:  ${{ steps.token.outputs.token_uuid }}
        run: |
          {
            echo "## CF Agent Access Setup"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Service token UUID | \`$TOKEN_UUID\` |"
            echo "| CF-Access-Client-Id | \`$CLIENT_ID\` |"
            echo "| GitHub secrets | goldshore-ai, goldshore-gateway, goldclaw |"
            echo "| Worker secrets | gs-api-prod (bare gs-api is owned by marzton/goldshore-api) |"
            echo "| Bypass apps | Schwab Callback, Robinhood Callback, API Probes, Gateway Probes |"
            echo "| Full-access apps | Dashboard, GoldShore Admin, GoldShore Trading, Goldshore Ops, Signals, Goldshore API, GoldShore MCP, Goldshore Gateway, GoldShore-Web-Preview |"
            echo "| Extra hostnames | signals.goldshore.org + gs-signals-prod.goldshore.workers.dev (Signals), gs-api.goldshore.workers.dev (API) |"
            echo "| Gated apps | Temp HP Laptop SSH (include_ssh_laptop=${{ inputs.include_ssh_laptop }}), Goldshore MCP Portal (include_mcp_portal=${{ inputs.include_mcp_portal }}) |"
            echo ""
            echo "> CF-Access-Client-Secret is stored in secrets only — never printed here."
          } >> "$GITHUB_STEP_SUMMARY"
