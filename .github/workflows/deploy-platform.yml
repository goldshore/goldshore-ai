name: Deploy Cloudflare apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Canonical app to deploy (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gs-web
          - gs-admin
          - gs-api
      environment:
        description: "Cloudflare environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - preview

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}

# Manual canonical deploy dispatcher. Normal pushes are handled by the
# app-specific deploy workflows; this avoids duplicate deploys and Cloudflare
# API rate-limit spikes.

jobs:

  # ── gs-web (Worker + Assets) ────────────────────────────────────────────────────
  deploy-web:
    name: Deploy gs-web (Worker)
    if: >
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'gs-web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-web build
      - name: Deploy gs-web Worker
        working-directory: apps/gs-web
        run: |
          ENV=${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
          pnpm exec wrangler deploy --env $ENV

  # ── gs-admin (Cloudflare Pages) ───────────────────────────────────────────────
  deploy-admin:
    name: Deploy gs-admin (Pages)
    if: >
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'gs-admin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-admin build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-admin/dist --project-name=gs-admin --branch=${{ github.ref_name }}

  # ── Canonical Worker ─────────────────────────────────────────────────────────
  deploy-workers:
    name: Deploy ${{ matrix.app }}
    if: >
      inputs.target == 'all' ||
      inputs.target == 'gs-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false   # one broken worker does not cancel the others
      matrix:
        include:
          - app: gs-api
            filter: "@goldshore/gs-api"
    steps:
      - name: Skip if not targeted
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'all' && inputs.target != matrix.app
        run: echo "Skipping ${{ matrix.app }} (target=${{ inputs.target }})" && exit 0
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
      - uses: pnpm/action-setup@v6
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        run: pnpm --filter ${{ matrix.filter }} build
      - name: Deploy ${{ matrix.app }}
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        working-directory: apps/gs-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_GS_CONTROL }}
        run: |
          ENV=${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
          pnpm exec wrangler deploy --env $ENV
      - name: Health check ${{ matrix.app }}
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.app
        run: |
          # Wait for worker to be available
          sleep 3
          # Check worker health endpoint based on app
          case "${{ matrix.app }}" in
            gs-web)
              HEALTH_URL="https://goldshore.ai/health"
              ;;
            gs-api)
              HEALTH_URL="https://api.goldshore.ai/health"
              ;;
            gs-gateway)
              HEALTH_URL="https://gw.goldshore.ai/health"
              ;;
            gs-control)
              HEALTH_URL="https://ops.goldshore.ai/health"
              ;;
            gs-mail)
              HEALTH_URL="https://mail.goldshore.ai/health"
              ;;
            armsway-com)
              HEALTH_URL="https://armsway.com/health"
              ;;
            *)
              echo "Skipping health check for ${{ matrix.app }}"
              exit 0
              ;;
          esac

          # Retry health check up to 5 times
          for i in {1..5}; do
            echo "Health check attempt $i..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ ${{ matrix.app }} is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            if [ $i -lt 5 ]; then
              echo "  Got HTTP $HTTP_CODE, retrying in 2s..."
              sleep 2
            fi
          done

          echo "✗ ${{ matrix.app }} health check failed (last HTTP $HTTP_CODE)"
          exit 1
