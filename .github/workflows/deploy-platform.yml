name: Deploy — GoldShore Platform

# Triggered on push to main OR manually from GitHub Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_stubs_delete:
        description: 'Skip deleting stub workers (goldshore-ai, gs-dynamic-worker)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy gs-platform (gateway) with fixed auth
  # ─────────────────────────────────────────────
  deploy-gateway:
    name: Deploy gs-platform (gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gs-gateway
        run: pnpm --filter @goldshore/gs-gateway build
        # Adjust filter if package name differs: check apps/gs-gateway/package.json "name" field

      - name: Deploy to Cloudflare (as gs-platform)
        run: wrangler deploy --config apps/gs-gateway/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─────────────────────────────────────────────
  # Job 2: Deploy gs-api
  # ─────────────────────────────────────────────
  deploy-api:
    name: Deploy gs-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-api build
      - run: wrangler deploy --config apps/gs-api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─────────────────────────────────────────────
  # Job 3: Deploy gs-web (Astro) to Pages
  # Runs AFTER gateway so auth is fixed first
  # ─────────────────────────────────────────────
  deploy-web:
    name: Deploy gs-web (Astro Pages)
    runs-on: ubuntu-latest
    needs: [deploy-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build gs-web
        run: pnpm --filter @goldshore/gs-web build
        # If app directory is apps/web and package name is @goldshore/web, change above to:
        # pnpm --filter @goldshore/web build

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/gs-web/dist --project-name gs-web
        # If app is at apps/web, change to: apps/web/dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─────────────────────────────────────────────
  # Job 4: Delete stub workers
  # Runs after gs-web is live (goldshore-ai is safe to remove)
  # ─────────────────────────────────────────────
  delete-stubs:
    name: Delete stub workers
    runs-on: ubuntu-latest
    needs: [deploy-web]
    if: ${{ github.event.inputs.skip_stubs_delete != 'true' }}
    steps:
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Delete gs-dynamic-worker (unknown stub)
        run: |
          wrangler delete --name gs-dynamic-worker --force || echo "gs-dynamic-worker already gone"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete goldshore-ai stub (replaced by gs-web)
        run: |
          wrangler delete --name goldshore-ai --force || echo "goldshore-ai already gone"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
