name: Deploy — GoldShore Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gs-agent deploys first — gs-api has a service binding to it
  deploy-agent:
    name: Deploy gs-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-agent build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-agent/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # gs-api deploys after agent — has AGENT service binding
  deploy-api:
    name: Deploy gs-api
    runs-on: ubuntu-latest
    needs: [deploy-agent]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-api build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-api/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Gateway deploys after api (has API_SERVICE binding)
  deploy-gateway:
    name: Deploy gs-platform (gateway)
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build gs-gateway
        run: pnpm --filter @goldshore/gs-gateway build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-gateway/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-agent:
    name: Deploy gs-agent
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-agent build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-agent/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-control:
    name: Deploy gs-control
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-control build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-control/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-trading:
    name: Deploy gs-trading
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-trading build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-trading/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-mail:
    name: Deploy gs-mail
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-mail build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config apps/gs-mail/wrangler.toml --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy gs-web (Pages)
    runs-on: ubuntu-latest
    needs: [deploy-gateway]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-web build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-web/dist --project-name gs-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: Deploy gs-admin (Pages)
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goldshore/gs-admin build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/gs-admin/dist --project-name gs-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_BUILDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
