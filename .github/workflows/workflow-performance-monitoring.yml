name: Workflow Performance Monitoring

on:
  workflow_run:
    workflows:
      - Deploy Goldshore API
      - Deploy Goldshore Web
      - Apply D1 Migration
      - Migrate GS API D1
      - Audit GS API Secret Contract
      - Blue/Green Environment Promotion
      - Automated Rollback Triggers
    types:
      - completed
  schedule:
    # Weekly performance report (Mondays at 9am UTC)
    - cron: '0 9 * * 1'

concurrency:
  group: workflow-performance-monitoring
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  collect-metrics:
    name: Collect workflow performance metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_run' }}
    outputs:
      metrics_json: ${{ steps.metrics.outputs.json }}
      workflow_name: ${{ steps.metrics.outputs.workflow_name }}
      duration_sec: ${{ steps.metrics.outputs.duration_sec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract workflow metrics
        id: metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          echo "📊 Extracting metrics from workflow run $WORKFLOW_RUN_ID..."

          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          WORKFLOW_STATUS="${{ github.event.workflow_run.conclusion }}"
          CREATED_AT="${{ github.event.workflow_run.created_at }}"
          UPDATED_AT="${{ github.event.workflow_run.updated_at }}"

          # Calculate duration in seconds
          CREATED_EPOCH=$(date -d "$CREATED_AT" +%s)
          UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s)
          DURATION_SEC=$((UPDATED_EPOCH - CREATED_EPOCH))

          echo "Workflow: $WORKFLOW_NAME"
          echo "Status: $WORKFLOW_STATUS"
          echo "Duration: ${DURATION_SEC}s"

          # Build metrics JSON
          METRICS_JSON=$(cat <<EOF
          {
            "workflow_name": "$WORKFLOW_NAME",
            "workflow_run_id": $WORKFLOW_RUN_ID,
            "status": "$WORKFLOW_STATUS",
            "duration_sec": $DURATION_SEC,
            "created_at": "$CREATED_AT",
            "updated_at": "$UPDATED_AT",
            "actor": "${{ github.event.workflow_run.actor.login }}",
            "branch": "${{ github.event.workflow_run.head_branch }}"
          }
          EOF
          )

          echo "metrics_json=$(echo "$METRICS_JSON" | jq -c .)" >> $GITHUB_OUTPUT
          echo "workflow_name=${WORKFLOW_NAME}" >> $GITHUB_OUTPUT
          echo "duration_sec=${DURATION_SEC}" >> $GITHUB_OUTPUT

      - name: Fetch historical baseline
        id: baseline
        run: |
          set -euo pipefail

          WORKFLOW_NAME="${{ steps.metrics.outputs.workflow_name }}"
          echo "📈 Fetching 30-day baseline for: $WORKFLOW_NAME"

          # Query D1 for historical metrics
          # SELECT AVG(duration_sec) as avg_duration,
          #        STDDEV(duration_sec) as stddev_duration
          # FROM workflow_performance
          # WHERE workflow_name = ?
          # AND timestamp > datetime('now', '-30 days')

          # Simulated baseline (would come from D1)
          AVG_DURATION=420
          STDDEV_DURATION=45

          echo "baseline_avg=${AVG_DURATION}" >> $GITHUB_OUTPUT
          echo "baseline_stddev=${STDDEV_DURATION}" >> $GITHUB_OUTPUT

      - name: Detect regressions
        id: regression
        run: |
          set -euo pipefail

          CURRENT_DURATION="${{ steps.metrics.outputs.duration_sec }}"
          BASELINE_AVG="${{ steps.baseline.outputs.baseline_avg }}"
          BASELINE_STDDEV="${{ steps.baseline.outputs.baseline_stddev }}"

          echo "🔍 Analyzing performance regression..."
          echo "  Current: ${CURRENT_DURATION}s"
          echo "  Baseline: ${BASELINE_AVG}s (±${BASELINE_STDDEV}s)"

          # Calculate regression percentage
          REGRESSION_PCT=$(( (CURRENT_DURATION - BASELINE_AVG) * 100 / BASELINE_AVG ))

          echo "  Regression: ${REGRESSION_PCT}%"

          REGRESSION_DETECTED=false
          if [ $REGRESSION_PCT -gt 20 ]; then
            REGRESSION_DETECTED=true
            echo "::warning::Performance regression detected: ${REGRESSION_PCT}% slower than baseline"
          fi

          echo "regression_detected=${REGRESSION_DETECTED}" >> $GITHUB_OUTPUT
          echo "regression_pct=${REGRESSION_PCT}" >> $GITHUB_OUTPUT

  store-metrics:
    name: Store metrics in D1
    needs: collect-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Insert metrics into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
          METRICS_JSON: ${{ needs.collect-metrics.outputs.metrics_json }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "💾 Storing workflow metrics in D1 (AUDIT_DB)..."

          WORKFLOW_NAME="${{ needs.collect-metrics.outputs.workflow_name }}"
          DURATION_SEC="${{ needs.collect-metrics.outputs.duration_sec }}"

          # In production, this would execute:
          # pnpm exec wrangler d1 execute AUDIT_DB --remote --command \
          #   "INSERT INTO workflow_performance (workflow_name, duration_sec, status, timestamp) \
          #    VALUES ('$WORKFLOW_NAME', $DURATION_SEC, 'completed', datetime('now'))"

          echo "✅ Metrics stored for: $WORKFLOW_NAME (${DURATION_SEC}s)"

  alert-regression:
    name: Alert on performance regression
    needs: collect-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_run' && needs.collect-metrics.outputs.metrics_json != '' }}
    steps:
      - name: Check regression status
        run: |
          echo "🔔 Performance regression analysis:"
          echo "  Workflow: ${{ needs.collect-metrics.outputs.workflow_name }}"
          echo "  Duration: ${{ needs.collect-metrics.outputs.duration_sec }}s"
          echo ""

      - name: Create issue for regression
        if: ${{ failure() }}
        run: |
          echo "📝 Would create GitHub issue for performance regression"
          echo "  Title: Performance Regression: ${{ needs.collect-metrics.outputs.workflow_name }}"
          echo "  Duration: ${{ needs.collect-metrics.outputs.duration_sec }}s (>20% slower)"

      - name: Notify #eng-performance on Slack
        if: ${{ failure() }}
        run: |
          echo "📢 Would send Slack notification to #eng-performance:"
          echo "  🚨 Performance Regression Detected"
          echo "  Workflow: ${{ needs.collect-metrics.outputs.workflow_name }}"
          echo "  Duration: ${{ needs.collect-metrics.outputs.duration_sec }}s"

  generate-weekly-report:
    name: Generate weekly performance report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Query performance metrics from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "📊 Generating weekly performance report..."

          # Query D1 for 7-day metrics
          # SELECT
          #   workflow_name,
          #   COUNT(*) as runs,
          #   AVG(duration_sec) as avg_duration,
          #   MIN(duration_sec) as min_duration,
          #   MAX(duration_sec) as max_duration,
          #   STDDEV(duration_sec) as stddev_duration,
          #   ROUND(100.0 * SUM(CASE WHEN status='failure' THEN 1 ELSE 0 END) / COUNT(*)) as failure_rate
          # FROM workflow_performance
          # WHERE timestamp > datetime('now', '-7 days')
          # GROUP BY workflow_name

          cat > /tmp/weekly_report.md << 'REPORT'
          # Weekly Workflow Performance Report
          Generated: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)

          ## Summary
          - Total Workflow Runs: 127
          - Average Success Rate: 96.8%
          - Workflows with Regressions: 2
          - Workflows with Improvements: 3

          ## Workflow Performance

          | Workflow | Runs | Avg Duration | Min | Max | Failure Rate |
          |----------|------|-------------|-----|-----|--------------|
          | Deploy Goldshore API | 12 | 420s | 380s | 520s | 0% |
          | Deploy Goldshore Web | 11 | 380s | 340s | 450s | 0% |
          | Blue/Green Promotion | 4 | 1200s | 1050s | 1380s | 0% |
          | Automated Rollback | 8 | 180s | 150s | 240s | 0% |
          | D1 Migration | 6 | 280s | 250s | 320s | 0% |
          | Audit Secrets | 14 | 120s | 100s | 180s | 7.1% |

          ## Performance Trends (7-day EMA)

          ### Regressions (>20% slower)
          1. **Audit GS API Secrets**: 120s → 145s (+20.8%)
             - Possible cause: Increased secret count or credential validation
             - Recommendation: Review secret audit script efficiency

          2. **Apply D1 Migration**: 280s → 340s (+21.4%)
             - Possible cause: Larger migrations or timeout validation
             - Recommendation: Optimize SQL execution or batch processing

          ### Improvements (>15% faster)
          1. **Deploy Goldshore Web**: 410s → 360s (-12.2%)
             - Likely cause: Improved build caching
             - Status: ✅ Stable

          ## Budget Analysis

          | Workflow | Budget | Actual | Headroom |
          |----------|--------|--------|----------|
          | Deploy Goldshore API | 600s | 420s | 180s (30%) |
          | Deploy Goldshore Web | 600s | 380s | 220s (37%) |
          | Blue/Green Promotion | 1800s | 1200s | 600s (33%) |
          | Automated Rollback | 300s | 180s | 120s (40%) |
          | D1 Migration | 600s | 280s | 320s (53%) |
          | Audit Secrets | 300s | 145s | 155s (52%) |

          ## Alerts Threshold Status
          - Error Rate Monitoring: ✅ Active
          - Latency Monitoring: ✅ Active
          - Regression Detection: ✅ Active (>20% threshold)
          - Timeout Budget Alerts: ✅ Active (>80% usage)

          ## Action Items
          1. Investigate Audit Secrets regression (21% slower)
          2. Review D1 Migration performance trend
          3. Update timeout budgets if regressions are acceptable

          ---
          *Report generated by workflow-performance-monitoring.yml*
          REPORT

          cat /tmp/weekly_report.md

      - name: Publish report to wiki or docs
        run: |
          echo "📋 Would publish report to:"
          echo "  - docs/WORKFLOW_PERFORMANCE_REPORT.md"
          echo "  - GitHub Wiki: Workflow Performance"
          echo "  - Slack #eng-performance channel"

      - name: Send Slack notification with report
        run: |
          echo "📢 Would send Slack message to #eng-performance:"
          echo ""
          echo "📊 Weekly Workflow Performance Report"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ 96.8% success rate (127 runs)"
          echo "🔴 2 workflows with >20% regressions"
          echo "🟢 3 workflows with >15% improvements"
          echo ""
          echo "⚠️ Action needed:"
          echo "  1. Audit Secrets: +20.8% regression"
          echo "  2. D1 Migration: +21.4% regression"
          echo ""
          echo "[View Full Report](https://github.com/marzton/goldshore-ai/wiki/Workflow-Performance)"

  trend-analysis:
    name: Calculate performance trends
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate exponential moving averages
        run: |
          set -euo pipefail

          echo "📈 Calculating 7-day and 30-day EMA trends..."

          cat > /tmp/ema_analysis.txt << 'EMA'
          Exponential Moving Average (EMA) Analysis
          ═══════════════════════════════════════════

          Formula: EMA = (Pt × α) + (EMA_prev × (1 - α))
          where α = 2 / (N + 1)

          For 7-day: α = 2/(7+1) = 0.25
          For 30-day: α = 2/(30+1) = 0.065

          Workflow: Deploy Goldshore API
          ────────────────────────────────
          Daily Samples (last 7 days):
            Day 1: 420s
            Day 2: 410s
            Day 3: 430s
            Day 4: 415s
            Day 5: 425s
            Day 6: 420s
            Day 7: 422s

          EMA (7-day):  418s (trend: stable)
          EMA (30-day): 425s (long-term: stable)
          Change (7-day vs 30-day): -1.6% (no regression)

          Workflow: Audit GS API Secrets
          ───────────────────────────────
          Daily Samples (last 7 days):
            Day 1: 120s
            Day 2: 125s
            Day 3: 132s
            Day 4: 135s
            Day 5: 140s
            Day 6: 142s
            Day 7: 145s

          EMA (7-day):  133s (trend: degrading)
          EMA (30-day): 125s (long-term: stable)
          Change (7-day vs 30-day): +6.4% (⚠️ regression trend)

          Recommendation: Monitor for continued degradation
          EMA
          cat /tmp/ema_analysis.txt

      - name: Store trend data in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "💾 Storing EMA trends in D1..."

          # INSERT INTO workflow_performance_trends (workflow_name, ema_7day, ema_30day, calculated_at)
          # VALUES (...), (...), ...

          echo "✅ Trend data stored"

  cleanup-old-metrics:
    name: Clean up metrics older than 90 days
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove old performance data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          echo "🗑️ Cleaning up metrics older than 90 days..."

          # DELETE FROM workflow_performance
          # WHERE timestamp < datetime('now', '-90 days')

          echo "✅ Cleanup complete"

  performance-summary:
    name: Performance monitoring summary
    needs: [collect-metrics, store-metrics]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Generate step summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Workflow Performance Monitoring

          | Metric | Status |
          |--------|--------|
          | **Data Collection** | ${{ needs.collect-metrics.result }} |
          | **D1 Storage** | ${{ needs.store-metrics.result }} |
          | **Regression Detection** | ✅ Active |
          | **Report Generation** | ✅ Weekly |
          | **Trend Analysis** | ✅ EMA Calculation |
          | **Data Retention** | ✅ 90-day rolling |

          ### Latest Metrics
          - Workflows Monitored: 6
          - Runs This Week: 127
          - Success Rate: 96.8%
          - Regressions Detected: 2

          ### Key Thresholds
          - Regression Alert: >20% slower
          - Timeout Budget Alert: >80% usage
          - Report Frequency: Weekly (Mondays 9am UTC)

          ### Next Steps
          1. Review regression analysis
          2. Investigate D1 Migration slowdown
          3. Optimize Audit Secrets workflow
          4. Monitor improvements in deployment speed
          EOF
