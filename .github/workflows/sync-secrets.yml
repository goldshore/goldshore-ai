name: Sync CF KV → GitHub Secrets

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print keys found, do not set secrets)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    name: CF KV → GitHub secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Sync secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          CF_ACCOUNT="f77de112d2019e5456a3198a8bb50bd2"

          # Namespaces to search in priority order
          NAMESPACES=(
            "68f52b467dc0413991b2195ef9081cae"  # GS_CONFIG
            "5f13370575784c9dacff522121104cb3"  # GOLDSHORE-AI
            "25a1eeba1de14e06af18c45b1b2c9743"  # GS_AGENT_KV
            "9cc2209906a94851b704be57543987a9"  # GOLDSHORE-API
          )

          KEYS=(
            OPENAI_API_KEY
            ACLED_API_KEY
            MARKET_DATA_API_KEY
            RESEND_API_KEY
            FORMSPREE_ENDPOINT
          )

          repos_for_key() {
            case "$1" in
              OPENAI_API_KEY)
                printf '%s\n' marzton/goldshore-ai
                ;;
              ACLED_API_KEY|MARKET_DATA_API_KEY)
                printf '%s\n' marzton/goldshore-ai
                ;;
              RESEND_API_KEY|FORMSPREE_ENDPOINT)
                printf '%s\n' marzton/goldshore-ai marzton/goldshore-web
                ;;
              *)
                return 1
                ;;
            esac
          }

          fetch_kv() {
            local ns="$1" key="$2"
            curl -sf \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/${ns}/values/${key}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 2>/dev/null || true
          }

          for KEY in "${KEYS[@]}"; do
            VALUE=""
            for NS in "${NAMESPACES[@]}"; do
              VALUE=$(fetch_kv "$NS" "$KEY")
              [ -n "$VALUE" ] && break
            done

            if [ -z "$VALUE" ]; then
              echo "⚠️  $KEY not found in any CF KV namespace — skipping"
              continue
            fi

            echo "✅ Found $KEY"
            mapfile -t TARGET_REPOS < <(repos_for_key "$KEY")

            if [ "$DRY_RUN" = "true" ]; then
              echo "   (dry run) would set $KEY on ${#TARGET_REPOS[@]} scoped repos"
              continue
            fi

            for REPO in "${TARGET_REPOS[@]}"; do
              gh secret set "$KEY" --repo "$REPO" --body "$VALUE"
              echo "   → $REPO"
            done
          done

          echo ""
          echo "Sync complete."
