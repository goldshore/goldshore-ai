name: Sync Infrastructure Secrets

on:
  schedule:
    - cron: '0 2 * * *'  # daily audit at 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - apply
          - check
      dry_run:
        description: 'For apply mode, print targets without writing'
        required: false
        default: 'true'
        type: boolean
      allow_kv_source:
        description: 'Allow legacy Cloudflare KV fallback values for manifest keys that permit it'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    name: Secret manifest sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run secret sync
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          ALLOW_KV_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_kv_source || false }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CONTROL_SYNC_TOKEN: ${{ secrets.CONTROL_SYNC_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          MAILCHANNELS_SENDER_EMAIL: ${{ secrets.MAILCHANNELS_SENDER_EMAIL }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
        run: |
          set -euo pipefail
          args=("$SYNC_MODE" "--strict")
          if [ "$DRY_RUN" = "true" ]; then
            args+=("--dry-run")
          fi
          if [ "$ALLOW_KV_SOURCE" = "true" ]; then
            args+=("--allow-kv-source")
          fi
          node scripts/sync-secrets.mjs "${args[@]}"
