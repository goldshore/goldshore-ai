name: Discover Cloudflare Resources

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  discover:
    name: Discover CF Access AUDs, Workers, KV, and Pages
    runs-on: ubuntu-latest
    steps:
      - name: Normalize Cloudflare token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_API_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]*([Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]:[[:space:]]*)?([Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+)?//; s/[[:space:]]+$//')"
          token="$(printf '%s' "$token" | tr -d '[:space:]')"
          test -n "$token" || (echo "Missing: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_BUILD_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN"   || (echo "Missing: CLOUDFLARE_BUILD_API_TOKEN" && exit 1)

      - name: Discover CF Access Applications (AUDs)
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  CF ACCESS APPLICATIONS — copy AUD values for wrangler"
          echo "══════════════════════════════════════════════════════════"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          if ! echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "::error::CF API returned null — token may be expired or lacks Access permissions"
            echo "$BODY" | jq -r '.errors[]? | "  \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$BODY" | jq -r '.result[] | "  \(.name)\n    AUD: \(.aud)\n    domain: \(.domain)\n"'

      # Read-only: maps policy UUIDs (as seen in dashboard exports / raw API
      # payloads) back to names and decisions. Non-fatal — the deploy token may
      # lack Access:Read; rerun with CLOUDFLARE_API_TOKEN if this step errors.
      - name: Discover CF Access Policies (reusable + per-app)
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  CF ACCESS POLICIES — name → id → decision"
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "  Reusable (account-level) policies:"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/policies?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "$BODY" | jq -r '.result[] | "    \(.name)\n      id: \(.id)  decision: \(.decision)"'
          else
            echo "    (unavailable — token likely lacks Access:Read)"
            echo "$BODY" | jq -r '.errors[]? | "    \(.code): \(.message)"' || true
          fi
          echo ""
          echo "  Per-app policies:"
          APPS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if echo "$APPS" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "$APPS" | jq -r '.result[] | "\(.id) \(.name)"' | \
            while read -r APP_ID APP_NAME; do
              echo "    [$APP_NAME]"
              curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${APP_ID}/policies" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | \
              jq -r '.result[]? | "      \(.name)\n        id: \(.id)  decision: \(.decision)"'
            done
          else
            echo "    (unavailable — token likely lacks Access:Read)"
          fi

      - name: Discover Workers
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  WORKERS"
          echo "══════════════════════════════════════════════════════════"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "::error::CF API returned null — token may be expired or lacks Workers permissions"
            echo "$BODY" | jq -r '.errors[]? | "  \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$BODY" | jq -r '.result[] | "  \(.id)  (modified: \(.modified_on))"'

      - name: Discover KV Namespaces
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  KV NAMESPACES"
          echo "══════════════════════════════════════════════════════════"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "::error::CF API returned null — token may be expired or lacks KV permissions"
            echo "$BODY" | jq -r '.errors[]? | "  \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$BODY" | jq -r '.result[] | "  \(.title)\n    id: \(.id)\n"'

      - name: Discover D1 Databases
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  D1 DATABASES"
          echo "══════════════════════════════════════════════════════════"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "::error::CF API returned null — token may be expired or lacks D1 permissions"
            echo "$BODY" | jq -r '.errors[]? | "  \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$BODY" | jq -r '.result[] | "  \(.name)\n    id: \(.uuid)\n"'

      - name: Discover Pages Projects
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  PAGES PROJECTS"
          echo "══════════════════════════════════════════════════════════"
          BODY=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! echo "$BODY" | jq -e '.result != null' >/dev/null 2>&1; then
            echo "::error::CF API returned null — token may be expired or lacks Pages permissions"
            echo "$BODY" | jq -r '.errors[]? | "  \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$BODY" | jq -r '.result[] | "  \(.name)\n    subdomain: \(.subdomain)\n    build_command: \(.build_config.build_command // "(not set)")\n    output_dir: \(.build_config.destination_dir // "(not set)")\n"'

      - name: Summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "  NEXT: reconcile against the two-app deployment model"
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "  Active deploy targets in this repo:"
          echo ""
          echo "  - apps/gs-api  -> Cloudflare Worker API"
          echo "  - apps/gs-web  -> Cloudflare Pages frontend"
          echo ""
          echo "  Do not add new deploy workflows for retired apps. Route backend work into"
          echo "  apps/gs-api and frontend/admin work into apps/gs-web."
          echo ""
