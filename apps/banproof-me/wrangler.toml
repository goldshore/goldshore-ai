name = "banproof-me"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[env.prod]
routes = [
  { pattern = "banproof.me/*", zone_name = "banproof.me" },
  { pattern = "www.banproof.me/*", zone_name = "banproof.me" }
]

[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "banproof_platform"
database_id = "TODO_REPLACE_WITH_REAL_BANPROOF_PLATFORM_DB_ID"

[[env.prod.r2_buckets]]
binding = "ASSETS"
bucket_name = "gs-assets"

[[env.prod.kv_namespaces]]
binding = "BANPROOF_KV"
id = "TODO_REPLACE_WITH_REAL_BANPROOF_KV_ID"

[[env.prod.kv_namespaces]]
binding = "GOLDSHORE_KV"
id = "TODO_REPLACE_WITH_REAL_GOLDSHORE_KV_ID"

[[env.prod.r2_buckets]]
binding = "TELEMETRY_STORAGE"
bucket_name = "gs-telemetry-storage"

[[env.prod.d1_databases]]
binding = "GS_PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "TODO_REPLACE_WITH_REAL_GS_PLATFORM_DB_ID"

[[env.prod.d1_databases]]
binding = "GS_AUDIT_DB"
database_name = "gs_audit_db"
database_id = "TODO_REPLACE_WITH_REAL_GS_AUDIT_DB_ID"

[[env.prod.d1_databases]]
binding = "GS_SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "TODO_REPLACE_WITH_REAL_GS_SIGNALS_DB_ID"
