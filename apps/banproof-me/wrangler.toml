# Worker Builds token for this service must be the gs-control build token.
# wrangler.toml for the banproof-me security worker
#
# banproof-me is the GoldShore security / ban-checking layer.
# It is bound as SECURITY in gs-gateway and protects all inbound requests.
#
# The 9 bindings below are required for full platform integration (Phase 2 audit):
#   1. BANPROOF_KV   — real-time ban cache (fast lookups)
#   2. GOLDSHORE_KV  — shared platform KV (feature flags, config)
#   3. BAN_DB        — gs_platform_db  (ban records, user reputation)
#   4. AUDIT_DB      — gs_audit_db     (compliance / audit log)
#   5. SIGNALS_DB    — gs_signals_db   (trading signal association)
#   6. ASSETS        — gs-assets R2 bucket (shared media/assets)
#   7. TELEMETRY     — gs-telemetry-storage R2 (compliance telemetry)
#   8. API_SERVICE   — gs-api service binding (for reputation lookups)
#   9. BAN_EVENTS    — ban-events queue producer (async ban processing)

name = "banproof-me"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[env.prod]
routes = [
  { pattern = "banproof.me", custom_domain = true },
  { pattern = "www.banproof.me", custom_domain = true }
]
vars = { ENV = "production" }

# 1. BANPROOF_CONFIG — ban cache (fast IP / user lookups)
[[env.prod.kv_namespaces]]
binding = "BANPROOF_CONFIG"
id = "714ee6be6df54291a4a4ade053e9f9ae"

# 2. GOLDSHORE_KV — shared platform config / feature flags
[[env.prod.kv_namespaces]]
binding = "GOLDSHORE_KV"
id = "5f13370575784c9dacff522121104cb3"

# 3. PLATFORM_DB — gs_platform_db D1 (ban records, user reputation)
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

# 4. GS_AUDIT_DB — gs_audit_db D1 (compliance audit log)
[[env.prod.d1_databases]]
binding = "GS_AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

# 5. GS_SIGNALS_DB — gs_signals_db D1 (trading signal association for ban context)
[[env.prod.d1_databases]]
binding = "GS_SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

# 6. GS_ASSETS — shared R2 bucket (media / static assets)
[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

# 7. GS_TELEMETRY — R2 bucket for compliance telemetry / transaction logs
[[env.prod.r2_buckets]]
binding = "GS_TELEMETRY"
bucket_name = "gs-telemetry-storage"

# 8. GS_API — gs-api service binding (reputation lookups, user data)
[[env.prod.services]]
binding = "GS_API"
service = "gs-api"
environment = "prod"

# 9b. GS_CONTROL — gs-control service binding (operator plane)
[[env.prod.services]]
binding = "GS_CONTROL"
service = "gs-control"
environment = "prod"

# 9. BAN_EVENTS — queue producer for async ban event processing
[[env.prod.queues.producers]]
binding = "BAN_EVENTS"
queue = "ban-events"

# POA_EVENTS_QUEUE — consumer for proof-of-action events
[[env.prod.queues.consumers]]
queue = "poa-events"
max_batch_size = 10
max_batch_timeout = 5

[env.preview]
vars = { ENV = "preview" }

[[env.preview.kv_namespaces]]
binding = "BANPROOF_CONFIG"
id = "714ee6be6df54291a4a4ade053e9f9ae"

[[env.preview.kv_namespaces]]
binding = "GOLDSHORE_KV"
id = "5f13370575784c9dacff522121104cb3"

[[env.preview.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.preview.d1_databases]]
binding = "GS_AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

[[env.preview.d1_databases]]
binding = "GS_SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

[[env.preview.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

[[env.preview.r2_buckets]]
binding = "GS_TELEMETRY"
bucket_name = "gs-telemetry-storage"

[[env.preview.services]]
binding = "GS_API"
service = "gs-api"
environment = "preview"

[[env.preview.services]]
binding = "GS_CONTROL"
service = "gs-control"
environment = "prod"

[[env.preview.queues.producers]]
binding = "BAN_EVENTS"
queue = "ban-events-preview"
