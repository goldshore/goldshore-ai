# Local-only mock bindings for admin mail, MCP, and API handlers.
# Do not deploy this file as production configuration.
name = "gs-admin-mock"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db_mock"
database_id = "local"
migrations_dir = "../../packages/schema/migrations/d1"

[[r2_buckets]]
binding = "GS_ARTIFACTS"
bucket_name = "gs-artifacts-mock"

[[kv_namespaces]]
binding = "GS_CONFIG"
id = "local"

[vars]
ENV = "mock"
PUBLIC_BRAND_NAME = "Gold Shore Labs"
PUBLIC_ACCESS_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
PUBLIC_PRIMARY_DOMAIN = "goldshore.org"
PUBLIC_MIRROR_DOMAIN = "goldshore.ai"

# Secrets remain Worker/Pages secrets and are never placed in this file or KV:
# OPENAI_API_KEY
# GH_MCP_AGENT_TOKEN
# CF_MCP_AGENT_TOKEN
