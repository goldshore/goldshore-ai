# gs-admin — Cloudflare Pages Functions wrangler config
#
# This file declares bindings for the Pages Functions runtime.
# Secrets (API tokens, sync tokens) are managed via:
#   wrangler pages secret put <KEY> --project-name gs-admin
# or the Cloudflare dashboard → gs-admin → Settings → Environment variables.

name = "gs-admin"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist"

# ── Production bindings ──────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "KV"
id = "d02c0c7951a244a7987e23d8af16b7b2"

[[d1_databases]]
binding = "CONTENT_DB"
database_name = "goldshore"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "gs-assets"

[[services]]
binding = "API_SERVICE"
service = "gs-api"
environment = "prod"

[[services]]
binding = "TRADING_SERVICE"
service = "gs-trading"
environment = "prod"
# Zero-hop service binding to gs-trading worker (Schwab + Robinhood)

[vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "8b6e1890f664c52ad265a240948a1f3315a757e19b4a0fa180ffe952b81a0daf"

# ── Preview bindings ───────────────────────────────────────────────────────────

[env.preview]
pages_build_output_dir = "dist"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "1f71a79b34db4090824954634dbd78c3"

[[env.preview.d1_databases]]
binding = "CONTENT_DB"
database_name = "goldshore_preview"
database_id = "f77de112-d201-4e54-a785-a4583814a6c3"

[[env.preview.r2_buckets]]
binding = "ASSETS"
bucket_name = "gs-assets-preview"

[[env.preview.services]]
binding = "API_SERVICE"
service = "gs-api"
environment = "preview"

[[env.preview.services]]
binding = "TRADING_SERVICE"
service = "gs-trading"
environment = "preview"

[env.preview.vars]
ENV = "preview"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

# ── Secret bindings (set via CLI or dashboard, never committed) ────────────────
# wrangler pages secret put ADMIN_API_KEY --project-name gs-admin
