# Contracted gateway worker for this monorepo.
# Production deployment uses the gs-gateway-prod environment.
name = "gs-gateway"
main = "src/index.ts"
compatibility_date = "2025-03-07"

workers_dev = false

[env.dev]
routes = []

[env.dev.vars]
ENV = "dev"

[[env.dev.queues.producers]]
binding = "CHECKOUT_EVENTS_QUEUE"
queue = "gs-platform-checkout-events-dev"

[[env.dev.queues.producers]]
binding = "CONTACT_EVENTS_QUEUE"
queue = "gs-platform-contact-events-dev"

[env.prod]
# Legacy gateway routes are consolidated into gs-api or external live-state
# cleanup. Keep this repo-managed placeholder route-free to prevent hostname
# ownership collisions. Do not re-add agent.goldshore.ai here without an ADR.
routes = []
# Routes removed: gw.goldshore.ai/* and agent.goldshore.ai/* are now owned by
# gs-api (env.prod) per desired-state.yaml. gs-gateway serves only via
# service bindings from gs-api / gs-control. Keeping routes here while gs-api
# also claims the same patterns causes a Worker route conflict and a failed
# gs-gateway-prod CF Workers Build.
routes = []

[env.prod.vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
# Set CLOUDFLARE_ACCESS_AUDIENCE as a Worker secret in Cloudflare.
# The live AUD tag must match the Goldshore Gateway Access application.
