# Worker name matches the repo directory (gs-gateway).
# The live Cloudflare worker was previously named gs-platform; update that via wrangler rename if needed.
name = "gs-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[env.dev]
routes = []

[env.dev.vars]
ENV = "dev"

[[env.dev.queues.producers]]
binding = "CHECKOUT_EVENTS_QUEUE"
queue = "gs-platform-checkout-events-dev"

[[env.dev.queues.producers]]
binding = "CONTACT_EVENTS_QUEUE"
queue = "gs-platform-contact-events-dev"

[env.prod]
# www.goldshore.ai is owned by gs-www-redirect Worker
# status.goldshore.ai is reserved for gs-status Pages project (MODULE_B2_RUNTIME_WIRING.md)
# dashboard.goldshore.ai uses custom_domain to auto-provision DNS
# agent.goldshore.ai/* is gateway-owned and forwarded to gs-agent through the AGENT service binding.
routes = [
  { pattern = "gw.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "agent.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "dashboard.goldshore.ai", custom_domain = true }
]

[env.prod.vars]
ENV = "production"
# Cloudflare Access application: Goldshore Gateway
# Protected-route AUD tag shared by gw.goldshore.ai, api.goldshore.ai, and agent.goldshore.ai.
# Keep those hostnames in one Access application while this Worker uses a single audience binding.
CLOUDFLARE_ACCESS_AUDIENCE = "d303765cb1746f11a0fe37affad2d191deb18771a1d98beb29cb9c52b6cd731b"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

# ── KV Namespaces ───────────────────────────────────────────────────
[[env.prod.kv_namespaces]]
binding = "AI_CACHE"
id = "a02882aa2e2248158505d3a0aac8e9e2"

[[env.prod.kv_namespaces]]
binding = "GS_CONFIG"
id = "68f52b467dc0413991b2195ef9081cae"

[[env.prod.kv_namespaces]]
binding = "GATEWAY_KV"
id = "17840f9b6ac64cb1a51aeff085efe24c"

# ── D1 Databases ──────────────────────────────────────────────────
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

# ── R2 Buckets ───────────────────────────────────────────────────
[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

# ── Service bindings ──────────────────────────────────────────────
[[env.prod.services]]
binding = "API_SERVICE"
service = "gs-api"
environment = "prod"

[[env.prod.services]]
binding = "AGENT"
service = "gs-agent"
environment = "prod"

[[env.prod.services]]
binding = "SECURITY_CHECK"
service = "banproof-me"

[[env.prod.services]]
binding = "SIGNALS"
service = "gs-core-worker"
environment = "prod"

# ── Queue producers ───────────────────────────────────────────────
[[env.prod.queues.producers]]
binding = "MAIL_QUEUE"
queue = "gs-mail-jobs"

[[env.prod.queues.producers]]
binding = "CHECKOUT_EVENTS_QUEUE"
queue = "gs-platform-checkout-events-prod"

[[env.prod.queues.producers]]
binding = "CONTACT_EVENTS_QUEUE"
queue = "gs-platform-contact-events-prod"

[env.preview]
routes = [
  { pattern = "gw-preview.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "agent-preview.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.preview.vars]
ENV = "preview"

[[env.preview.queues.producers]]
binding = "CHECKOUT_EVENTS_QUEUE"
queue = "gs-platform-checkout-events-preview"

[[env.preview.queues.producers]]
binding = "CONTACT_EVENTS_QUEUE"
queue = "gs-platform-contact-events-preview"
