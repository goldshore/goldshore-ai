# Contracted gateway worker for this monorepo.
# Production deployment uses the gs-gateway-prod environment.
name = "gs-gateway"
main = "src/index.ts"
compatibility_date = "2025-03-07"

workers_dev = false

[env.dev]
routes = []

[env.dev.vars]
ENV = "dev"

[[env.dev.queues.producers]]
binding = "CHECKOUT_EVENTS_QUEUE"
queue = "gs-platform-checkout-events-dev"

[[env.dev.queues.producers]]
binding = "CONTACT_EVENTS_QUEUE"
queue = "gs-platform-contact-events-dev"

[env.prod]
routes = [
  { pattern = "gw.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "agent.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.prod.vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
# Set CLOUDFLARE_ACCESS_AUDIENCE as a Worker secret in Cloudflare.
# The live AUD tag must match the Goldshore Gateway Access application.
