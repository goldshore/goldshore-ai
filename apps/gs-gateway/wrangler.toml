name = "gs-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

[env.prod]
routes = [
  { pattern = "gw.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[[env.prod.services]]
binding = "API_SERVICE"
service = "gs-api"
environment = "prod"

[[env.prod.services]]
binding = "ADMIN_SERVICE"
service = "gs-admin"

[env.prod.vars]
ENV = "production"
