name = "gs-web"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Serve the Astro build as a Worker with Assets.
# The Cloudflare adapter builds the configured Worker entrypoint and emits
# static assets into dist. Keeping both `main` and an assets binding avoids
# Wrangler treating the project as an assets-only Worker.
[assets]
directory = "./dist"
binding = "ASSETS"

# Astro builds before a Wrangler environment is selected. Define its session
# binding at the top level so the generated deployment config reuses the
# existing namespace instead of attempting automatic provisioning.
[[kv_namespaces]]
binding = "SESSION"
id = "09ae2ffbffe24e628c9538c8129dfe33"

# ── Production ──────────────────────────────────────────────────────────────────────────────────────

[env.prod]
routes = [
  { pattern = "goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "admin.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "admin.goldshore.org/*", zone_name = "goldshore.org" }
  { pattern = "admin.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[[env.prod.kv_namespaces]]
binding = "KV"
id = "5f13370575784c9dacff522121104cb3"

[[env.prod.kv_namespaces]]
binding = "SESSION"
id = "09ae2ffbffe24e628c9538c8129dfe33"

[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

[env.prod.images]
binding = "IMAGES"

[env.prod.vars]
ENV = "production"
PUBLIC_API = "https://api.goldshore.ai"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "c520a7647223b49b20fbe5be240772863eb684b97b57c08955b6104c58170db9"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
MAILCHANNELS_SENDER_NAME = "GoldShore"

# Secrets (set via wrangler secret put — never commit):
#   wrangler secret put MAILCHANNELS_SENDER_EMAIL --env prod --name gs-web
#   Value: hello@goldshore.ai

# ── Preview ──────────────────────────────────────────────────────────────────────────────────────

[env.preview]
routes = [
  { pattern = "preview.goldshore.ai", custom_domain = true }
]

[[env.preview.kv_namespaces]]
binding = "KV"
id = "5f13370575784c9dacff522121104cb3"

[[env.preview.kv_namespaces]]
binding = "SESSION"
id = "09ae2ffbffe24e628c9538c8129dfe33"

[[env.preview.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.preview.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets-preview"

[env.preview.images]
binding = "IMAGES"

[env.preview.vars]
ENV = "preview"
PUBLIC_API = "https://api-preview.goldshore.ai"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "5227a14ad2cd2f59e56c8c65161c29bb2f9787b5b8be37a631c60f4d07b33214"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
MAILCHANNELS_SENDER_NAME = "GoldShore"
