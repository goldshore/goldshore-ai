name = "gs-web"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
main = "./src/worker.ts"

# Deploy the Astro SSR entry point and its static bundle as one Worker release.
# `astro build` emits the server manifest and assets under dist; Wrangler
# bundles src/worker.ts as the Worker entry and uploads dist as its assets.
# This is intentionally not a Cloudflare Pages project.
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENV = "production"
PUBLIC_ENV = "production"
PUBLIC_API = "https://api.goldshore.ai"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "9b97506a6f0d65a060dda7fa33aa66f6cee4112898fd45e5cf4da1d25db996c0"
CLOUDFLARE_ACCESS_APPLICATION = "admin-production"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"

# ── Production ──────────────────────────────────────────────────────────────────────────────────────

[env.prod]
# Wrangler otherwise derives `<top-level name>-<env>` and would target a
# `gs-web-prod` Worker. The production Worker was renamed to `gs-web` in the
# dashboard (same script id, 7510e007…), so this environment pins the name
# explicitly. Without it, `wrangler deploy --env prod` recreates `gs-web-prod`
# and moves the routes below onto that new Worker, orphaning the live one.
name = "gs-web"
routes = [
  { pattern = "goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "www.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "www.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "admin.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "admin.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "risk.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "risk.goldshore.org/*", zone_name = "goldshore.org" }
]

[env.prod.images]
binding = "IMAGES"

[env.prod.vars]
ENV = "production"
PUBLIC_ENV = "production"
PUBLIC_API = "https://api.goldshore.ai"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "9b97506a6f0d65a060dda7fa33aa66f6cee4112898fd45e5cf4da1d25db996c0"
CLOUDFLARE_ACCESS_APPLICATION = "admin-production"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"

# gs-web owns no transactional database, sensitive object storage, Durable
# Object, queue, Workflow, or provider-secret bindings. Contact, form, CMS,
# media, and admin operations are authenticated and persisted by gs-api.
# Deploying this manifest intentionally removes dashboard-only bindings such as
# a production API_AUTH reference to a retired preview API. ASSETS above is the Astro
# static-assets binding and must not be replaced with an R2 bucket binding.

# Pull requests build this production manifest without deploying it. Cloudflare
# Worker Versions provide read-only workers.dev previews; no preview Worker,
# route, KV namespace, database, R2 bucket, queue, or Workflow is declared.
