name = "gs-web-app"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Serve the Astro build as a Worker with Assets.
# main is omitted here — wrangler auto-discovers dist/_worker.js via the [assets]
# binding. Specifying main = "dist/worker.js" causes @cloudflare/vite-plugin to
# throw during astro build because dist/ doesn't exist pre-build.
[assets]
directory = "./dist"
binding = "SITE_ASSETS"

# ── Production ────────────────────────────────────────────────────────────────

[env.prod]
routes = [
  { pattern = "goldshore.ai", custom_domain = true },
  { pattern = "goldshore.org", custom_domain = true, override_existing_origin = true }
]

[[env.prod.kv_namespaces]]
binding = "KV"
id = "5f13370575784c9dacff522121104cb3"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

[env.prod.vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "8b6e1890f664c52ad265a240948a1f3315a757e19b4a0fa180ffe952b81a0daf"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
MAILCHANNELS_SENDER_NAME = "GoldShore"

# Secrets (set via wrangler secret put — never commit):
#   wrangler secret put MAILCHANNELS_SENDER_EMAIL --env prod --name gs-web
#   Value: hello@goldshore.ai

# ── Preview ───────────────────────────────────────────────────────────────────

[env.preview]
routes = [
  { pattern = "preview.goldshore.ai", custom_domain = true }
]

[[env.preview.kv_namespaces]]
binding = "KV"
id = "5f13370575784c9dacff522121104cb3"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.preview.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets-preview"

[env.preview.vars]
ENV = "preview"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
CLOUDFLARE_ACCESS_AUDIENCE = "8b6e1890f664c52ad265a240948a1f3315a757e19b4a0fa180ffe952b81a0daf"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
MAILCHANNELS_SENDER_NAME = "GoldShore"
