max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter-preview"

[[env.preview.queues.consumers]]
queue = "gs-events-preview"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter-preview"

[[env.preview.queues.consumers]]
queue = "gs-mail-jobs-preview"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter-preview"

# ── Workflows ────────────────────────────────────────────────────────────────
[[env.preview.workflows]]
binding = "GS_SIGNALS"
name = "gs-signals-evaluator-preview"
class_name = "SignalsEvaluator"

# ── Workflows ────────────────────────────────────────────────────────────────
# Safe to bind even though the preview queues are not: a Workflow is
# provisioned from the class exported by this same script at deploy time, so
# it does not need to pre-exist the way a queue does.
[[env.preview.workflows]]
binding = "GS_SIGNALS"
name = "gs-signals-evaluator-preview"
class_name = "SignalsEvaluator"

# ── Secrets Store ────────────────────────────────────────────────────────────
# Secrets Store bindings are per secret, not a store object. The runtime reads
# env.INTEGRATION_MASTER_KEY directly.
