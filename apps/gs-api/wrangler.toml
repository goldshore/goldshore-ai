name = "gs-api"
main = "src/index.ts"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Deployments must always select a named environment so bindings cannot leak
# between production and preview.

# ══════════════════════════════════════════════════════════════════════════════
# Production environment
# Canonical environment name is "prod". Validate locally with
# `pnpm exec wrangler deploy --env prod --dry-run`; production uses the protected workflow.
# ══════════════════════════════════════════════════════════════════════════════

[env.prod]
# Pin the Worker name. Wrangler otherwise derives `<top-level name>-<env>` and
# would target `gs-api-prod`; the production Worker was renamed to `gs-api` in
# the dashboard (same script id, a5322bde…). Without this, `wrangler deploy
# --env prod` recreates `gs-api-prod` and moves the routes below onto it.
#
# NOTE: this makes the default (top-level) environment and env.prod resolve to
# the same Worker. The top level declares no bindings, so a bare `wrangler
# deploy` without `--env prod` would replace live gs-api with a bindingless
# build. Every deploy path in this repo passes `--env prod`; keep it that way.
name = "gs-api"

routes = [
  { pattern = "api.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "api.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "agent.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "agent.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "mail.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "ops.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "trading.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "trading.goldshore.org/*", zone_name = "goldshore.org" },
  { pattern = "dashboard.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "dash.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "gw.goldshore.ai/*", zone_name = "goldshore.ai" },
  # MCP surface, folded in from the standalone goldshore-mcp Worker. Served by
  # the /mcp route; Cloudflare Access gates the hostname.
  { pattern = "mcp.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.prod.vars]
ENV = "production"
AI_SEARCH_PUBLIC_ENDPOINT = "https://f800ea69-7ef4-4094-ba29-de38736fd22f.search.ai.cloudflare.com"
CLOUDFLARE_ACCESS_AUDIENCE = "8510d42c31fc791e295427031ffeef7c7ebc0f1b62d8634fbb284bf82562f528"
CLOUDFLARE_ACCESS_APPLICATION = "api-production"
CLOUDFLARE_SERVICE_ACCESS_AUDIENCE = "7ad07891d7c74cf243bb276b5941a75a3fcdc7301addb662a8b21df3e679c4a1"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
# CONTROL_SYNC_TOKEN is a Worker secret. Keep it out of vars so deploys
# preserve the remote secret instead of replacing it with a placeholder.
GOOGLE_OAUTH_CLIENT_ID = "1054833139648-gt5o3k9uqhltt08nne0sigh8l3vodji7.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI = "https://api.goldshore.ai/goldclaw/oauth/google/callback"
GOOGLE_BUSINESS_OAUTH_REDIRECT_URI = "https://api.goldshore.ai/admin/google/oauth/callback"
GOOGLE_BUSINESS_OWNERSHIP_VERIFIED = "false"
GOOGLE_OAUTH_PRODUCTION_APPROVED = "false"
# Workspace RBAC remains fail-closed until the service-account secret,
# delegated admin, and verified group mapping are configured by an operator.
GOOGLE_WORKSPACE_SYNC_ENABLED = "false"
GOOGLE_WORKSPACE_DELEGATED_ADMIN = ""
GOOGLE_WORKSPACE_CUSTOMER_ID = "my_customer"
GOOGLE_WORKSPACE_GROUP_ROLE_MAP = "{}"
GOOGLE_WORKSPACE_ACCESS_APPLICATIONS = "admin-production,api-production"
GITHUB_OAUTH_REDIRECT_URI = "https://api.goldshore.ai/auth/github/callback"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
MAIL_FORWARD_TO = "marstonr6@gmail.com"
PUBLIC_SITE_URL = "https://goldshore.ai"
MAIL_FROM_EMAIL = "noreply@goldshore.ai"
MAIL_FROM_NAME = "GoldShore"
TURNSTILE_SITEKEY = "0x4AAAAAAEOjS4lrG1IT_-Fs"

# ── SECRETS (set in Cloudflare dashboard, not here) ──────────────────────────────────
# GITHUB_API_TOKEN is a secret for Admin endpoints (merge cockpit, repo health).
#   Value: <personal access token with public_repo scope>
# Required for searching GitHub repositories and validating wrangler.toml files.

# CF_ACCOUNT_ID is a secret for Cloudflare API operations (admin dashboard).
#   Value: <Cloudflare account ID from https://dash.cloudflare.com>
# Required for managing workers, bindings, and secrets from admin UI.

# CF_API_TOKEN is a secret for Cloudflare API authentication.
#   Value: <Cloudflare API token with appropriate scopes>
# Required for admin operations against Cloudflare resources.

# ANTHROPIC_API_KEY is a secret for AI-powered admin features.
#   Value: <Anthropic API key>
# Required for AI-powered framework ranking and recommendations.

# GITHUB_CLIENT_SECRET is a secret for GitHub OAuth authentication.
#   Value: <GitHub OAuth app client secret from https://github.com/settings/developers>
# Required for /auth/github/callback and session creation.

# GS_GITHUB_WEBHOOK_SECRET is the HMAC secret shared only with GitHub repository
# webhooks. It is distinct from INTEGRATION_MASTER_KEY and OAuth credentials.

# TURNSTILE_SECRET_KEY is a secret for Cloudflare Turnstile bot protection validation.
#   Value: <Turnstile secret key from https://dash.cloudflare.com/>
# Required for validating Turnstile responses on form submissions.

# GOOGLE_ADMIN_SERVICE_ACCOUNT is a JSON Worker secret used only by the
# disabled-by-default Workspace RBAC sync.

# ── KV ───────────────────────────────────────────────────────────────────────
[[env.prod.kv_namespaces]]
binding = "KV"
id = "e0b8b807191346c3b0afc25fe716d2cd"

[[env.prod.kv_namespaces]]
binding = "CONTROL_LOGS"
id = "a52e94cb331c4e3db08f2aa507e6df09"

# TRADING_KV remains shared with the default environment until a dedicated
# production namespace is provisioned in the Cloudflare dashboard.
[[env.prod.kv_namespaces]]
binding = "TRADING_KV"
id = "9b3314c3b7af40a284a8c9b6e2990709"

# MCP Workers Prompt Storage — for storing model context protocol worker
# prompts, templates, and system instructions. Namespace ID to be verified
# in Cloudflare dashboard and linked to corresponding preview namespace.
[[env.prod.kv_namespaces]]
binding = "MCP_WORKERS_PROMPT"
id = "TODO_LOOKUP_MCP_WORKERS_PROMPT_PROD_ID"

# ── R2 ──────────────────────────────────────────────────────────────────────────────────────
[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

# Reuse the verified production bucket with a dedicated binding and prefix.
# A future dashboard migration can point MAIL_ARCHIVE at its own bucket without
# changing application code.
[[env.prod.r2_buckets]]
binding = "MAIL_ARCHIVE"
bucket_name = "gs-assets"

[[env.prod.r2_buckets]]
binding = "TELEMETRY"
bucket_name = "gs-telemetry-storage"

[[env.prod.r2_buckets]]
binding = "RISK_RADAR_R2"
bucket_name = "gs-risk-radar-raw"

# ── D1 ───────────────────────────────────────────────────────────────────────
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.prod.d1_databases]]
binding = "AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

[[env.prod.d1_databases]]
binding = "SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

[[env.prod.d1_databases]]
binding = "RISK_RADAR_DB"
database_name = "risk-radar-db"
database_id = "b0bf3b0e-a7d0-49ae-ac82-4f19450b2ce2"

[[env.prod.d1_databases]]
binding = "JOBS_DB"
database_name = "gs_jobs_db"
database_id = "750c469c-788d-49e8-9254-77231cffd70f"

# ── Durable Objects ──────────────────────────────────────────────────────────
# PAPER_DB: see top-level default-env comment above.
[[env.prod.d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading"
database_id = "af94f483-b98b-41c5-aa23-3fbed2764b52"

# ── AI ───────────────────────────────────────────────────────────────────────
[env.prod.ai]
binding = "AI"

# Native Cloudflare Email Service. Domain onboarding and routing remain
# dashboard-owned; there is no provider API key in Worker secrets.
[[env.prod.send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "noreply@goldshore.ai",
  "hello@goldshore.ai",
  "support@goldshore.ai"
]

[env.prod.observability]
enabled = true
head_sampling_rate = 1

# ── Cron Triggers (Scheduled Jobs) ──────────────────────────────────────────────────────────────
# Token rotation job: Runs daily at 2 AM UTC to refresh expiring OAuth tokens
[env.prod.triggers]
crons = ["0 2 * * *"]

# Legacy satellite service bindings were removed during the two-app
# consolidation. Agent, mail, and API behavior is implemented directly by
# gs-api routes and event handlers; no source code references these bindings.

# ── Queues ───────────────────────────────────────────────────────────────────
# gs-api is the sole application consumer after the satellite migration.
[[env.prod.queues.producers]]
binding = "JOBS_QUEUE"
queue = "goldshore-jobs"

[[env.prod.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "gs-events"

[[env.prod.queues.producers]]
binding = "MAIL_JOBS_QUEUE"
queue = "gs-mail-jobs"

[[env.prod.queues.consumers]]
queue = "goldshore-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter"

[[env.prod.queues.consumers]]
queue = "gs-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter"

[[env.prod.queues.consumers]]
queue = "gs-mail-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "gs-mail-dead-letter"

# ── Workflows ────────────────────────────────────────────────────────────────
[[env.prod.workflows]]
binding = "GS_SIGNALS"
name = "gs-signals-evaluator"
class_name = "SignalsEvaluator"

# Preview deployments use Cloudflare Worker Versions generated from this
# production manifest. They have no custom preview routes or event triggers;
# request middleware rejects state-changing requests on workers.dev hosts.
