name = "gs-api"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Cloudflare Workers Builds can run `npx wrangler versions upload` without
# selecting `--env prod`. Keep the top-level binding set production-compatible
# so those version uploads do not replace gs-api-prod with a bindingless build.
[vars]
ENV = "production"
CLOUDFLARE_ACCESS_AUDIENCE = "8510d42c31fc791e295427031ffeef7c7ebc0f1b62d8634fbb284bf82562f528"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
GOOGLE_OAUTH_CLIENT_ID = "1054833139648-gt5o3k9uqhltt08nne0sigh8l3vodji7.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI = "https://api.goldshore.ai/goldclaw/oauth/google/callback"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
PUBLIC_SITE_URL = "https://goldshore.ai"
MAILCHANNELS_SENDER_NAME = "GoldShore"

[[kv_namespaces]]
binding = "KV"
id = "e0b8b807191346c3b0afc25fe716d2cd"

[[kv_namespaces]]
binding = "CONTROL_LOGS"
id = "a52e94cb331c4e3db08f2aa507e6df09"

[[kv_namespaces]]
binding = "RISK_RADAR_CACHE"
id = "0b56873b6d7b451f9279481920a15447"

# TRADING_KV: the real namespace previously owned by the now route-free
# apps/gs-trading Worker. Trading feature flags, Schwab/Robinhood OAuth
# tokens, and agent orchestration state live here.
[[kv_namespaces]]
binding = "TRADING_KV"
id = "9b3314c3b7af40a284a8c9b6e2990709"

[[r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

[[r2_buckets]]
binding = "TELEMETRY"
bucket_name = "gs-telemetry-storage"

[[r2_buckets]]
binding = "RISK_RADAR_R2"
bucket_name = "risk-radar-raw"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

[[d1_databases]]
binding = "SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

[[d1_databases]]
binding = "RISK_RADAR_DB"
database_name = "risk-radar-db"
database_id = "b0bf3b0e-a7d0-49ae-ac82-4f19450b2ce2"

[[d1_databases]]
binding = "JOBS_DB"
database_name = "gs_jobs_db"
database_id = "750c469c-788d-49e8-9254-77231cffd70f"

# PAPER_DB: the real paper-trading ledger previously owned by the now
# route-free apps/gs-trading Worker (paper_orders, paper_positions,
# paper_closed_positions, agent_recommendations, notification_log — schema in
# db/migrations/0004_paper_trading.sql). trading/routes/trading.ts's
# `env.PAPER_DB ?? env.PLATFORM_DB` fallback exists only so the Worker doesn't
# crash if this binding is ever removed; PLATFORM_DB has no matching schema
# and must not be used for paper-trading data.
[[d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading"
database_id = "af94f483-b98b-41c5-aa23-3fbed2764b52"

[ai]
binding = "AI"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "goldshore-jobs"

[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "gs-events"

[[queues.producers]]
binding = "MAIL_JOBS_QUEUE"
queue = "gs-mail-jobs"

[[queues.producers]]
binding = "DEAD_LETTER_QUEUE"
queue = "gs-mail-dead-letter"

# ══════════════════════════════════════════════════════════════════════════════
# Production environment
# Canonical environment name is "prod". Use `wrangler deploy --env prod`.
# ══════════════════════════════════════════════════════════════════════════════

[env.prod]
routes = [
  { pattern = "api.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "agent.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "ops.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "trading.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "dashboard.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "dash.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "gw.goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "api.goldshore.org/*", zone_name = "goldshore.org" }
]

[env.prod.vars]
ENV = "production"
CLOUDFLARE_ACCESS_AUDIENCE = "8510d42c31fc791e295427031ffeef7c7ebc0f1b62d8634fbb284bf82562f528"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
# CONTROL_SYNC_TOKEN is a Worker secret. Keep it out of vars so deploys
# preserve the remote secret instead of replacing it with a placeholder.
GOOGLE_OAUTH_CLIENT_ID = "1054833139648-gt5o3k9uqhltt08nne0sigh8l3vodji7.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI = "https://api.goldshore.ai/goldclaw/oauth/google/callback"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
PUBLIC_SITE_URL = "https://goldshore.ai"
MAILCHANNELS_SENDER_NAME = "GoldShore"

# MAILCHANNELS_SENDER_EMAIL is a secret, not a var — never commit the value.
#   wrangler secret put MAILCHANNELS_SENDER_EMAIL --env prod --name gs-api
#   Value: hello@goldshore.ai
# Without this secret, /v1/forms/:formId/submissions still persists the
# submission to D1; it just reports mail as not attempted
# (reason: "missing_mail_configuration") instead of failing the request.

# ── KV ───────────────────────────────────────────────────────────────────────
[[env.prod.kv_namespaces]]
binding = "KV"
id = "e0b8b807191346c3b0afc25fe716d2cd"

[[env.prod.kv_namespaces]]
binding = "CONTROL_LOGS"
id = "a52e94cb331c4e3db08f2aa507e6df09"

# RISK_RADAR_CACHE: apps/gs-api/src/routes/wrangler-config.test.ts requires this
# binding to exist. infra/Cloudflare/BINDINGS_MAP.md documents a
# "gs-risk-radar-cache" KV under a naming convention that was never actually
# provisioned in the Gold Shore Labs account. Pointed at the live "RR_CACHE"
# KV namespace (owned by the risk-radar repo) instead of inventing a resource —
# if a dedicated gs-api cache is later provisioned, repoint this to it.
[[env.prod.kv_namespaces]]
binding = "RISK_RADAR_CACHE"
id = "0b56873b6d7b451f9279481920a15447"

# TRADING_KV: see top-level default-env comment above.
[[env.prod.kv_namespaces]]
binding = "TRADING_KV"
id = "9b3314c3b7af40a284a8c9b6e2990709"

# ── R2 ───────────────────────────────────────────────────────────────────────
[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

[[env.prod.r2_buckets]]
binding = "TELEMETRY"
bucket_name = "gs-telemetry-storage"

# RISK_RADAR_R2: same situation as RISK_RADAR_CACHE above — pointed at the
# live "risk-radar-raw" bucket (risk-radar repo) rather than the undeployed
# "gs-risk-radar-raw" name from BINDINGS_MAP.md.
[[env.prod.r2_buckets]]
binding = "RISK_RADAR_R2"
bucket_name = "gs-risk-radar-raw"

# ── D1 ───────────────────────────────────────────────────────────────────────
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.prod.d1_databases]]
binding = "AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

[[env.prod.d1_databases]]
binding = "SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

# RISK_RADAR_DB: same situation — the documented "gs_risk_radar_db" (IDs
# aabedb82-60ca-5697-bbd5-9e85675ee7c5 prod / fe25ba0b-7d1e-5362-a03f-065487222a08
# preview) does not exist in the account. Pointed at the live "risk-radar-db"
# D1 (risk-radar repo) instead. No dedicated preview copy of any of these three
# risk-radar resources exists yet, so env.preview below reuses the same live
# IDs as env.prod — acceptable for a read-mostly signals cache/store, but flag
# if preview traffic should not share the production risk-radar dataset.
[[env.prod.d1_databases]]
binding = "RISK_RADAR_DB"
database_name = "risk-radar-db"
database_id = "b0bf3b0e-a7d0-49ae-ac82-4f19450b2ce2"

[[env.prod.d1_databases]]
binding = "JOBS_DB"
database_name = "gs_jobs_db"
database_id = "750c469c-788d-49e8-9254-77231cffd70f"

# ── AI ───────────────────────────────────────────────────────────────────────
[env.prod.ai]
binding = "AI"

# ── Durable Objects ──────────────────────────────────────────────────────────
# PAPER_DB: see top-level default-env comment above.
[[env.prod.d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading"
database_id = "af94f483-b98b-41c5-aa23-3fbed2764b52"

# ── Durable Objects ──────────────────────────────────────────────────────────────────────
[[env.prod.durable_objects.bindings]]
name = "AUTH_SESSION"
class_name = "AuthSession"

# ── Queues ───────────────────────────────────────────────────────────────────
[[env.prod.migrations]]
tag = "v1-auth-session"
new_sqlite_classes = ["AuthSession"]

# ── Cron Triggers (Scheduled Jobs) ──────────────────────────────────────────────────────────────
# Token rotation job: Runs daily at 2 AM UTC to refresh expiring OAuth tokens
[[env.prod.triggers.crons]]
cron = "0 2 * * *"

# Legacy satellite service bindings were removed during the two-app
# consolidation. Agent, mail, and API behavior is implemented directly by
# gs-api routes and event handlers; no source code references these bindings.

# ── Queues (producers) ───────────────────────────────────────────────────────────
[[env.prod.queues.producers]]
binding = "JOBS_QUEUE"
queue = "goldshore-jobs"

[[env.prod.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "gs-events"

[[env.prod.queues.producers]]
binding = "MAIL_JOBS_QUEUE"
queue = "gs-mail-jobs"

[[env.prod.queues.producers]]
binding = "DEAD_LETTER_QUEUE"
queue = "gs-mail-dead-letter"

# Production queue consumers are owned outside gs-api today:
# - goldshore-jobs and gs-events are consumed by gs-mail.
# - gs-mail-jobs is configured as an HTTP pull consumer.
# Keep gs-api as a producer only so deploys do not fail while attempting to
# replace existing queue consumers.

[[env.prod.queues.consumers]]
queue = "gs-events"

# ── Workflows ────────────────────────────────────────────────────────────────
[[env.prod.workflows]]
binding = "GS_SIGNALS"
name = "signals-evaluator"
class_name = "SignalsEvaluator"
script_name = "gs-signals-prod"

# ── Secrets Store ────────────────────────────────────────────────────────────
# Secrets Store bindings are per secret, not a store object. The runtime reads
# env.INTEGRATION_MASTER_KEY directly.
[[env.prod.secrets_store_secrets]]
binding = "INTEGRATION_MASTER_KEY"
store_id = "b9824d3280c54573a24137c7e7143b33"
secret_name = "INTEGRATION_MASTER_KEY"

# ══════════════════════════════════════════════════════════════════════════════
# Preview environment
# INTEGRATION_MASTER_KEY remains a normal Worker secret until a real Cloudflare
# Secrets Store and secret are provisioned. Do not add a secrets_store_secrets
# binding that points at a nonexistent store; that blocks every deployment.

# ══════════════════════════════════════════════════════════════════════════════
# Preview environment — deploys to workers.dev (no zone route needed)
# ══════════════════════════════════════════════════════════════════════════════

[env.preview]
workers_dev = true
routes = [
  { pattern = "api-preview.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.preview.vars]
ENV = "preview"
GOOGLE_OAUTH_CLIENT_ID = "1054833139648-gt5o3k9uqhltt08nne0sigh8l3vodji7.apps.googleusercontent.com"
CONTACT_NOTIFICATION_EMAILS = "marstonr6@gmail.com"
PUBLIC_SITE_URL = "https://preview.goldshore.ai"
MAILCHANNELS_SENDER_NAME = "GoldShore"

# ── KV ───────────────────────────────────────────────────────────────────────
# MAILCHANNELS_SENDER_EMAIL secret — see env.prod above for the command;
# use --env preview --name gs-api instead.

# ── KV ────────────────────────────────────────────────────────────────────────────
[[env.preview.kv_namespaces]]
binding = "KV"
id = "20d2c096b673433597d084a562993021"

[[env.preview.kv_namespaces]]
binding = "CONTROL_LOGS"
id = "09e43cb8bd4749fdaaed0dc9d4ff2284"

[[env.preview.kv_namespaces]]
binding = "RISK_RADAR_CACHE"
id = "a2315c0e83f27b610c3dfdd30eb0a9ea"

# ── R2 ───────────────────────────────────────────────────────────────────────
# RISK_RADAR_CACHE: same live "RR_CACHE" resource as env.prod — see the note
# there. No dedicated preview KV exists for this yet, so preview reuses the
# shared live namespace.
[[env.preview.kv_namespaces]]
binding = "RISK_RADAR_CACHE"
id = "0b56873b6d7b451f9279481920a15447"

# TRADING_KV: dedicated preview namespace (also owned by the now route-free
# apps/gs-trading Worker previously).
[[env.preview.kv_namespaces]]
binding = "TRADING_KV"
id = "2c14b79b76e6453ab57c6dde6116a11d"

# ── R2 ────────────────────────────────────────────────────────────────────────────
[[env.preview.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets-preview"

[[env.preview.r2_buckets]]
binding = "TELEMETRY"
bucket_name = "gs-telemetry-storage"

[[env.preview.r2_buckets]]
binding = "RISK_RADAR_R2"
bucket_name = "gs-risk-radar-raw-preview"

# ── D1 ───────────────────────────────────────────────────────────────────────
[[env.preview.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

[[env.preview.d1_databases]]
binding = "AUDIT_DB"
database_name = "gs_audit_db"
database_id = "1ae71d76-188f-481b-91d9-db2d39013f68"

[[env.preview.d1_databases]]
binding = "SIGNALS_DB"
database_name = "gs_signals_db"
database_id = "76af4653-7f44-417b-b46e-250143d906fd"

# RISK_RADAR_DB: same live "risk-radar-db" D1 as env.prod — see the note there.
# No dedicated preview database exists for this yet.
[[env.preview.d1_databases]]
binding = "RISK_RADAR_DB"
database_name = "risk-radar-db"
database_id = "b0bf3b0e-a7d0-49ae-ac82-4f19450b2ce2"

[[env.preview.d1_databases]]
binding = "JOBS_DB"
database_name = "gs_jobs_db"
database_id = "750c469c-788d-49e8-9254-77231cffd70f"

# ── AI ───────────────────────────────────────────────────────────────────────
[env.preview.ai]
binding = "AI"

# ── Durable Objects ──────────────────────────────────────────────────────────
[[env.preview.durable_objects.bindings]]
name = "AUTH_SESSION"
class_name = "AuthSession"
script_name = "gs-api-prod"

# ── Queues ───────────────────────────────────────────────────────────────────
[[env.preview.queues.producers]]
binding = "JOBS_QUEUE"
queue = "goldshore-jobs"

[[env.preview.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "gs-events"

[[env.preview.queues.producers]]
binding = "MAIL_JOBS_QUEUE"
queue = "gs-mail-jobs"

[[env.preview.queues.producers]]
binding = "DEAD_LETTER_QUEUE"
queue = "gs-mail-dead-letter"

# ── Secrets Store ────────────────────────────────────────────────────────────
# Secrets Store bindings are per secret, not a store object. The runtime reads
# env.INTEGRATION_MASTER_KEY directly.
[[env.preview.secrets_store_secrets]]
binding = "INTEGRATION_MASTER_KEY"
store_id = "b9824d3280c54573a24137c7e7143b33"
