# ── D1 ───────────────────────────────────────────────────────────────────────
[[env.preview.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db_preview"
database_id = "2dc82951-cfff-45ba-8f77-4ecd42dd85dd"

[[env.preview.d1_databases]]
binding = "AUDIT_DB"
database_name = "gs_audit_db_preview"
database_id = "72920276-2581-4400-bf3f-78e465f93e67"

[[env.preview.d1_databases]]
binding = "SIGNALS_DB"
database_name = "gs_signals_db_preview"
database_id = "aa8bcc63-689f-4403-a43d-6ea0af2a712b"

[[env.preview.d1_databases]]
binding = "RISK_RADAR_DB"
database_name = "risk-radar-db-preview"
database_id = "0f31fa11-2a63-4c4c-9522-a07e09b7a9d9"

# JOBS_DB and PAPER_DB are optional in preview. Cloudflare's account-level D1
# limit is currently reached, so preview does not fall back to either
# production database. Their routes fail closed until dedicated databases can
# be provisioned.

# ── AI ───────────────────────────────────────────────────────────────────────
[env.preview.ai]
binding = "AI"

# ── Queues ───────────────────────────────────────────────────────────────────
[[env.preview.queues.producers]]
binding = "JOBS_QUEUE"
queue = "goldshore-jobs-preview"

[[env.preview.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "gs-events-preview"

[[env.preview.queues.producers]]
binding = "MAIL_JOBS_QUEUE"
queue = "gs-mail-jobs-preview"

[[env.preview.queues.producers]]
