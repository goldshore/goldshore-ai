name = "gs-trading"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace — stores agent state, OAuth tokens, trading signals, and feature flags
[[kv_namespaces]]
binding = "TRADING_KV"
id = "9b3314c3b7af40a284a8c9b6e2990709"
preview_id = "2c14b79b76e6453ab57c6dde6116a11d"

[[d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading"
database_id = "af94f483-b98b-41c5-aa23-3fbed2764b52"

[vars]
ENV = "development"

# ---- Production environment --------------------------------------------------
[env.prod]
name = "gs-trading-prod"
# Consolidated into gs-api trading routes. Keep this legacy config route-free
# to prevent hostname ownership collisions during validation and deployment.
routes = []

# kv_namespaces is NOT inherited by named environments in Wrangler — must be re-declared.
[[env.prod.kv_namespaces]]
binding = "TRADING_KV"
id = "9b3314c3b7af40a284a8c9b6e2990709"

[[env.prod.d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading"
database_id = "af94f483-b98b-41c5-aa23-3fbed2764b52"

[env.prod.vars]
ENV = "production"
# OAuth redirect URI — must match exactly what is registered in your Schwab app
SCHWAB_REDIRECT_URI = "https://trading.goldshore.ai/oauth/schwab/callback"
# Optional notification webhooks (set via wrangler secret put):
# NOTIFY_EMAIL_WEBHOOK
# NOTIFY_WEBHOOK_URL
# NOTIFY_SMS_WEBHOOK

# ---- Preview environment -----------------------------------------------------
[env.preview]
routes = []

[[env.preview.kv_namespaces]]
binding = "TRADING_KV"
id = "2c14b79b76e6453ab57c6dde6116a11d"

[[env.preview.d1_databases]]
binding = "PAPER_DB"
database_name = "goldshore-paper-trading-preview"
database_id = "00000000-0000-0000-0000-000000000000"

[env.preview.vars]
ENV = "preview"
SCHWAB_REDIRECT_URI = "https://preview.goldshore.ai/oauth/schwab/callback"

# ---- Secrets (set via: wrangler secret put <NAME> --env prod) ----------------
# Cloudflare Access:
#   CLOUDFLARE_ACCESS_AUDIENCE  -- CF Access Application Audience tag
#   CLOUDFLARE_TEAM_DOMAIN      -- e.g. "yourteam.cloudflareaccess.com"
# Schwab / ThinkorSwim OAuth 2.0:
#   SCHWAB_CLIENT_ID            -- OAuth app client ID
#   SCHWAB_CLIENT_SECRET        -- OAuth app client secret
#   SCHWAB_ACCOUNT_HASH         -- Encrypted account hash from Schwab /accounts
#   SCHWAB_REFRESH_TOKEN        -- Optional seed; overridden by KV rotation after OAuth
# Robinhood:
#   ROBINHOOD_TOKEN             — Bearer token (also writable via POST /oauth/robinhood/token)
#   ROBINHOOD_ACCOUNT_ID        — Robinhood account number
