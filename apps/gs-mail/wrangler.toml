name = "gs-mail"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Email routing is configured in Cloudflare dashboard under Email Routing.
# This worker processes inbound email events forwarded by Cloudflare and
# consumes checkout/contact events from queues.
#
# Required secrets (set via wrangler secret put):
#   MAIL_FORWARD_TO   — destination address for forwarding inbound email
#   BLOCKED_SENDERS   — comma-separated list of blocked sender addresses (optional)

# ── Production ───────────────────────────────────────────────────────────────
[env.prod]

[env.prod.vars]
ENV = "production"

[[env.prod.kv_namespaces]]
binding = "GS_CONFIG"
id = "5f13370575784c9dacff522121104cb3"

[[env.prod.queues.consumers]]
queue = "gs-platform-checkout-events-prod"
max_batch_size = 10
max_batch_timeout = 30

[[env.prod.queues.consumers]]
queue = "gs-platform-contact-events-prod"
max_batch_size = 10
max_batch_timeout = 30

# ── Preview ──────────────────────────────────────────────────────────────────
[env.preview]

[env.preview.vars]
ENV = "preview"

[[env.preview.kv_namespaces]]
binding = "GS_CONFIG"
id = "5f13370575784c9dacff522121104cb3"

[[env.preview.queues.consumers]]
queue = "gs-platform-checkout-events-preview"
max_batch_size = 10
max_batch_timeout = 30

[[env.preview.queues.consumers]]
queue = "gs-platform-contact-events-preview"
max_batch_size = 10
max_batch_timeout = 30

# ── Dev ──────────────────────────────────────────────────────────────────────
[env.dev]

[env.dev.vars]
ENV = "development"

[[env.dev.kv_namespaces]]
binding = "GS_CONFIG"
id = "5f13370575784c9dacff522121104cb3"

[[env.dev.queues.consumers]]
queue = "gs-platform-checkout-events-dev"
