name = "gs-mail"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" }
]


[env.dev]
name = "gs-mail-dev"

[[env.dev.kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[env.dev.vars]
ENV = "dev"
MAIL_FORWARD_TO = "ops+dev@goldshore.ai"

[env.prod]
routes = [
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.prod.vars]
ENV = "production"
MAIL_SERVICE = "true"
MAIL_ALLOWED_RECIPIENTS = "ops@goldshore.ai,inbox@goldshore.ai"

[[env.prod.queues.producers]]
binding = "JOBS_QUEUE"
queue = "gs-mail-jobs"

[[env.prod.queues.producers]]
binding = "JOBS_QUEUE_DLQ"
queue = "gs-mail-dead-letter"

[env.preview]
routes = [
  { pattern = "mail-preview.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.preview.vars]
ENV = "preview"
MAIL_FORWARD_TO = "ops+preview@goldshore.ai"
