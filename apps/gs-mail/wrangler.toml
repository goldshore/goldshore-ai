name = "gs-mail"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# Email routing is configured in Cloudflare dashboard under Email Routing.
# This worker processes inbound email events forwarded by Cloudflare and
# consumes checkout/contact events from queues.
#
# Required secrets (set via wrangler secret put):
#   MAIL_FORWARD_TO   — destination address for forwarding inbound email
#   BLOCKED_SENDERS   — comma-separated list of blocked sender addresses (optional)

# ── Production ───────────────────────────────────────────────────────────────
[env.prod]

[env.prod.vars]
ENV = "production"

[[env.prod.kv_namespaces]]
binding = "GS_CONFIG"
id = "5f13370575784c9dacff522121104cb3"

[[env.prod.queues.consumers]]
queue = "gs-platform-checkout-events-prod"
max_batch_size = 10
max_batch_timeout = 30

[[env.prod.queues.consumers]]
queue = "gs-platform-contact-events-prod"
max_batch_size = 10
max_batch_timeout = 30

# Preview and dev environments consolidated into prod-only deployment per architecture-sop.md Phase 0.
# Local development uses wrangler dev without explicit env selection.
