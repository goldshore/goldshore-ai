name = "gs-mail"
main = "src/index.ts"
compatibility_date = "2026-03-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[[email]]
bindings = [
  { name = "MAIL", type = "inbound" }
]

[[kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[vars]
ENV = "production"
MAIL_FORWARD_TO = "ops@goldshore.ai"
MAIL_ALLOWED_RECIPIENTS = "ops@goldshore.ai,inbox@goldshore.ai"

[observability]
enabled = true

[env.dev]
name = "gs-mail-dev"

[[env.dev.kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[env.dev.vars]
ENV = "dev"
MAIL_FORWARD_TO = "ops+dev@goldshore.ai"

[env.preview]
name = "gs-mail-preview"

[[env.preview.kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[env.preview.vars]
ENV = "preview"
MAIL_FORWARD_TO = "ops+preview@goldshore.ai"
ENV = "development"
MAIL_ALLOWED_RECIPIENTS = "ops@goldshore.ai,inbox@goldshore.ai"

[env.prod]
routes = [
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[[env.prod.kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[env.prod.vars]
ENV = "production"
MAIL_FORWARD_TO = "ops@goldshore.ai"

[env.prod.observability]
enabled = true

[env.production]
routes = [
  { pattern = "mail.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[[env.production.kv_namespaces]]
binding = "GS_CONFIG"
id = "9cc2209906a94851b704be57543987a9"

[env.production.vars]
ENV = "production"
MAIL_FORWARD_TO = "ops@goldshore.ai"

[env.production.observability]
enabled = true
MAIL_ALLOWED_RECIPIENTS = "ops@goldshore.ai,inbox@goldshore.ai"
