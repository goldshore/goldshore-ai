name = "gs-control"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[env.prod]
routes = [
  { pattern = "ops.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.prod.vars]
ENV = "production"
CONTROL_SERVICE = "true"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

[[env.prod.kv_namespaces]]
binding = "GS_CONFIG"
id = "68f52b467dc0413991b2195ef9081cae"

[[env.prod.kv_namespaces]]
binding = "CONTROL_LOGS"
id = "a52e94cb331c4e3db08f2aa507e6df09"

[[env.prod.r2_buckets]]
binding = "STATE"
bucket_name = "gs-control-state"

[[env.prod.services]]
binding = "API"
service = "gs-api"
environment = "prod"

[[env.prod.services]]
binding = "GATEWAY"
service = "gs-gateway"
environment = "prod"

[env.preview]
routes = [
  { pattern = "ops-preview.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.preview.vars]
ENV = "preview"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

[[env.preview.kv_namespaces]]
binding = "GS_CONFIG"
id = "dddc8b83775c41e58208bf8de87b7052"

[[env.preview.kv_namespaces]]
binding = "CONTROL_LOGS"
id = "09e43cb8bd4749fdaaed0dc9d4ff2284"
