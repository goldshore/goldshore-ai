# Worker Builds token for this service must be the gs-control build token.
# wrangler.toml for the GoldShore Platform gateway worker
# Routes are handled by individual app workers (gs-web, gs-www-redirect, armsway-com).
# This worker is accessed via service bindings from gs-gateway.

name = "gs-platform"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# ─── Production ───────────────────────────────────────────────────────────────

[env.prod]
# All domain routes removed from gs-platform:
#   goldshore.ai / goldshore.org  → gs-web Pages (custom domain)
#   admin.goldshore.ai            → gs-admin Pages (custom domain)
#   armsway.com                   → armsway-com worker (its own wrangler.toml)
#   rmarston.com                  → rmarston-com worker (standalone)
# gs-platform now serves only internal service-binding traffic.
routes = []

[env.prod.vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

# ── D1 ───────────────────────────────────────────────────────────────────────────
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

# ── KV ──────────────────────────────────────────────────────────────────────────
[[env.prod.kv_namespaces]]
binding = "GATEWAY_KV"
id = "17840f9b6ac64cb1a51aeff085efe24c"

[[env.prod.kv_namespaces]]
binding = "GOLDSHORE_KV"
id = "5f13370575784c9dacff522121104cb3"

# ── R2 ──────────────────────────────────────────────────────────────────────────
[[env.prod.r2_buckets]]
binding = "GS_ASSETS"
bucket_name = "gs-assets"

# ── Service bindings (hub → spoke) ───────────────────────────────────────────
[[env.prod.services]]
binding = "SECURITY"
service = "banproof-me"
environment = "prod"



# gs-core-worker is no longer proxied through gs-platform.
# armsway-com worker binds directly to gs-core-worker for its own needs.

# ─── Preview ───────────────────────────────────────────────────────────────

[env.preview]
routes = []

[env.preview.vars]
ENV = "preview"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
