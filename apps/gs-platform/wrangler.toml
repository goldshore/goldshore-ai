# Worker Builds token for this service must be the gs-control build token.
# wrangler.toml for the GoldShore Platform gateway worker

name = "gs-platform"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

# ─── Production ──────────────────────────────────────────────────────────────

[env.prod]
routes = [
  # goldshore.ai and admin.goldshore.ai are served by Cloudflare Pages projects (gs-web, gs-admin).
  # Worker routes with /* would intercept Pages traffic — those routes are intentionally omitted.
  { pattern = "armsway.com/*", zone_name = "armsway.com" },
  { pattern = "www.armsway.com/*", zone_name = "armsway.com" },
]

[env.prod.vars]
ENV = "production"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"

# ── D1 ───────────────────────────────────────────────────────────────────────
[[env.prod.d1_databases]]
binding = "PLATFORM_DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

# ── KV ───────────────────────────────────────────────────────────────────────
[[env.prod.kv_namespaces]]
binding = "GATEWAY_KV"
id = "17840f9b6ac64cb1a51aeff085efe24c"

[[env.prod.kv_namespaces]]
binding = "GOLDSHORE_KV"
id = "5f13370575784c9dacff522121104cb3"

# ── R2 ───────────────────────────────────────────────────────────────────────
[[env.prod.r2_buckets]]
binding = "ASSETS"
bucket_name = "gs-assets"

# ── Service bindings (hub → spoke) ───────────────────────────────────────────
[[env.prod.services]]
binding = "SECURITY"
service = "banproof-me"
environment = "prod"

[[env.prod.services]]
binding = "SIGNALS"
service = "gs-signals-prod"
environment = "prod"

[[env.prod.services]]
binding = "MAIL"
service = "gs-mail"
environment = "prod"

[[env.prod.services]]
binding = "CORE"
service = "gs-core-worker"
environment = "prod"

# ─── Preview ─────────────────────────────────────────────────────────────────

[env.preview]
routes = [
  { pattern = "preview.goldshore.ai/*", zone_name = "goldshore.ai" }
]

[env.preview.vars]
ENV = "preview"
CLOUDFLARE_TEAM_DOMAIN = "goldshore.cloudflareaccess.com"
