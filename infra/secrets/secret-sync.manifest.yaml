  - id: control-sync-token
    canonicalName: CONTROL_SYNC_TOKEN
    sourceEnv: CONTROL_SYNC_TOKEN
    required: true
    targets:
      githubActions:
        - repoGroup: primary
          name: CONTROL_SYNC_TOKEN
      githubAgents:
        - repoGroup: primary
          name: CONTROL_SYNC_TOKEN
      cloudflareWorkers:
        - config: apps/gs-api/wrangler.toml
          env: prod
          name: CONTROL_SYNC_TOKEN
        - config: apps/gs-api/wrangler.toml
          env: preview
          name: CONTROL_SYNC_TOKEN

  - id: jwt-secret
    canonicalName: JWT_SECRET
    sourceEnv: JWT_SECRET
    required: true
    targets:
      githubAgents:
        - repoGroup: primary
          name: JWT_SECRET
      cloudflareWorkers:
        - config: apps/gs-api/wrangler.toml
          env: prod
          name: JWT_SECRET
        - config: apps/gs-api/wrangler.toml
          env: preview
          name: JWT_SECRET

  - id: access-client-secret
    canonicalName: ACCESS_CLIENT_SECRET
    sourceEnv: ACCESS_CLIENT_SECRET
    sourceAliases:
      - CF_ACCESS_CLIENT_SECRET
    required: true
    targets:
