version: 1
description: >
  Canonical secret-name and value synchronization contract for GoldShore AI
  agents, GitHub Actions, and Cloudflare Workers. Values are never stored in
  this file; the sync script reads them from environment variables, ignored
  local files, or explicitly enabled legacy Cloudflare KV fallback sources.

policy:
  noValueLogging: true
  canonicalDeployToken: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
  disallowedWorkflowSecrets:
    - CLOUDFLARE_API_TOKEN_GS_CONTROL
    - CLOUDFLARE_BUILD_API_TOKEN
    - CF_WORKERS_BUILDS

localValueFiles:
  - env.secrets.runtime.json
  - .env.local

repoGroups:
  primary:
    - marzton/goldshore-ai
  legacySecretConsumers:
    - marzton/goldshore-ai
    - marzton/goldshore-api
    - marzton/goldshore
    - marzton/banproof-me
    - marzton/goldshore-web
    - marzton/goldshore-admin
    - marzton/goldshore-core
    - marzton/goldshore-org
    - marzton/goldshore-ops
    - marzton/goldshore-gateway
    - marzton/rmarston-com
    - marzton/armsway-com
    - marzton/wayward-traveler

cloudflareKvFallback:
  accountEnv: CLOUDFLARE_ACCOUNT_ID
  tokenEnv: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
  namespaces:
    - name: GS_CONFIG
      id: 68f52b467dc0413991b2195ef9081cae
    - name: GOLDSHORE_AI
      id: 5f13370575784c9dacff522121104cb3
    - name: GS_AGENT_KV
      id: 25a1eeba1de14e06af18c45b1b2c9743
    - name: GOLDSHORE_API
      id: 9cc2209906a94851b704be57543987a9

secrets:
  - id: cloudflare-account-id
    canonicalName: CLOUDFLARE_ACCOUNT_ID
    sourceEnv: CLOUDFLARE_ACCOUNT_ID
    required: true
    targets:
      githubActions:
        - repoGroup: primary
          name: CLOUDFLARE_ACCOUNT_ID
      githubAgents:
        - repoGroup: primary
          name: CLOUDFLARE_ACCOUNT_ID
      cloudflareWorkers:
        - config: apps/gs-api/wrangler.toml
          env: prod
          name: CLOUDFLARE_ACCOUNT_ID
        - config: apps/gs-api/wrangler.toml
          env: preview
          name: CLOUDFLARE_ACCOUNT_ID

  - id: cloudflare-deploy-token
    canonicalName: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
    sourceEnv: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
    sourceAliases:
      - CLOUDFLARE_API_TOKEN_GS_CONTROL
    required: true
    targets:
      githubActions:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
        - repoGroup: primary
          name: CLOUDFLARE_API_TOKEN_GS_CONTROL
          deprecated: true
          removal: Remove after all external agents stop requesting the legacy gs-control token alias.
      githubAgents:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_AI_DEPLOY_TOKEN
      cloudflareWorkers:
        - config: apps/gs-api/wrangler.toml
          env: prod
          name: CLOUDFLARE_API_TOKEN
        - config: apps/gs-api/wrangler.toml
          env: preview
          name: CLOUDFLARE_API_TOKEN

  - id: cloudflare-goldclaw-agent-admin-token
    canonicalName: CLOUDFLARE_GOLDCLAW_AGENT_ADMIN_TOKEN
    sourceEnv: CLOUDFLARE_GOLDCLAW_AGENT_ADMIN_TOKEN
    sourceAliases:
      - CLOUDFLARE_AGENT_ADMIN_TOKEN
    required: false
    localOnly: true
    note: >
      High-privilege Cloudflare API token for local Codex/Claude operator
      checks. Do not sync this token into GitHub Actions or Cloudflare Workers.
      Use scripts/check-cloudflare-agent-access.mjs to verify scope.
    targets: {}

  - id: cloudflare-zone-id
    canonicalName: CLOUDFLARE_ZONE_ID
    sourceEnv: CLOUDFLARE_ZONE_ID
    sourceAliases:
      - CF_ZONE_ID
      - CLOUDFLARE_GOLDSHORE_AI_ZONE_ID
    required: false
    targets:
      githubActions:
        - repoGroup: primary
          name: CLOUDFLARE_ZONE_ID
        - repoGroup: primary
          name: CF_ZONE_ID
      githubAgents:
        - repoGroup: primary
          name: CLOUDFLARE_ZONE_ID
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_AI_ZONE_ID
      cloudflareWorkers:
        - config: apps/gs-api/wrangler.toml
          env: prod
          name: CLOUDFLARE_ZONE_ID

  - id: goldshore-ai-zone-id
    canonicalName: CLOUDFLARE_GOLDSHORE_AI_ZONE_ID
    sourceEnv: CLOUDFLARE_GOLDSHORE_AI_ZONE_ID
    sourceAliases:
      - CLOUDFLARE_ZONE_ID
      - CF_ZONE_ID
    required: false
    targets:
      githubActions:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_AI_ZONE_ID
      githubAgents:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_AI_ZONE_ID

  - id: goldshore-org-zone-id
    canonicalName: CLOUDFLARE_GOLDSHORE_ORG_ZONE_ID
    sourceEnv: CLOUDFLARE_GOLDSHORE_ORG_ZONE_ID
    required: false
    targets:
      githubActions:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_ORG_ZONE_ID
      githubAgents:
        - repoGroup: primary
          name: CLOUDFLARE_GOLDSHORE_ORG_ZONE_ID

  - id: rmarston-com-zone-id
    canonicalName: CLOUDFLARE_RMARSTON_COM_ZONE_ID
    sourceEnv: CLOUDFLARE_RMARSTON_COM_ZONE_ID
    required: false
    targets:
