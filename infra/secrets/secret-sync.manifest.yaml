  - id: openai-api-key
    canonicalName: OPENAI_API_KEY
    sourceEnv: OPENAI_API_KEY
    required: false
    kvFallback: true
    targets:
      githubActions:
        - repoGroup: legacySecretConsumers
          name: OPENAI_API_KEY
      githubAgents:
        - repoGroup: primary
          name: OPENAI_API_KEY
      cloudflareWorkers:
