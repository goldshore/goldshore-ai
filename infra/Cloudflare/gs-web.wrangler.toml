# Reference wrangler.toml for gs-web (Workers Static Assets).
# The deployable config lives at apps/gs-web/wrangler.toml; keep route ownership aligned.
# Note: gs-web is a Workers Static Assets deployment (main + [assets] binding), not Cloudflare Pages.
# The Cloudflare Astro adapter emits apps/gs-web/dist; wrangler deploy --env prod creates gs-web-prod.

name = "gs-web"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
main = "../../apps/gs-web/src/worker.ts"

[assets]
directory = "../../apps/gs-web/dist"
binding = "ASSETS"

[vars]
# Runtime configuration note:
# - `GS_CONFIG` is intentionally *not* bound to gs-web today.
# - Current gs-web runtime consumers read mutable config indirectly via
#   `PUBLIC_API`/content fetches or admin-generated content, not from the
#   shared gs-control/gs-admin KV namespace.

[env.dev]
# Dev bindings for local development.

[env.preview]
routes = [
  { pattern = "preview.goldshore.ai", custom_domain = true }
]

[env.prod]
# Serving goldshore.ai and goldshore.org apex via Worker route.
# www.goldshore.ai is owned by gs-www-redirect-prod (308 → goldshore.ai).
# www.goldshore.org is owned by gs-www-redirect-prod (308 → goldshore.ai).
routes = [
  { pattern = "goldshore.ai/*", zone_name = "goldshore.ai" },
  { pattern = "goldshore.org/*", zone_name = "goldshore.org" }
]

# Secrets (set via wrangler secret put — never commit):
#   wrangler secret put MAILCHANNELS_SENDER_EMAIL --env prod --name gs-web
#   Value: hello@goldshore.ai
