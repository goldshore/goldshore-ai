cloudflare:
  account_name: goldshore-account
  zone: goldshore.ai
  secondary_zones:
    - goldshore.org

  dns:
    records:
      # A. Live goldshore.ai Worker and tunnel routing records.
      # Synchronized from the Cloudflare DNS dashboard on 2026-08-13. These
      # records document live DNS; Worker route ownership remains canonical in
      # the app-local Wrangler manifests. Do not manufacture DNS records for
      # Wrangler routes that currently have no live record.
      - name: "admin.goldshore.ai"
        type: CNAME
        content: "gs-web.goldshore.workers.dev"
        proxied: true
      - name: "admin-preview.goldshore.ai"
        type: CNAME
        content: "gs-web.goldshore.workers.dev"
        proxied: true
      - name: "preview.goldshore.ai"
        type: CNAME
        content: "gs-web.goldshore.workers.dev"
        proxied: true
      # This four-w spelling is the verified live record, not a normalization
      # of www. Do not silently rename it without an approved DNS migration.
      - name: "wwww.goldshore.ai"
        type: CNAME
        content: "gs-web.goldshore.workers.dev"
        proxied: true
      - name: "lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "www-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "preview-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "risk-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "goldshore.org"
        type: AAAA
        content: "100::"
        proxied: true
        zone: goldshore.org
      - name: "www.goldshore.org"
        type: CNAME
        content: "gs-www-redirect-prod.goldshore.workers.dev"
        proxied: true
        zone: goldshore.org

      # B. Secondary-zone web records (not part of this live .ai sync).
      - name: "admin"
        type: CNAME
        content: "gs-web-prod.goldshore.workers.dev"
        proxied: true
        zone: goldshore.org
      - name: "risk"
        type: CNAME
        content: "gs-web-prod.goldshore.workers.dev"
        proxied: true
        zone: goldshore.org

      # C. Consolidated API Worker and backend aliases.
      - name: "api.goldshore.ai"
        type: CNAME
        content: "gs-api.goldshore.workers.dev"
        proxied: true
      - name: "api-preview.goldshore.ai"
        type: CNAME
        content: "gs-api.goldshore.workers.dev"
        proxied: true
      - name: "api.goldshore.org"
        type: AAAA
        content: "100::"
        proxied: true
        zone: goldshore.org
      - name: "agent.goldshore.ai"
        type: CNAME
        content: "gs-api.goldshore.workers.dev"
        proxied: true
      - name: "mail.goldshore.ai"
        type: CNAME
        content: "gs-api.goldshore.workers.dev"
        proxied: true
      - name: "trading.goldshore.ai"
        type: CNAME
        content: "gs-api.goldshore.workers.dev"
        proxied: true
      - name: "mail-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "ops-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "trading-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "dashboard-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "dash-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true
      - name: "gw-lacie.goldshore.ai"
        type: CNAME
        content: "ff3af5ef-fa24-4111-9e3b-96e4e4c78925.cfargotunnel.com"
        proxied: true

      # D. External or separately deployed platform surfaces.
      - name: "mcp.goldshore.ai"
        type: CNAME
        content: "gateway.agents.cloudflare.com"
        proxied: true
      - name: "platform.goldshore.ai"
        type: CNAME
        content: "gs-gateway-prod.goldshore.workers.dev"
        proxied: true
      - name: "production.goldshore.ai"
        type: CNAME
        content: "goldshore-production.cfargotunnel.com"
        proxied: true

      # E. SendGrid domain authentication and DMARC.
      - name: "em5094.goldshore.ai"
        type: CNAME
        content: "u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "s1._domainkey.goldshore.ai"
        type: CNAME
        content: "s1.domainkey.u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "s2._domainkey.goldshore.ai"
        type: CNAME
        content: "s2.domainkey.u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "_dmarc.goldshore.ai"
        type: TXT
        content: "v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s; rua=mailto:1e5ceffc36ce4cc09f1bb2281b5344ae@dmarc-reports.cloudflare.net;"

  access:
    # Canonical human-readable IdP matrix: docs/domains-and-auth.md.
    # Keep Access application login methods aligned with that table, but do
    # not encode alternative IdPs as multiple Require selectors because
    # Cloudflare evaluates Require selectors conjunctively.
    policies:
      # Dashboard: goldshore.ai/app — the main authenticated entry point served
      # by gs-web. This is the app shown in the CF Access App Launcher as
      # "Dashboard". Protects /app and all sub-paths; /health is public.
      - name: "GoldShore-Dashboard"
        domains:
          - "goldshore.ai"
        action: "allow"
        paths:
          - "/app*"
        public_paths:
          - "/health"
          - "/version"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
            - email: "goldshorelabs@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore-Admin-ZT"
        domains:
          - "admin.goldshore.ai"
          - "admin.goldshore.org"
        action: "allow"
        rules:
          include:
            - email: "marstonr6@gmail.com"
            - email: "admin@goldshore.org"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore Ops"
        domains:
          - "ops.goldshore.ai"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore-Trading-ZT"
        domains:
          - "trading.goldshore.ai"
          - "dashboard.goldshore.ai"
          - "dash.goldshore.ai"
        action: "allow"
        paths:
          - "/*"
        public_paths:
          - "/health"
          - "/version"
          - "/oauth/schwab/callback"
          - "/oauth/robinhood/callback"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore Gateway"
        domains:
          - "gw.goldshore.ai"
          - "agent.goldshore.ai"
          - "gs-agent.goldshore.workers.dev"
        action: "allow"
        paths:
          - "/admin/*"
          - "/internal/*"
          - "/system/*"
          - "/users/*"
          - "/user/*"
          - "/templates/*"
          - "/media/*"
          - "/pages/*"
          - "/ai/*"
          - "/goldclaw/*"
          - "/v1/goldclaw/*"
        public_paths:
          - "/"
          - "/health"
          - "/status"
          - "/version"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore API"
        domains:
          - "api.goldshore.ai"
          - "gs-api.goldshore.workers.dev"
        action: "allow"
        audience: "8510d42c31fc791e295427031ffeef7c7ebc0f1b62d8634fbb284bf82562f528"
        paths:
          - "/admin/*"
          - "/internal/*"
          - "/system/*"
          - "/users/*"
          - "/user/*"
          - "/templates/*"
          - "/media/*"
          - "/pages/*"
          - "/ai/*"
          - "/goldclaw/*"
          - "/v1/goldclaw/*"
        public_paths:
          - "/"
          - "/health"
          - "/status"
          - "/version"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      # Previously only defined in setup-cf-agent-access.yml; mirrored here so
      # this file stays the single declarative source of Access intent.
      - name: "Signals"
        domains:
          - "signals.goldshore.ai"
          - "signals.goldshore.org"
          - "gs-signals-prod.goldshore.workers.dev"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore MCP"
        domains:
          - "mcp.goldshore.ai"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
            - email: "goldshorelabs@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      # Browser SSH to the HP laptop (type "ssh" app; gated by the
      # include_ssh_laptop input of setup-cf-agent-access.yml). Requires a
      # cloudflared tunnel on the laptop publishing this hostname with an SSH
      # origin — the Access app alone serves nothing.
      - name: "Temp HP Laptop SSH"
        type: "ssh"
        domains:
          - "ssh-laptop.goldshore.ai"
        action: "allow"
        session_duration: "4h"
        app_launcher_visible: false
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

  pages:
    # Production moved from Pages to Workers with Assets for the web app.
    # Keep this explicit so automation does not recreate the retired gs-web
    # Pages project or drift the admin workspace away from its Pages boundary.
    projects: []

  workers:
    services:
      - name: "gs-api"
        script_path: "apps/gs-api/dist/index.js"
        routes:
          - pattern: "api.goldshore.ai/*"
          - pattern: "api.goldshore.org/*"
          - pattern: "agent.goldshore.ai/*"
          - pattern: "agent.goldshore.org/*"
          - pattern: "mail.goldshore.ai/*"
          - pattern: "mail.goldshore.org/*"
          - pattern: "ops.goldshore.ai/*"
          - pattern: "trading.goldshore.ai/*"
          - pattern: "trading.goldshore.org/*"
          - pattern: "dashboard.goldshore.ai/*"
          - pattern: "dash.goldshore.ai/*"
          - pattern: "gw.goldshore.ai/*"
        bindings:
          kv:
            - name: "KV"
              namespace: "GS_API_KV"
          d1:
            - name: "PLATFORM_DB"
              database_name: "gs_platform_db"
          r2:
            - name: "GS_ASSETS"
              bucket_name: "gs-assets"
            - name: "MAIL_ARCHIVE"
              bucket_name: "gs-assets"
            - name: "TELEMETRY"
              bucket_name: "gs-telemetry-storage"
            - name: "RISK_RADAR_R2"
              bucket_name: "gs-risk-radar-raw"
          ai:
            - name: "AI"
              gateway: "goldshore-ai-gateway"
          queues:
            - name: "JOBS_QUEUE"
              queue: "goldshore-jobs"
            - name: "EVENTS_QUEUE"
              queue: "gs-events"
            - name: "MAIL_JOBS_QUEUE"
              queue: "gs-mail-jobs"
          workflows:
            - name: "GS_SIGNALS"
              workflow: "gs-signals-evaluator"
          email:
            - name: "EMAIL"

      - name: "gs-web"
        script_path: "apps/gs-web/dist/_worker.js/index.js"
        routes:
          - pattern: "goldshore.ai/*"
          - pattern: "goldshore.org/*"
          - pattern: "www.goldshore.ai/*"
          - pattern: "www.goldshore.org/*"
          - pattern: "admin.goldshore.ai/*"
          - pattern: "admin.goldshore.org/*"
          - pattern: "risk.goldshore.ai/*"
          - pattern: "risk.goldshore.org/*"
        bindings: {}

  email:
    routing:
      catch_all:
        enabled: true
        destination: "inbox@goldshore.ai"
      addresses:
        - address: "ops@goldshore.ai"
          destination: "your.personal.email@goldshore.ai"
        - address: "support@goldshore.ai"
          destination: "your.personal.email@goldshore.ai"

  redirects:
    canonical_host: "goldshore.ai"
    rules:
      - from: "www.goldshore.ai/*"
        to: "https://goldshore.ai/$1"
        status: 308
      - from: "goldshore.org/*"
        to: "https://goldshore.ai/$1"
        status: 308
      - from: "www.goldshore.org/*"
        to: "https://goldshore.ai/$1"
        status: 308
