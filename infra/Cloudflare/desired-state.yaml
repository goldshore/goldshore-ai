cloudflare:
  account_name: goldshore-account
  zone: goldshore.ai
  secondary_zones:
    - goldshore.org

  dns:
    records:
      # A. Web App (gs-web)
      - name: "goldshore.ai"
        type: CNAME
        content: "gs-web.pages.dev"
        proxied: true
      # www.goldshore.ai — DNS auto-provisioned by gs-www-redirect Worker custom_domain; do NOT add a manual CNAME here
      # goldshore.org + www.goldshore.org — owned by goldshore-org Worker (route-based, needs proxied DNS)
      - name: "goldshore.org"
        type: CNAME
        content: "goldshore-org.goldshore.workers.dev"
        proxied: true
      - name: "www.goldshore.org"
        type: CNAME
        content: "goldshore-org.goldshore.workers.dev"
        proxied: true

      # B. Admin (migrated from the standalone gs-admin Pages app into gs-web
      # sub-routes per CLAUDE.md's repo migration plan; gs-web owns
      # admin.goldshore.ai now via the admin.goldshore.ai/* route in
      # apps/gs-web/wrangler.toml). admin.goldshore.org is out of scope here
      # pending the separate goldshore.org ownership conflict
      # (policy/ROUTE_POLICY.md vs docs/architecture/domain-ownership.md) --
      # still points at the legacy gs-admin app until that's resolved.
      - name: "admin"
        type: CNAME
        content: "gs-web-prod.goldshore.workers.dev"
        proxied: true
        zone: goldshore.ai
      - name: "admin"
        type: CNAME
        content: "gs-admin.pages.dev"
        proxied: true
        zone: goldshore.org

      # C. API Gateway Worker
      - name: "gw"
        type: CNAME
        content: "gs-gateway-prod.goldshore.workers.dev"
        proxied: true

      # D. API Worker
      # No DNS record previously existed for api.goldshore.ai at all -- the
      # zone-level Worker Route (api.goldshore.ai/* -> gs-api-prod) had
      # nothing to activate it, so the hostname was down. Content value is
      # mostly cosmetic (the Route intercepts before CNAME resolution
      # matters) but points at the real live worker, gs-api-prod, matching
      # the Route target rather than the nonexistent "gs-api".
      - name: "api"
        type: CNAME
        content: "gs-api-prod.goldshore.workers.dev"
        proxied: true

      # E. Mail Worker
      - name: "mail"
        type: CNAME
        content: "gs-mail.goldshore.workers.dev"
        proxied: true

      # F. Trading dashboard aliases — route-based, protected by GoldShore-Trading-ZT
      - name: "trading"
        type: CNAME
        content: "gs-trading-prod.goldshore.workers.dev"
        proxied: true
      - name: "dashboard"
        type: CNAME
        content: "gs-gateway-prod.goldshore.workers.dev"
        proxied: true
      - name: "dash"
        type: CNAME
        content: "gs-trading-prod.goldshore.workers.dev"
        proxied: true

      # G. Control Worker (ops.goldshore.ai)
      - name: "ops"
        type: CNAME
        content: "gs-core-worker-prod.goldshore.workers.dev"
        proxied: true

      # G. Preview deployments (claude/** branches)
      - name: "preview"
        type: CNAME
        content: "preview-web.pages.dev"
        proxied: true

      # H. SendGrid domain authentication + DMARC
      - name: "em5094"
        type: CNAME
        content: "u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "s1._domainkey"
        type: CNAME
        content: "s1.domainkey.u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "s2._domainkey"
        type: CNAME
        content: "s2.domainkey.u106406774.wl025.sendgrid.net"
        proxied: false
      - name: "_dmarc"
        type: TXT
        content: "v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s; rua=mailto:1e5ceffc36ce4cc09f1bb2281b5344ae@dmarc-reports.cloudflare.net;"

  access:
    # Canonical human-readable IdP matrix: docs/domains-and-auth.md.
    # Keep Access application login methods aligned with that table, but do
    # not encode alternative IdPs as multiple Require selectors because
    # Cloudflare evaluates Require selectors conjunctively.
    policies:
      - name: "GoldShore-Admin-ZT"
        domains:
          - "admin.goldshore.ai"
          - "admin.goldshore.org"
          - "admin-preview.goldshore.ai"
          - "admin.gs-admin.pages.dev"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore Ops"
        domains:
          - "ops.goldshore.ai"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore-Trading-ZT"
        domains:
          - "trading.goldshore.ai"
          - "dashboard.goldshore.ai"
          - "dash.goldshore.ai"
        action: "allow"
        paths:
          - "/*"
        public_paths:
          - "/health"
          - "/version"
          - "/oauth/schwab/callback"
          - "/oauth/robinhood/callback"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore Gateway"
        domains:
          - "gw.goldshore.ai"
          - "agent.goldshore.ai"
          - "gs-agent.goldshore.workers.dev"
        action: "allow"
        paths:
          - "/admin/*"
          - "/internal/*"
          - "/system/*"
          - "/users/*"
          - "/user/*"
          - "/templates/*"
          - "/media/*"
          - "/pages/*"
          - "/ai/*"
        public_paths:
          - "/"
          - "/health"
          - "/status"
          - "/version"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "Goldshore API"
        domains:
          - "api.goldshore.ai"
          - "gs-api.goldshore.workers.dev"
        action: "allow"
        audience: "d303765cb1746f11a0fe37affad2d191deb18771a1d98beb29cb9c52b6cd731b"
        paths:
          - "/admin/*"
          - "/internal/*"
          - "/system/*"
          - "/users/*"
          - "/user/*"
          - "/templates/*"
          - "/media/*"
          - "/pages/*"
          - "/ai/*"
        public_paths:
          - "/"
          - "/health"
          - "/status"
          - "/version"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore-Web-Preview"
        domain: "preview.goldshore.ai"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      # Previously only defined in setup-cf-agent-access.yml; mirrored here so
      # this file stays the single declarative source of Access intent.
      - name: "Signals"
        domains:
          - "signals.goldshore.ai"
          - "signals.goldshore.org"
          - "gs-signals-prod.goldshore.workers.dev"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      - name: "GoldShore MCP"
        domains:
          - "mcp.goldshore.ai"
        action: "allow"
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

      # Browser SSH to the HP laptop (type "ssh" app; gated by the
      # include_ssh_laptop input of setup-cf-agent-access.yml). Requires a
      # cloudflared tunnel on the laptop publishing this hostname with an SSH
      # origin — the Access app alone serves nothing.
      - name: "Temp HP Laptop SSH"
        type: "ssh"
        domains:
          - "ssh-laptop.goldshore.ai"
        action: "allow"
        session_duration: "4h"
        app_launcher_visible: false
        rules:
          include:
            - email_domain: "goldshore.ai"
            - email: "marstonr6@gmail.com"
          allowed_identity_providers:
            - "google_workspace"
            - "github_goldshore_deploy"
            - "github"
            - "email_otp"

  pages:
    projects:
      - name: "gs-web"
        repo: "goldshore-ai"
        root_dir: "/" # Run from repo root for monorepo support
        production_branch: "main"
        build_command: "pnpm --filter @goldshore/gs-web build"
        output_dir: "apps/gs-web/dist"
        # www.goldshore.ai owned by gs-www-redirect Worker (308 → goldshore.ai)
        # goldshore.org + www.goldshore.org owned by goldshore-org Worker (308 → goldshore.ai)
        custom_domains:
          - "goldshore.ai"

      - name: "gs-admin"
        repo: "goldshore-ai"
        root_dir: "/" # Run from repo root for monorepo support
        production_branch: "main"
        build_command: "pnpm --filter @goldshore/gs-admin build"
        output_dir: "apps/gs-admin/dist"
        custom_domains:
          - "admin.goldshore.ai"
          - "admin.goldshore.org"
        bindings:
          kv:
            - name: "KV"
              namespace: "gs_admin_kv_001"
          d1:
            - name: "DB"
              database_name: "goldshore"
              database_id: "gs_db_001"
          r2:
            - name: "ASSETS"
              bucket_name: "gs-assets"
          services:
            - binding: "API_SERVICE"
              service: "gs-api"
              environment: "prod"
          secrets:
            - CLOUDFLARE_ACCESS_AUDIENCE  # set via: wrangler pages secret put
            - ADMIN_API_KEY               # set via: wrangler pages secret put

  workers:
    services:
      - name: "gs-api"
        script_path: "apps/gs-api/dist/index.js"
        routes:
          - pattern: "api.goldshore.ai/*"
        bindings:
          kv:
            - name: "KV"
              namespace: "goldshore-api-kv" # Historical resource name; gs-api canonical service prefix
          d1:
            - name: "DB"
              database_name: "goldshore-api-db" # Historical resource name; gs-api canonical service prefix
          r2:
            - name: "ASSETS"
              bucket_name: "goldshore-api-assets" # Historical resource name; gs-api canonical service prefix
          ai:
            - name: "AI"
              gateway: "goldshore-ai-gateway"

      - name: "gs-gateway"
        script_path: "apps/gs-gateway/dist/index.js"
        routes:
          - pattern: "gw.goldshore.ai/*"
        bindings:
          services:
            - binding: "API"
              service: "gs-api"
              environment: "prod"
          kv:
            - name: "GATEWAY_KV"
              namespace: "goldshore-gw-kv"

      - name: "gs-control"
        script_path: "apps/gs-control/dist/index.js"
        routes:
          - pattern: "ops.goldshore.ai/*"
        bindings:
          services:
            - binding: "API"
              service: "gs-api"
              environment: "prod"
          env_vars:
            CONTROL_SERVICE: "true"

      - name: "gs-mail"
        script_path: "apps/gs-mail/dist/index.js"
        routes:
          - pattern: "mail.goldshore.ai/*"
        bindings:
          env_vars:
            MAIL_SERVICE: "true"
            MAIL_ALLOWED_RECIPIENTS: "ops@goldshore.ai,inbox@goldshore.ai"

  email:
    routing:
      catch_all:
        enabled: true
        destination: "inbox@goldshore.ai"
      addresses:
        - address: "ops@goldshore.ai"
          destination: "your.personal.email@goldshore.ai"
        - address: "support@goldshore.ai"
          destination: "your.personal.email@goldshore.ai"

  redirects:
    canonical_host: "goldshore.ai"
    rules:
      - from: "www.goldshore.ai/*"
        to: "https://goldshore.ai/$1"
        status: 308
      - from: "goldshore.org/*"
        to: "https://goldshore.ai/$1"
        status: 308
      - from: "www.goldshore.org/*"
        to: "https://goldshore.ai/$1"
        status: 308
